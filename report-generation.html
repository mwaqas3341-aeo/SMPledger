<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Generation — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
<style>
  #reportTable{ font-size:11.5px; }
  #reportTable th, #reportTable td{ padding:5px 6px; white-space:nowrap; }
  #reportTable .milk-col{ background:#f6fbff; }
  #reportTable .biscuit-col{ background:#fef9f1; }
  #reportTable .rat-col{ background:#f5f2fb; }
  #reportTable .total-row td{ font-weight:700; background:var(--paper); border-top:2px solid var(--navy); }
  #reportTable .markaz-name{ white-space:normal; }
  .proforma-title{ text-align:center; font-weight:700; font-size:14px; margin-bottom:2px; }
  .proforma-period{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Report Generation</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null;
let cache = { markaz:[], products:[] };
let lastReport = null; // kept around for export

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmtDMY(d){ const dt = new Date(d); const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${dt.getDate()}-${months[dt.getMonth()]}-${dt.getFullYear()}`; }
function shortDate(d){ const dt = new Date(d); return `${dt.getDate()}/${dt.getMonth()+1}`; }
function dateRange(from, to){
  const dates = []; let d = new Date(from); const end = new Date(to);
  while(d <= end){ dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return dates;
}

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderPage();
}

async function loadRefData(){
  const [{ data: markaz }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"),
    sb.from("products").select("id,product_name,unit_name,schedule_dow").eq("active", true),
  ]);
  cache.markaz = markaz || [];
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });
}

/* ===================== PAGE ===================== */
async function renderPage(){
  const content = document.getElementById("content");
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);
  const isTr = currentProfile.role === "tr";

  let scopeNote, tehsilField = "";
  if(isAdmin){
    const tehsils = [...new Set(cache.markaz.map(m => m.tehsil))].filter(Boolean).sort();
    scopeNote = "As an admin, pick a tehsil to generate its full proforma report.";
    tehsilField = `<div><label>Tehsil</label><select name="tehsil" required><option value="">Select…</option>${tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select></div>`;
  } else if(isTr){
    scopeNote = `Generates the full proforma for your tehsil${currentProfile.tehsil ? " (" + esc(currentProfile.tehsil) + ")" : ""}.`;
  } else {
    scopeNote = "Generates the report for your own markaz's schools.";
  }

  content.innerHTML = `
    <div class="card">
      <h3>Select period</h3>
      <p class="sub">${scopeNote} Only the dates each product is actually scheduled on (or specifically allowed via an exception) get their own consumption column - not every date in the range.</p>
      <form id="periodForm" class="form-row">
        <div><label>From</label><input type="date" name="from" value="${daysAgoStr(13)}" required/></div>
        <div><label>To</label><input type="date" name="to" value="${todayStr()}" required/></div>
        ${tehsilField}
        <div style="align-self:end;"><button class="btn-primary" type="submit">Generate report</button></div>
      </form>
      <div id="rangeWarning"></div>
    </div>
    <div class="card" id="reportCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;">Proforma report</h3>
        <div class="actions-row" style="margin:0;">
          <label style="display:flex; align-items:center; gap:6px; font-weight:500; font-size:13px; margin:0;">
            <input type="checkbox" id="includeComparisonCheck" style="width:auto;"/>
            Also include company vs AEO comparison
          </label>
          <button class="btn-secondary" id="exportExcelBtn" type="button">Export Excel</button>
        </div>
      </div>
      <div id="reportHeader"></div>
      <div class="table-wrap"><table id="reportTable"><thead></thead><tbody></tbody></table></div>
    </div>
  `;

  document.getElementById("periodForm").addEventListener("submit", (e) => {
    e.preventDefault();
    generateReport(new FormData(e.target));
  });
}

/* ===================== ALLOWED-DAY COMPUTATION ===================== */
function computeAllowedDates(dates, product, exceptionsByProduct){
  const exceptions = exceptionsByProduct[product.id] || {};
  return dates.filter(d => {
    const ex = exceptions[d];
    if(ex === "blocked") return false;
    if(ex === "allowed") return true;
    const dow = new Date(d + "T00:00:00").getDay();
    return (product.schedule_dow || []).includes(dow);
  });
}

/* ===================== GENERATE ===================== */
async function generateReport(fd){
  const from = fd.get("from"), to = fd.get("to");
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);
  const isTr = currentProfile.role === "tr";
  const tehsil = isAdmin ? fd.get("tehsil") : (isTr ? currentProfile.tehsil : null);

  if(isAdmin && !tehsil){ toast("Select a tehsil first", "bad"); return; }
  if(isTr && !tehsil){ toast("Your account has no tehsil set - contact your admin to fix this in A-I-DB.", "bad"); return; }

  const warnBox = document.getElementById("rangeWarning");
  const allDates = dateRange(from, to);
  warnBox.innerHTML = allDates.length > 62
    ? `<div style="margin-top:12px;background:var(--warn-bg);color:var(--warn-fg);padding:10px 12px;border-radius:8px;font-size:12.5px;">This is a ${allDates.length}-day range - the report may be very wide. A fortnight (14 days) is the typical period for this proforma.</div>`
    : "";

  let schoolsQuery = sb.from("schools").select("id,school_name,emis_code,markaz_id,markaz!inner(name,tehsil)").eq("active", true);
  if(currentProfile.role === "aeo"){
    schoolsQuery = schoolsQuery.eq("markaz_id", currentProfile.markaz_id);
  } else {
    schoolsQuery = schoolsQuery.eq("markaz.tehsil", tehsil);
  }
  const { data: schools, error: schoolErr } = await schoolsQuery;
  if(schoolErr){ toast(schoolErr.message, "bad"); return; }
  if(!schools?.length){ toast("No schools found for this scope", "bad"); return; }

  schools.sort((a, b) => {
    const am = a.markaz?.name || "", bm = b.markaz?.name || "";
    if(am !== bm) return am.localeCompare(bm);
    return (a.emis_code || "").localeCompare(b.emis_code || "");
  });

  const schoolIds = schools.map(s => s.id);
  const markazIds = [...new Set(schools.map(s => s.markaz_id))];

  document.getElementById("reportCard").style.display = "";
  const tbody = document.querySelector("#reportTable tbody");
  tbody.innerHTML = `<tr><td>Loading…</td></tr>`;

  const [{ data: summary, error: sumErr }, { data: dailyRows, error: dayErr },
         { data: exceptions, error: exErr }, { data: aeoDir, error: aeoErr }] = await Promise.all([
    sb.rpc("fn_period_report", { p_school_ids: schoolIds, p_from: from, p_to: to }),
    sb.from("consumption").select("school_id, product_id, consumption_date, quantity")
      .in("school_id", schoolIds).gte("consumption_date", from).lte("consumption_date", to).eq("status", "active"),
    sb.from("schedule_exceptions").select("exception_date, product_id, status").gte("exception_date", from).lte("exception_date", to),
    currentProfile.role === "aeo" ? Promise.resolve({ data: null, error: null }) : sb.rpc("fn_aeo_directory", { p_markaz_ids: markazIds }),
  ]);
  if(sumErr){ tbody.innerHTML = `<tr><td class="err">${esc(sumErr.message)}</td></tr>`; return; }
  if(dayErr){ tbody.innerHTML = `<tr><td class="err">${esc(dayErr.message)}</td></tr>`; return; }
  if(exErr){ tbody.innerHTML = `<tr><td class="err">${esc(exErr.message)}</td></tr>`; return; }
  if(aeoErr){ tbody.innerHTML = `<tr><td class="err">${esc(aeoErr.message)}</td></tr>`; return; }

  const exceptionsByProduct = {};
  (exceptions || []).forEach(e => {
    exceptionsByProduct[e.product_id] = exceptionsByProduct[e.product_id] || {};
    exceptionsByProduct[e.product_id][e.exception_date] = e.status;
  });

  const allowedDatesByProduct = {};
  cache.products.forEach(p => { allowedDatesByProduct[p.id] = computeAllowedDates(allDates, p, exceptionsByProduct); });

  const summaryBy = {};
  (summary || []).forEach(r => {
    summaryBy[r.school_id] = summaryBy[r.school_id] || {};
    summaryBy[r.school_id][r.product_id] = r;
  });
  const dailyBy = {};
  (dailyRows || []).forEach(r => {
    const key = `${r.school_id}|${r.product_id}|${r.consumption_date}`;
    dailyBy[key] = (dailyBy[key] || 0) + Number(r.quantity);
  });
  const aeoByMarkaz = {};
  (aeoDir || []).forEach(r => { aeoByMarkaz[r.markaz_id] = r; });
  if(currentProfile.role === "aeo"){
    aeoByMarkaz[currentProfile.markaz_id] = { aeo_name: currentProfile.full_name, aeo_cell_no: currentProfile.cell_no };
  }

  lastReport = { schools, summaryBy, dailyBy, aeoByMarkaz, allowedDatesByProduct, from, to, tehsil };
  renderReportHeader(tehsil, from, to);
  renderReportTable(schools, summaryBy, dailyBy, aeoByMarkaz, allowedDatesByProduct);
  document.getElementById("exportExcelBtn").onclick = () => exportExcel(lastReport);
}

function renderReportHeader(tehsil, from, to){
  document.getElementById("reportHeader").innerHTML = `
    <div class="proforma-title">PROFORMA REGARDING MEAL PROGRAM${tehsil ? " TEHSIL " + esc(tehsil.toUpperCase()) : ""}</div>
    <div class="proforma-period">FROM ${fmtDMY(from)} &nbsp; TO &nbsp; ${fmtDMY(to)}</div>
  `;
}

/* ===================== TABLE RENDER ===================== */
function renderReportTable(schools, summaryBy, dailyBy, aeoByMarkaz, allowedDatesByProduct){
  const [milk, biscuit] = cache.products;
  const milkDates = allowedDatesByProduct[milk?.id] || [];
  const biscuitDates = allowedDatesByProduct[biscuit?.id] || [];

  const thead = document.querySelector("#reportTable thead");
  const tbody = document.querySelector("#reportTable tbody");

  thead.innerHTML = `
    <tr>
      <th rowspan="3">Sr#</th><th rowspan="3">Tehsil</th><th rowspan="3">EMIS</th><th rowspan="3">School</th>
      <th rowspan="3">Markaz</th><th rowspan="3">AEO</th><th rowspan="3">Cell No</th>
      <th colspan="${3 + milkDates.length}" class="milk-col">MILK</th>
      <th colspan="${3 + biscuitDates.length}" class="biscuit-col">BISCUITS</th>
      <th colspan="4" class="rat-col">STOCK RATIONALIZATION</th>
      <th colspan="2">REMAINING AFTER RATIONALIZATION</th>
    </tr>
    <tr>
      <th class="milk-col">Previous Balance</th><th class="milk-col">Received</th>
      <th colspan="${milkDates.length}" class="milk-col">Consumption</th>
      <th class="milk-col">Remaining</th>
      <th class="biscuit-col">Previous Balance</th><th class="biscuit-col">Received</th>
      <th colspan="${biscuitDates.length}" class="biscuit-col">Consumption</th>
      <th class="biscuit-col">Remaining</th>
      <th class="rat-col">Sent (Milk)</th><th class="rat-col">Received (Milk)</th>
      <th class="rat-col">Sent (Biscuits)</th><th class="rat-col">Received (Biscuits)</th>
      <th>Milk</th><th>Biscuits</th>
    </tr>
    <tr>
      <th class="milk-col"></th><th class="milk-col"></th>
      ${milkDates.map(d => `<th class="milk-col">${shortDate(d)}</th>`).join("")}
      <th class="milk-col"></th>
      <th class="biscuit-col"></th><th class="biscuit-col"></th>
      ${biscuitDates.map(d => `<th class="biscuit-col">${shortDate(d)}</th>`).join("")}
      <th class="biscuit-col"></th>
      <th class="rat-col"></th><th class="rat-col"></th><th class="rat-col"></th><th class="rat-col"></th>
      <th></th><th></th>
    </tr>
  `;

  const totals = { milk:{received:0,remaining:0,sent:0,recv:0,afterMilk:0}, biscuit:{received:0,remaining:0,sent:0,recv:0,afterBiscuit:0} };
  const milkDateTotals = milkDates.map(() => 0);
  const biscuitDateTotals = biscuitDates.map(() => 0);

  const rows = schools.map((s, i) => {
    const aeo = aeoByMarkaz[s.markaz_id] || {};
    const mSum = (summaryBy[s.id] || {})[milk?.id] || { opening:0, received:0, remaining:0, sent_out:0, received_from:0, remaining_after_rationalization:0 };
    const bSum = (summaryBy[s.id] || {})[biscuit?.id] || { opening:0, received:0, remaining:0, sent_out:0, received_from:0, remaining_after_rationalization:0 };

    totals.milk.received += Number(mSum.received);
    totals.milk.remaining += Number(mSum.remaining);
    totals.milk.sent += Number(mSum.sent_out);
    totals.milk.recv += Number(mSum.received_from);
    totals.milk.afterMilk += Number(mSum.remaining_after_rationalization);
    totals.biscuit.received += Number(bSum.received);
    totals.biscuit.remaining += Number(bSum.remaining);
    totals.biscuit.sent += Number(bSum.sent_out);
    totals.biscuit.recv += Number(bSum.received_from);
    totals.biscuit.afterBiscuit += Number(bSum.remaining_after_rationalization);

    const milkDayCells = milkDates.map((d, di) => {
      const v = Number(dailyBy[`${s.id}|${milk?.id}|${d}`] || 0);
      milkDateTotals[di] += v;
      return `<td class="milk-col">${fmt(v)}</td>`;
    }).join("");
    const biscuitDayCells = biscuitDates.map((d, di) => {
      const v = Number(dailyBy[`${s.id}|${biscuit?.id}|${d}`] || 0);
      biscuitDateTotals[di] += v;
      return `<td class="biscuit-col">${fmt(v)}</td>`;
    }).join("");

    return `<tr>
      <td>${i+1}</td>
      <td>${esc(s.markaz?.tehsil)}</td>
      <td>${esc(s.emis_code)}</td>
      <td class="markaz-name">${esc(s.school_name)}</td>
      <td class="markaz-name">${esc(s.markaz?.name)}</td>
      <td>${esc(aeo.aeo_name) || "—"}</td>
      <td>${esc(aeo.aeo_cell_no) || "—"}</td>
      <td class="milk-col">${fmt(mSum.opening)}</td>
      <td class="milk-col">${fmt(mSum.received)}</td>
      ${milkDayCells}
      <td class="milk-col"><b>${fmt(mSum.remaining)}</b></td>
      <td class="biscuit-col">${fmt(bSum.opening)}</td>
      <td class="biscuit-col">${fmt(bSum.received)}</td>
      ${biscuitDayCells}
      <td class="biscuit-col"><b>${fmt(bSum.remaining)}</b></td>
      <td class="rat-col">${fmt(mSum.sent_out)}</td>
      <td class="rat-col">${fmt(mSum.received_from)}</td>
      <td class="rat-col">${fmt(bSum.sent_out)}</td>
      <td class="rat-col">${fmt(bSum.received_from)}</td>
      <td><b>${fmt(mSum.remaining_after_rationalization)}</b></td>
      <td><b>${fmt(bSum.remaining_after_rationalization)}</b></td>
    </tr>`;
  });

  const totalRow = `<tr class="total-row">
    <td colspan="7">TEHSIL GRAND TOTAL</td>
    <td class="milk-col">—</td>
    <td class="milk-col">${fmt(totals.milk.received)}</td>
    ${milkDateTotals.map(v => `<td class="milk-col">${fmt(v)}</td>`).join("")}
    <td class="milk-col">${fmt(totals.milk.remaining)}</td>
    <td class="biscuit-col">—</td>
    <td class="biscuit-col">${fmt(totals.biscuit.received)}</td>
    ${biscuitDateTotals.map(v => `<td class="biscuit-col">${fmt(v)}</td>`).join("")}
    <td class="biscuit-col">${fmt(totals.biscuit.remaining)}</td>
    <td class="rat-col">${fmt(totals.milk.sent)}</td>
    <td class="rat-col">${fmt(totals.milk.recv)}</td>
    <td class="rat-col">${fmt(totals.biscuit.sent)}</td>
    <td class="rat-col">${fmt(totals.biscuit.recv)}</td>
    <td>${fmt(totals.milk.afterMilk)}</td>
    <td>${fmt(totals.biscuit.afterBiscuit)}</td>
  </tr>`;

  tbody.innerHTML = rows.join("") + totalRow;
}

/* ===================== EXPORT ===================== */
async function exportExcel(report){
  const { schools, summaryBy, dailyBy, aeoByMarkaz, allowedDatesByProduct, from, to, tehsil } = report;
  const [milk, biscuit] = cache.products;
  const milkDates = allowedDatesByProduct[milk?.id] || [];
  const biscuitDates = allowedDatesByProduct[biscuit?.id] || [];

  const header1 = ["Sr#","Tehsil","EMIS","School","Markaz","AEO","Cell No",
    "Milk Previous Balance", `Milk Received ${from} to ${to}`,
    ...milkDates.map(d => `Milk ${d}`), "Milk Remaining",
    "Biscuit Previous Balance", `Biscuit Received ${from} to ${to}`,
    ...biscuitDates.map(d => `Biscuit ${d}`), "Biscuit Remaining",
    "Sent (Milk)","Received (Milk)","Sent (Biscuits)","Received (Biscuits)",
    "Remaining After Rationalization - Milk","Remaining After Rationalization - Biscuits"];

  const rows = schools.map((s, i) => {
    const aeo = aeoByMarkaz[s.markaz_id] || {};
    const mSum = (summaryBy[s.id] || {})[milk?.id] || {};
    const bSum = (summaryBy[s.id] || {})[biscuit?.id] || {};
    return [
      i+1, s.markaz?.tehsil, s.emis_code, s.school_name, s.markaz?.name, aeo.aeo_name || "", aeo.aeo_cell_no || "",
      Number(mSum.opening||0), Number(mSum.received||0),
      ...milkDates.map(d => Number(dailyBy[`${s.id}|${milk?.id}|${d}`] || 0)),
      Number(mSum.remaining||0),
      Number(bSum.opening||0), Number(bSum.received||0),
      ...biscuitDates.map(d => Number(dailyBy[`${s.id}|${biscuit?.id}|${d}`] || 0)),
      Number(bSum.remaining||0),
      Number(mSum.sent_out||0), Number(mSum.received_from||0), Number(bSum.sent_out||0), Number(bSum.received_from||0),
      Number(mSum.remaining_after_rationalization||0), Number(bSum.remaining_after_rationalization||0),
    ];
  });

  const ws = XLSX.utils.aoa_to_sheet([
    [`PROFORMA REGARDING MEAL PROGRAM${tehsil ? " TEHSIL " + tehsil.toUpperCase() : ""}`],
    [`FROM ${from} TO ${to}`],
    [],
    header1,
    ...rows,
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Proforma");

  const includeComparison = document.getElementById("includeComparisonCheck")?.checked;
  if(includeComparison){
    const btn = document.getElementById("exportExcelBtn");
    const originalLabel = btn.textContent;
    btn.textContent = "Loading comparison…";
    btn.disabled = true;
    try{
      await addComparisonSheet(wb, schools, from, to);
    }catch(err){
      toast("Could not load comparison data: " + err.message, "bad");
    }finally{
      btn.textContent = originalLabel;
      btn.disabled = false;
    }
  }

  XLSX.writeFile(wb, `smp-proforma-${tehsil || "report"}-${from}-to-${to}.xlsx`);
}

// Same data source as report-comparison.html - RLS already scopes this
// correctly per role (admin/tr see everything, aeo sees their own schools),
// so no extra authorization logic needed here.
async function addComparisonSheet(wb, schools, from, to){
  const schoolIds = schools.map(s => s.id);
  const { data, error } = await sb.from("v_company_vs_aeo_comparison").select("*")
    .gte("delivery_date", from).lte("delivery_date", to)
    .in("school_id", schoolIds)
    .order("delivery_date", { ascending: false });
  if(error) throw error;

  const schoolById = Object.fromEntries(schools.map(s => [s.id, s]));
  const productById = Object.fromEntries(cache.products.map(p => [p.id, p]));

  const header = ["Delivery Date","EMIS","School","Product","Invoice #","Company Qty","AEO Qty","Difference","Status","AEO Certification"];
  const rows = (data || [])
    .sort((a, b) => {
      if(a.delivery_date !== b.delivery_date) return a.delivery_date < b.delivery_date ? 1 : -1;
      return (schoolById[a.school_id]?.emis_code || "").localeCompare(schoolById[b.school_id]?.emis_code || "");
    })
    .map(r => [
      r.delivery_date, schoolById[r.school_id]?.emis_code || "", schoolById[r.school_id]?.school_name || "",
      productById[r.product_id]?.product_name || "", r.invoice_number || "",
      Number(r.company_qty||0), Number(r.aeo_qty||0), Number(r.difference||0),
      r.status, r.aeo_verification_status || "pending",
    ]);

  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  XLSX.utils.book_append_sheet(wb, ws, "Company vs AEO Comparison");
}
</script>
