<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMP Admin — School Meal Program</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="eyebrow">School Education Department · Punjab</div>
    <h1>SMP Admin Panel</h1>
    <div id="loginError" class="err hidden"></div>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required />
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required />
      <button class="btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:18px;text-align:center;">
      Accounts are created by an administrator. There is no self-service sign-up.
    </p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">SMP · Punjab SED</div>
      <h2>Admin Panel</h2>
    </div>
    <nav id="navList"></nav>
    <div class="footer">
      <div id="whoBox">—</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="menuToggle" type="button">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="who" id="topWho"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* =========================================================================
   CONFIG — fill these in, then this file is ready to host on GitHub Pages.
   ========================================================================= */
const SUPABASE_URL = "https://gsswgpqrphqfomvsdooz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdzc3dncHFycGhxZm9tdnNkb296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjE3OTUsImV4cCI6MjEwMjUzNzc5NX0.8NPY8wXzb99eopHpn-lMjSGPfayGAccz-g9f-Ob6gjQ";
const EDGE_FUNCTION_URL = SUPABASE_URL + "/functions/v1/admin-users";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================================
   STATE
   ========================================================================= */
let currentUser = null;   // auth user
let currentProfile = null; // profiles row
let currentSection = "dashboard";
let cache = { markaz: [], schools: [], products: [], users: [] };

const DOW_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* =========================================================================
   HELPERS
   ========================================================================= */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s === null || s === undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
async function callEdge(action, payload){
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData?.session?.access_token;
  const res = await fetch(EDGE_FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || "Request failed");
  return json;
}

/* =========================================================================
   AUTH
   ========================================================================= */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginError");
  errBox.classList.add("hidden");
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errBox.textContent = error.message; errBox.classList.remove("hidden"); return; }
  await afterLogin();
});

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

async function afterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ return showLogin(); }
  currentUser = user;

  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    const errBox = document.getElementById("loginError");
    errBox.textContent = "This account is not active. Contact your administrator.";
    errBox.classList.remove("hidden");
    return showLogin();
  }
  if(!["admin","super_admin"].includes(profile.role)){
    await sb.auth.signOut();
    const errBox = document.getElementById("loginError");
    errBox.textContent = "This panel is for administrators only.";
    errBox.classList.remove("hidden");
    return showLogin();
  }
  currentProfile = profile;
  showApp();
}

function showLogin(){
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}
function showApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("whoBox").innerHTML = `<strong>${esc(currentProfile.full_name)}</strong><br/>${esc(currentProfile.role)}`;
  document.getElementById("topWho").textContent = currentUser.email;
  buildNav();
  navigate("dashboard");
}

/* =========================================================================
   NAV
   ========================================================================= */
const SECTIONS = [
  { id:"dashboard", label:"Dashboard" },
  { id:"users", label:"Users & Accounts" },
  { id:"markaz", label:"Markaz" },
  { id:"schools", label:"Schools" },
  { id:"schedule", label:"Distribution Schedule" },
  { id:"audit", label:"Audit Log" },
];

function buildNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const a = document.createElement("a");
    a.className = "nav-item" + (s.id === currentSection ? " active" : "");
    a.textContent = s.label;
    a.onclick = () => navigate(s.id);
    a.dataset.id = s.id;
    nav.appendChild(a);
  });
}
document.getElementById("menuToggle").onclick = () => document.getElementById("sidebar").classList.toggle("open");

async function navigate(id){
  currentSection = id;
  document.querySelectorAll("#navList .nav-item").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  document.getElementById("sidebar").classList.remove("open");
  const titleMap = Object.fromEntries(SECTIONS.map(s => [s.id, s.label]));
  document.getElementById("pageTitle").textContent = titleMap[id] || "";
  const content = document.getElementById("content");
  content.innerHTML = `<p style="color:var(--ink-soft)">Loading…</p>`;
  try{
    if(id === "dashboard") await renderDashboard(content);
    else if(id === "users") await renderUsers(content);
    else if(id === "markaz") await renderMarkaz(content);
    else if(id === "schools") await renderSchools(content);
    else if(id === "schedule") await renderSchedule(content);
    else if(id === "audit") await renderAudit(content);
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  }
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
async function renderDashboard(content){
  const [{ count: schoolCount }, { count: markazCount }, { count: userCount }, { data: balances }] = await Promise.all([
    sb.from("schools").select("*", { count:"exact", head:true }).eq("active", true),
    sb.from("markaz").select("*", { count:"exact", head:true }).eq("active", true),
    sb.from("profiles").select("*", { count:"exact", head:true }),
    sb.from("v_school_balances").select("*").limit(500),
  ]);
  const zeroStock = (balances || []).filter(b => Number(b.balance) <= 0).length;
  const negative = (balances || []).filter(b => Number(b.balance) < 0).length;

  content.innerHTML = `
    <div class="grid grid-3" style="margin-bottom:22px;">
      <div class="stat"><div class="n">${schoolCount ?? 0}</div><div class="l">Active schools</div></div>
      <div class="stat"><div class="n">${markazCount ?? 0}</div><div class="l">Active markaz</div></div>
      <div class="stat"><div class="n">${userCount ?? 0}</div><div class="l">User accounts</div></div>
      <div class="stat"><div class="n">${zeroStock}</div><div class="l">School·product balances at zero</div></div>
      <div class="stat"><div class="n">${negative}</div><div class="l">Negative balances (should be 0)</div></div>
    </div>
    <div class="card">
      <h3>Getting started</h3>
      <div class="sub">Set up jurisdiction and accounts in this order:</div>
      <ol style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9;">
        <li>Add <strong>Markaz</strong> (jurisdiction units)</li>
        <li>Add <strong>Schools</strong> under each Markaz</li>
        <li>Create <strong>AEO</strong> and <strong>School</strong> accounts under Users & Accounts</li>
        <li>Review the <strong>Distribution Schedule</strong> — adjust or add date exceptions as needed</li>
      </ol>
    </div>`;
}

/* =========================================================================
   USERS & ACCOUNTS
   ========================================================================= */
async function loadRefData(){
  const [{ data: markaz }, { data: schools }] = await Promise.all([
    sb.from("markaz").select("id,name,tehsil,district").order("name"),
    sb.from("schools").select("id,school_name,emis_code,markaz_id").order("school_name"),
  ]);
  cache.markaz = markaz || [];
  cache.schools = schools || [];
}

async function renderUsers(content){
  await loadRefData();
  let users = [];
  try{
    const res = await callEdge("list_users", {});
    users = res.users || [];
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">Could not load users: ${esc(err.message)}</div></div>`;
    return;
  }
  cache.users = users;

  const markazOptions = cache.markaz.map(m => `<option value="${m.id}">${esc(m.name)} (${esc(m.tehsil)})</option>`).join("");
  const schoolOptions = cache.schools.map(s => `<option value="${s.id}">${esc(s.school_name)} — ${esc(s.emis_code)}</option>`).join("");

  content.innerHTML = `
    <div class="card">
      <h3>Create account</h3>
      <div class="sub">Accounts are only created here — there is no public sign-up form.</div>
      <form id="createUserForm">
        <div class="form-row">
          <div><label>Full name</label><input name="full_name" required /></div>
          <div><label>Email</label><input name="email" type="email" required /></div>
          <div><label>Temporary password</label><input name="password" type="text" minlength="8" required placeholder="min 8 characters"/></div>
          <div><label>Role</label>
            <select name="role" id="roleSelect" required>
              <option value="school_user">School user</option>
              <option value="aeo">AEO</option>
              <option value="admin">Admin</option>
              ${currentProfile.role === "super_admin" ? '<option value="super_admin">Super admin</option>' : ""}
            </select>
          </div>
          <div id="markazField"><label>Markaz (for AEO)</label><select name="markaz_id"><option value="">—</option>${markazOptions}</select></div>
          <div id="schoolField" class="hidden"><label>School (for School user)</label><select name="school_id"><option value="">—</option>${schoolOptions}</select></div>
        </div>
        <div class="actions-row"><button class="btn-primary" type="submit">Create account</button></div>
      </form>
    </div>

    <div class="card">
      <h3>All accounts</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Scope</th><th>Status</th><th>Created</th><th></th></tr></thead>
        <tbody>
          ${users.map(u => userRow(u)).join("")}
        </tbody>
      </table></div>
    </div>`;

  const roleSelect = document.getElementById("roleSelect");
  const markazField = document.getElementById("markazField");
  const schoolField = document.getElementById("schoolField");
  function toggleScopeFields(){
    const r = roleSelect.value;
    markazField.classList.toggle("hidden", r !== "aeo");
    schoolField.classList.toggle("hidden", r !== "school_user");
  }
  roleSelect.addEventListener("change", toggleScopeFields);
  toggleScopeFields();

  document.getElementById("createUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      full_name: fd.get("full_name"),
      email: fd.get("email"),
      password: fd.get("password"),
      role: fd.get("role"),
      markaz_id: fd.get("role") === "aeo" ? (fd.get("markaz_id") || null) : null,
      school_id: fd.get("role") === "school_user" ? (fd.get("school_id") || null) : null,
    };
    try{
      await callEdge("create_user", payload);
      toast("Account created");
      navigate("users");
    }catch(err){ toast(err.message, "bad"); }
  });
}

function userRow(u){
  const scope = u.role === "aeo"
    ? (cache.markaz.find(m => m.id === u.markaz_id)?.name || "—")
    : u.role === "school_user"
      ? (cache.schools.find(s => s.id === u.school_id)?.school_name || "—")
      : "All jurisdictions";
  const statusPill = u.active ? `<span class="pill pill-ok">Active</span>` : `<span class="pill pill-bad">Inactive</span>`;
  return `<tr>
    <td>${esc(u.full_name)}</td>
    <td>${esc(u.email)}</td>
    <td><span class="pill pill-role">${esc(u.role)}</span></td>
    <td>${esc(scope)}</td>
    <td>${statusPill}</td>
    <td>${fmtDate(u.created_at)}</td>
    <td>
      <button class="link-btn" onclick="openResetPassword('${u.id}','${esc(u.full_name).replace(/'/g,"\\'")}')">Reset password</button>
      <button class="link-btn ${u.active ? 'danger' : ''}" onclick="toggleActive('${u.id}', ${u.active})">${u.active ? "Deactivate" : "Activate"}</button>
    </td>
  </tr>`;
}

async function openResetPassword(userId, name){
  const pw = prompt(`New password for ${name} (min 8 characters):`);
  if(!pw) return;
  if(pw.length < 8){ toast("Password must be at least 8 characters", "bad"); return; }
  try{
    await callEdge("reset_password", { user_id: userId, new_password: pw });
    toast("Password updated");
  }catch(err){ toast(err.message, "bad"); }
}

async function toggleActive(userId, isActive){
  if(!confirm(isActive ? "Deactivate this account?" : "Activate this account?")) return;
  try{
    await callEdge("set_active", { user_id: userId, active: !isActive });
    toast(isActive ? "Account deactivated" : "Account activated");
    navigate("users");
  }catch(err){ toast(err.message, "bad"); }
}

/* =========================================================================
   MARKAZ
   ========================================================================= */
async function renderMarkaz(content){
  const { data: markaz, error } = await sb.from("markaz").select("*").order("district").order("tehsil").order("name");
  if(error) throw error;
  cache.markaz = markaz || [];

  content.innerHTML = `
    <div class="card">
      <h3>Add Markaz</h3>
      <form id="markazForm">
        <div class="form-row">
          <div><label>Name</label><input name="name" required /></div>
          <div><label>Tehsil</label><input name="tehsil" required /></div>
          <div><label>District</label><input name="district" required /></div>
        </div>
        <div class="actions-row"><button class="btn-primary" type="submit">Add Markaz</button></div>
      </form>
    </div>
    <div class="card">
      <h3>All Markaz</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Tehsil</th><th>District</th><th>Status</th><th></th></tr></thead>
        <tbody>${(markaz||[]).map(m => `
          <tr>
            <td>${esc(m.name)}</td><td>${esc(m.tehsil)}</td><td>${esc(m.district)}</td>
            <td>${m.active ? '<span class="pill pill-ok">Active</span>' : '<span class="pill pill-bad">Inactive</span>'}</td>
            <td><button class="link-btn" onclick="toggleMarkaz('${m.id}', ${m.active})">${m.active ? "Deactivate" : "Activate"}</button></td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </div>`;

  document.getElementById("markazForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { error } = await sb.from("markaz").insert({ name: fd.get("name"), tehsil: fd.get("tehsil"), district: fd.get("district") });
    if(error){ toast(error.message, "bad"); return; }
    toast("Markaz added");
    navigate("markaz");
  });
}
async function toggleMarkaz(id, isActive){
  const { error } = await sb.from("markaz").update({ active: !isActive }).eq("id", id);
  if(error){ toast(error.message, "bad"); return; }
  navigate("markaz");
}

/* =========================================================================
   SCHOOLS
   ========================================================================= */
async function renderSchools(content){
  const [{ data: schools, error }, { data: markaz }] = await Promise.all([
    sb.from("schools").select("*").order("school_name"),
    sb.from("markaz").select("id,name").order("name"),

  if(error) throw error;
  cache.schools = schools || [];
  cache.markaz = markaz || [];
  const markazOptions = cache.markaz.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");

  content.innerHTML = `
    <div class="card">
      <h3>Add School</h3>
      <form id="schoolForm">
        <div class="form-row">
          <div><label>EMIS Code</label><input name="emis_code" required /></div>
          <div><label>School Name</label><input name="school_name" required /></div>
          <div><label>Markaz</label><select name="markaz_id" required><option value="">Select…</option>${markazOptions}</select></div>
          <div><label>School Type</label><input name="school_type" placeholder="e.g. Primary, Elementary" /></div>
        </div>
        <div class="actions-row"><button class="btn-primary" type="submit">Add School</button></div>
      </form>
    </div>
    <div class="card">
      <h3>All Schools (${cache.schools.length})</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>EMIS</th><th>School</th><th>Markaz</th><th>Type</th><th>Status</th><th></th></tr></thead>
        <tbody>${cache.schools.map(s => `
          <tr>
            <td>${esc(s.emis_code)}</td><td>${esc(s.school_name)}</td>
            <td>${esc(cache.markaz.find(m=>m.id===s.markaz_id)?.name || "—")}</td>
            <td>${esc(s.school_type || "—")}</td>
            <td>${s.active ? '<span class="pill pill-ok">Active</span>' : '<span class="pill pill-bad">Inactive</span>'}</td>
            <td><button class="link-btn" onclick="toggleSchool('${s.id}', ${s.active})">${s.active ? "Deactivate" : "Activate"}</button></td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </div>`;

  document.getElementById("schoolForm").addEventListener("submit", async (e) => {

    const fd = new FormData(e.target);

      emis_code: fd.get("emis_code"), school_name: fd.get("school_name"),
      markaz_id: fd.get("markaz_id"), school_type: fd.get("school_type") || null,

    if(error){ toast(error.message, "bad"); return; }
    toast("School added");

async function toggleSchool(id, isActive){
  const { error } = await sb.from("schools").update({ active: !isActive }).eq("id", id);
  if(error){ toast(error.message, "bad"); return; }
  navigate("schools");
}

/* =========================================================================
   DISTRIBUTION SCHEDULE  (products.schedule_dow + schedule_exceptions)
   ========================================================================= */
async function renderSchedule(content){
  const [{ data: products, error: pErr }, { data: exceptions, error: eErr }, { data: schoolsAll }] = await Promise.all([
    sb.from("products").select("*").order("product_name"),
    sb.from("schedule_exceptions").select("*, products(product_name)").order("exception_date", { ascending:false }).limit(100),
    sb.from("schools").select("id").limit(1),
  ]);
  if(pErr) throw pErr;
  if(eErr) throw eErr;
  cache.products = products || [];

  content.innerHTML = `
    <div class="card">
      <h3>Default weekly schedule</h3>
      <div class="sub">Which weekday(s) each product is normally distributed on. Changes apply immediately to new consumption entries.</div>
      <div id="productScheduleList"></div>
    </div>
    <div class="card">
      <h3>Add a date exception</h3>
      <div class="sub">Override the default schedule for one specific date and product — e.g. block a holiday, or allow an ad-hoc distribution.</div>
      <form id="exceptionForm">
        <div class="form-row">
          <div><label>Date</label><input type="date" name="exception_date" required /></div>
          <div><label>Product</label>
            <select name="product_id" required>${cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("")}</select>
          </div>
          <div><label>Rule</label>
            <select name="status" required>
              <option value="blocked">Block distribution this date</option>
              <option value="allowed">Allow distribution this date (exception to weekly schedule)</option>
            </select>
          </div>
          <div><label>Reason</label><input name="reason" placeholder="e.g. Public holiday" /></div>
        </div>
        <div class="actions-row"><button class="btn-primary" type="submit">Add exception</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Recent exceptions</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Product</th><th>Rule</th><th>Reason</th><th></th></tr></thead>
        <tbody>${(exceptions||[]).map(x => `
          <tr>
            <td>${fmtDate(x.exception_date)}</td>
            <td>${esc(x.products?.product_name || "—")}</td>
            <td>${x.status === "blocked" ? '<span class="pill pill-bad">Blocked</span>' : '<span class="pill pill-ok">Allowed</span>'}</td>
            <td>${esc(x.reason || "—")}</td>
            <td><button class="link-btn danger" onclick="deleteException('${x.id}')">Remove</button></td>
          </tr>`).join("") || `<tr><td colspan="5" style="color:var(--ink-soft)">No exceptions recorded.</td></tr>`}
        </tbody>
      </table></div>
    </div>`;

  const list = document.getElementById("productScheduleList");
  cache.products.forEach(p => {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "16px";
    wrap.innerHTML = `
      <label style="margin-bottom:2px;">${esc(p.product_name)} <span style="color:var(--ink-soft);font-weight:400;">(${esc(p.unit_name)})</span></label>
      <div class="dow-check">
        ${DOW_LABELS.map((lbl, i) => `
          <label><input type="checkbox" data-product="${p.id}" value="${i}" ${p.schedule_dow.includes(i) ? "checked" : ""}/> ${lbl}</label>
        `).join("")}
      </div>`;
    list.appendChild(wrap);
  });
  const saveBtnWrap = document.createElement("div");
  saveBtnWrap.className = "actions-row";
  saveBtnWrap.innerHTML = `<button class="btn-primary" id="saveScheduleBtn">Save schedule</button>`;
  list.appendChild(saveBtnWrap);

  document.getElementById("saveScheduleBtn").addEventListener("click", async () => {
    try{
      for(const p of cache.products){
        const checked = Array.from(document.querySelectorAll(`input[data-product="${p.id}"]:checked`)).map(el => Number(el.value));
        const { error } = await sb.from("products").update({ schedule_dow: checked }).eq("id", p.id);
        if(error) throw error;
      }
      toast("Schedule updated");
    }catch(err){ toast(err.message, "bad"); }
  });

  document.getElementById("exceptionForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { error } = await sb.from("schedule_exceptions").insert({
      exception_date: fd.get("exception_date"),
      product_id: fd.get("product_id"),
      status: fd.get("status"),
      reason: fd.get("reason") || null,
      created_by: currentUser.id,
    });
    if(error){ toast(error.message, "bad"); return; }
    toast("Exception added");
    navigate("schedule");
  });
}
async function deleteException(id){
  if(!confirm("Remove this schedule exception?")) return;
  const { error } = await sb.from("schedule_exceptions").delete().eq("id", id);
  if(error){ toast(error.message, "bad"); return; }
  navigate("schedule");
}

/* =========================================================================
   AUDIT LOG
   ========================================================================= */
async function renderAudit(content){
  const { data: logs, error } = await sb.from("audit_logs").select("*").order("created_at", { ascending:false }).limit(200);
  if(error) throw error;
  content.innerHTML = `
    <div class="card">
      <h3>Recent activity</h3>
      <div class="sub">Latest 200 audited actions across the system.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>When</th><th>Action</th><th>Table</th><th>Record</th></tr></thead>
        <tbody>${(logs||[]).map(l => `
          <tr>
            <td>${new Date(l.created_at).toLocaleString()}</td>
            <td><span class="pill pill-role">${esc(l.action)}</span></td>
            <td>${esc(l.table_name || "—")}</td>
            <td style="font-family:monospace;font-size:11px;">${esc((l.record_id||"").slice(0,8))}</td>
          </tr>`).join("") || `<tr><td colspan="4" style="color:var(--ink-soft)">No activity recorded yet.</td></tr>`}
        </tbody>
      </table></div>
    </div>`;
}

   BOOTSTRAP
   ========================================================================= */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); } else { showLogin(); }
})();
</script>
