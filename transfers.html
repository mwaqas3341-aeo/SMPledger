<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMP Transfers &amp; Rationalization — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Transfers & Rationalization</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div class="menu-cards" id="navList"></div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null, currentSection = "transfers";
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
// Standard school ordering used everywhere in this app: markaz name A-Z,
// then EMIS code A-Z within each markaz. Sorted client-side (not via an
// .order() on the query) because the sort key lives on the markaz table,
// not on schools - and every page already has cache.markaz loaded.
// ---- Jurisdiction scoping (single source of truth, mirrors the DB) ----
// A person's access is: their home markaz PLUS any additional markaz they
// hold charge of (A-I-DB scope_value when scope_type=Markaz), or - for a
// TR - their whole tehsil, optionally narrowed to one wing (A-I-DB
// scope_value '<TEHSIL>:<WING>'). Both used to be dropped, which is why
// additional-charge markaz were invisible and wing-restricted people saw
// the whole tehsil. RLS enforces the same rule server-side; this exists so
// the UI shows exactly what the person can actually act on.
function myMarkazIds(){
  return [currentProfile.markaz_id, ...(currentProfile.extra_markaz_ids || [])].filter(Boolean);
}
function scopeSchoolsQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("markaz_id", ids) : q.eq("markaz_id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "school_user"){
    q = q.eq("id", currentProfile.school_id);
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("markaz.tehsil", currentProfile.tehsil);
    if(currentProfile.wing_scope) q = q.eq("wing", currentProfile.wing_scope);
  }
  return q;
}
function scopeMarkazQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("id", ids) : q.eq("id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("tehsil", currentProfile.tehsil);
  }
  return q;
}

function sortSchoolsStandard(schools){
  const markazName = {};
  (cache.markaz || []).forEach(m => { markazName[m.id] = m.name || ""; });
  return (schools || []).slice().sort((a, b) =>
    (markazName[a.markaz_id] || "").localeCompare(markazName[b.markaz_id] || "")
    || (a.emis_code || "").localeCompare(b.emis_code || "")
  );
}

function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  if(!["admin","super_admin","tr","aeo"].includes(profile.role)){
    alert("Transfers and rationalization are managed by AEOs and administrators.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
    buildNav();
  // Allow deep-linking straight into a section, e.g. transfers.html?section=loans
  // from the dashboard's "Stock Rationalization" card.
  const requested = new URLSearchParams(window.location.search).get("section");
  const validIds = SECTIONS.map(s => s.id);
  navigate(validIds.includes(requested) ? requested : "transfers");
}

async function loadRefData(){
  const markazQuery = scopeMarkazQuery(sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"));
  const [{ data: markaz }, { data: products }] = await Promise.all([
    markazQuery,
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  // Milk first, then Biscuit - matches the convention every other page uses
  // (and matters here since the Rationalization form now shows one quantity
  // field per product in this order, not a dropdown).
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });

  const schoolsQuery = scopeSchoolsQuery(
    sb.from("schools").select("id,school_name,emis_code,markaz_id,wing,markaz!inner(tehsil)").eq("active", true)
  );
  const { data: schools } = await schoolsQuery;
  cache.schools = sortSchoolsStandard(schools);
}

/* ===================== NAV ===================== */
const SECTIONS = [
  { id:"transfers", label:"Transfers" },
  { id:"loans", label:"Stock Rationalization" },
  { id:"outstanding", label:"Outstanding Rationalization" },
];
function buildNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const a = document.createElement("a");
    a.className = "menu-card" + (s.id === currentSection ? " active" : "");
    a.innerHTML = `<span class="label">${s.label}</span>` + (s.desc ? `<span class="desc">${s.desc}</span>` : "");
    a.dataset.id = s.id;
    a.onclick = () => navigate(s.id);
    nav.appendChild(a);
  });
}

async function navigate(id){
  currentSection = id;
  document.querySelectorAll("#navList .menu-card").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  const content = document.getElementById("content");
  content.innerHTML = `<p style="color:var(--ink-soft)">Loading…</p>`;
  try{
    if(id === "transfers") await renderTransfers(content);
    else if(id === "loans") await renderLoans(content);
    else if(id === "outstanding") await renderOutstanding(content);
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  }
}

/* ===================== Shared: Markaz / School / Product pickers ===================== */
function markazOptions(){ return cache.markaz.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join(""); }
function productOptions(){ return cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)} (${esc(p.unit_name)})</option>`).join(""); }
function schoolOptionsFor(markazId){
  const list = markazId ? cache.schools.filter(s => s.markaz_id === markazId) : cache.schools;
  // When no markaz is picked yet the list can span several markaz (an AEO with
  // additional charge, or a TR), so name the markaz on each option - moving
  // stock to the wrong school is not easily undone.
  return list.map(s => {
    const mk = cache.markaz.find(m => m.id === s.markaz_id)?.name;
    return `<option value="${s.id}">${esc(s.school_name)} — ${esc(s.emis_code)}${mk ? ` (${esc(mk)})` : ""}</option>`;
  }).join("");
}
function wireMarkazSchoolFilters(form){
  const markazSel = form.querySelector('select[name="markaz_id"]');
  const fromSel = form.querySelector('select[name="from_school_id"]');
  const toSel = form.querySelector('select[name="to_school_id"]');
  function refresh(){
    const opts = `<option value="">Select…</option>${schoolOptionsFor(markazSel.value)}`;
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
  }
  markazSel.addEventListener("change", refresh);
  refresh();
}

/* ===================== TRANSFERS ===================== */
async function renderTransfers(content){
  const { data: transfers, error } = await sb.from("school_transfers")
    .select("*, from:schools!school_transfers_from_school_id_fkey(school_name), to:schools!school_transfers_to_school_id_fkey(school_name), products(product_name,unit_name), markaz(name)")
    .order("transfer_date", { ascending:false }).limit(50);
  if(error) throw error;

  content.innerHTML = `
    <div class="card">
      <h3>Permanent transfer</h3>
      <div class="sub">Stock permanently moves from one school to another — no return expected.</div>
      <form id="transferForm">
        <div class="form-row">
          <div><label>Markaz</label><select name="markaz_id" required><option value="">Select…</option>${markazOptions()}</select></div>
          <div><label>Product</label><select name="product_id" required>${productOptions()}</select></div>
          <div><label>From School</label><select name="from_school_id" required></select></div>
          <div><label>To School</label><select name="to_school_id" required></select></div>
          <div><label>Quantity</label><input type="number" min="0" step="0.01" name="quantity" required /></div>
          <div><label>Date</label><input type="date" name="transfer_date" required value="${todayStr()}"/></div>
          <div><label>Reason</label><input name="reason" /></div>
        </div>
        <div class="actions-row"><button class="btn-primary" type="submit">Create transfer</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Recent transfers</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Markaz</th><th>Product</th><th>From</th><th>To</th><th>Qty</th><th>Status</th></tr></thead>
        <tbody>${(transfers||[]).map(t => `
          <tr>
            <td>${fmtDate(t.transfer_date)}</td>
            <td>${esc(t.markaz?.name || "—")}</td>
            <td>${esc(t.products?.product_name || "—")}</td>
            <td>${esc(t.from?.school_name || "—")}</td>
            <td>${esc(t.to?.school_name || "—")}</td>
            <td>${t.quantity} ${esc(t.products?.unit_name || "")}</td>
            <td><span class="pill pill-ok">${esc(t.status)}</span></td>
          </tr>`).join("") || `<tr><td colspan="7" style="color:var(--ink-soft)">No transfers yet.</td></tr>`}
        </tbody>
      </table></div>
    </div>`;

  const form = document.getElementById("transferForm");
  wireMarkazSchoolFilters(form);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    try{
      const { error } = await sb.rpc("fn_create_transfer", {
        p_markaz_id: fd.get("markaz_id"),
        p_product_id: fd.get("product_id"),
        p_from_school_id: fd.get("from_school_id"),
        p_to_school_id: fd.get("to_school_id"),
        p_quantity: Number(fd.get("quantity")),
        p_transfer_date: fd.get("transfer_date"),
        p_reason: fd.get("reason") || null,
      });
      if(error) throw error;
      toast("Transfer created");
      navigate("transfers");
    }catch(err){ toast(err.message, "bad"); }
  });
}

/* ===================== LOANS ===================== */
function productQtyFields(){
  return cache.products.map(p => `
    <div><label>Quantity of ${esc(p.product_name)} ${esc(p.unit_name || "packs")} Rationalized</label>
      <input type="number" min="0" step="0.01" name="qty_${p.id}" placeholder="0" />
    </div>`).join("");
}

async function renderLoans(content){
  const { data: loans, error } = await sb.from("inventory_loans")
    .select("*, from:schools!inventory_loans_from_school_id_fkey(school_name,markaz_id), to:schools!inventory_loans_to_school_id_fkey(school_name), products(product_name,unit_name)")
    .order("loan_date", { ascending:false }).limit(50);
  if(error) throw error;

  content.innerHTML = `
    <div class="card">
      <h3>New rationalization</h3>
      <div class="sub">Stock moves temporarily and is expected back — track it here through to return. Enter a quantity for either or both products; a rationalization record is created for each product you fill in.</div>
      <form id="loanForm">
        <div class="form-row">
          <div><label>Markaz</label><select name="markaz_id" required><option value="">Select…</option>${markazOptions()}</select></div>
          <div><label>From School (lender)</label><select name="from_school_id" required></select></div>
          <div><label>To School (borrower)</label><select name="to_school_id" required></select></div>
          ${productQtyFields()}
          <div><label>Rationalization Date</label><input type="date" name="loan_date" required value="${todayStr()}"/></div>
          <div><label>Expected Return Date</label><input type="date" name="expected_return_date" /></div>
          <div><label>Reason</label><input name="reason" /></div>
        </div>
        <div class="actions-row"><button class="btn-primary" type="submit">Create rationalization</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Recent rationalization records</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Markaz</th><th>Product</th><th>From</th><th>To</th><th>Qty</th><th>Returned</th><th>Status</th><th></th></tr></thead>
        <tbody>${(loans||[]).map(l => loanRow(l)).join("") || `<tr><td colspan="9" style="color:var(--ink-soft)">No rationalization records yet.</td></tr>`}</tbody>
      </table></div>
    </div>`;

  const form = document.getElementById("loanForm");
  wireMarkazSchoolFilters(form);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const entries = cache.products
      .map(p => ({ product: p, qty: Number(fd.get(`qty_${p.id}`) || 0) }))
      .filter(x => x.qty > 0);

    if(!entries.length){
      toast("Enter a quantity for at least one product", "bad");
      return;
    }

    const results = await Promise.all(entries.map(async ({ product, qty }) => {
      const { error } = await sb.rpc("fn_create_loan", {
        p_markaz_id: fd.get("markaz_id"),
        p_product_id: product.id,
        p_from_school_id: fd.get("from_school_id"),
        p_to_school_id: fd.get("to_school_id"),
        p_quantity: qty,
        p_loan_date: fd.get("loan_date"),
        p_reason: fd.get("reason") || null,
        p_expected_return_date: fd.get("expected_return_date") || null,
      });
      return { product, ok: !error, message: error?.message };
    }));

    // Each product is an independent record under the hood (same pattern as
    // My Receipts' checkbox entry), so report success/failure per product
    // rather than all-or-nothing - one product's failure (e.g. insufficient
    // stock) shouldn't hide that the other one actually saved.
    const ok = results.filter(r => r.ok);
    const bad = results.filter(r => !r.ok);
    if(ok.length) toast(`Rationalized: ${ok.map(r => r.product.product_name).join(", ")}`);
    bad.forEach(r => toast(`${r.product.product_name}: ${r.message}`, "bad"));
    navigate("loans");
  });
}
function loanStatusPill(status){
  const map = { pending:"pill-warn", approved:"pill-ok", partially_returned:"pill-warn", returned:"pill-ok", cancelled:"pill-bad" };
  return `<span class="pill ${map[status]||'pill-role'}">${esc(status.replace('_',' '))}</span>`;
}
function loanRow(l){
  const outstanding = Number(l.quantity) - Number(l.returned_quantity);
  return `<tr>
    <td>${fmtDate(l.loan_date)}</td>
    <td>${esc(cache.markaz.find(m => m.id === l.from?.markaz_id)?.name || "—")}</td>
    <td>${esc(l.products?.product_name || "—")}</td>
    <td>${esc(l.from?.school_name || "—")}</td>
    <td>${esc(l.to?.school_name || "—")}</td>
    <td>${l.quantity} ${esc(l.products?.unit_name || "")}</td>
    <td>${l.returned_quantity}</td>
    <td>${loanStatusPill(l.status)}</td>
    <td>${outstanding > 0 && l.status !== "cancelled" ? `<button class="link-btn" onclick="openReturnLoan('${l.id}', ${outstanding}, '${esc(l.products?.unit_name||'').replace(/'/g,"\\'")}')">Record return</button>` : ""}</td>
  </tr>`;
}
async function openReturnLoan(loanId, outstanding, unit){
  const qtyStr = prompt(`Quantity being returned now (outstanding: ${outstanding} ${unit}):`, outstanding);
  if(!qtyStr) return;
  const qty = Number(qtyStr);
  if(!qty || qty <= 0){ toast("Enter a valid quantity", "bad"); return; }
  try{
    const { error } = await sb.rpc("fn_return_loan", {
      p_loan_id: loanId,
      p_quantity_returned: qty,
      p_return_date: todayStr(),
    });
    if(error) throw error;
    toast("Return recorded");
    navigate("loans");
  }catch(err){ toast(err.message, "bad"); }
}

/* ===================== OUTSTANDING LOANS ===================== */
async function renderOutstanding(content){
  const { data, error } = await sb.from("v_outstanding_loans").select("*").order("loan_date", { ascending:false }).limit(200);
  if(error) throw error;

  const schoolById = Object.fromEntries(cache.schools.map(s => [s.id, s]));
  const productById = Object.fromEntries(cache.products.map(p => [p.id, p]));

  content.innerHTML = `
    <div class="card">
      <h3>Outstanding rationalization</h3>
      <div class="sub">Rationalization not yet fully returned.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Product</th><th>From</th><th>To</th><th>Quantity</th><th>Returned</th><th>Outstanding</th><th>Expected Return</th><th>Status</th></tr></thead>
        <tbody>${(data||[]).map(l => `
          <tr>
            <td>${fmtDate(l.loan_date)}</td>
            <td>${esc(productById[l.product_id]?.product_name || "—")}</td>
            <td>${esc(schoolById[l.from_school_id]?.school_name || "—")}</td>
            <td>${esc(schoolById[l.to_school_id]?.school_name || "—")}</td>
            <td>${l.quantity}</td>
            <td>${l.returned_quantity}</td>
            <td><strong>${Number(l.outstanding_quantity).toFixed(2)}</strong></td>
            <td>${fmtDate(l.expected_return_date)}</td>
            <td>${loanStatusPill(l.status)}</td>
          </tr>`).join("") || `<tr><td colspan="9" style="color:var(--ink-soft)">No outstanding rationalization.</td></tr>`}
        </tbody>
      </table></div>
    </div>`;
}

</script>
</body>
</html>
