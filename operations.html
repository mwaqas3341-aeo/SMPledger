<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operations — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Operations</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/*
  Note on scope: this page previously carried "Company Deliveries", "School
  Receipts", and a "Comparison Dashboard" section ported from an earlier
  build. All three are now properly homed elsewhere - company data upload
  lives in report-comparison.html's wizard, AEO receipt entry lives in
  inventory.html's "My Receipts" section, and the comparison view lives in
  report-comparison.html (admin/TR only - the old copy here was wrongly
  visible to aeo/school_user too). Keeping duplicate copies here would mean
  two different UIs writing to the same tables with room to drift out of
  sync, so they were removed rather than kept as a second entry point.

  What's actually new here: Inventory Adjustments - the backend RPC
  (fn_create_adjustment) already existed before this session touched the
  project, but had no UI anywhere until now.
*/

const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

let currentUser = null, currentProfile = null;
let cache = { markaz:[], schools:[], products:[] };

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  // Adjustments are enforced admin-only at the database level (fn_create_adjustment
  // itself checks fn_is_admin()) - gating the page the same way avoids showing a
  // form that would just fail server-side for anyone else.
  if(!["admin","super_admin"].includes(profile.role)){
    alert("Inventory Adjustments is only available to admins.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderPage();
}

async function loadRefData(){
  const [{ data: markaz }, { data: schools }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name").eq("active", true).order("name"),
    sb.from("schools").select("id,school_name,emis_code,markaz_id").eq("active", true).order("emis_code"),
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  cache.schools = schools || [];
  cache.products = products || [];
}

async function renderPage(){
  const content = document.getElementById("content");
  const schoolOpts = cache.schools.map(s => `<option value="${s.id}">${esc(s.emis_code)} — ${esc(s.school_name)}</option>`).join("");
  const markazOpts = cache.markaz.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const productOpts = cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");

  content.innerHTML = `
    <div class="card">
      <h3>Post an inventory adjustment</h3>
      <p class="sub">Corrects a school's or markaz's balance directly - spoilage, damage, a physical count correction, etc. Use a negative quantity to reduce stock, positive to increase it.</p>
      <form id="adjForm" class="form-row">
        <div><label>Level</label>
          <select name="entity_type" id="entityType" required>
            <option value="school">School</option>
            <option value="markaz">Markaz</option>
          </select>
        </div>
        <div id="schoolField"><label>School</label><select name="school_id"><option value="">Select…</option>${schoolOpts}</select></div>
        <div id="markazField" class="hidden"><label>Markaz</label><select name="markaz_id"><option value="">Select…</option>${markazOpts}</select></div>
        <div><label>Product</label><select name="product_id" required><option value="">Select…</option>${productOpts}</select></div>
        <div><label>Quantity (+/-)</label><input type="number" name="quantity" step="0.01" required placeholder="e.g. -12 or 5"/></div>
        <div><label>Date</label><input type="date" name="adjustment_date" value="${todayStr()}" required/></div>
        <div style="grid-column:1/-1;"><label>Reason</label><input type="text" name="reason" required placeholder="e.g. Spoiled during transport"/></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Post adjustment</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Recent adjustments</h3>
      <div class="table-wrap"><table id="adjTable"><thead><tr>
        <th>Date</th><th>Level</th><th>School / Markaz</th><th>Product</th><th>Qty</th><th>Reason</th>
      </tr></thead><tbody><tr><td colspan="6" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  const entityType = document.getElementById("entityType");
  const schoolField = document.getElementById("schoolField");
  const markazField = document.getElementById("markazField");
  function toggleFields(){
    const isSchool = entityType.value === "school";
    schoolField.classList.toggle("hidden", !isSchool);
    markazField.classList.toggle("hidden", isSchool);
  }
  entityType.addEventListener("change", toggleFields);
  toggleFields();

  document.getElementById("adjForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const entity = fd.get("entity_type");
    try{
      const { error } = await sb.rpc("fn_create_adjustment", {
        p_entity_type: entity,
        p_school_id: entity === "school" ? (fd.get("school_id") || null) : null,
        p_markaz_id: entity === "markaz" ? (fd.get("markaz_id") || null) : null,
        p_product_id: fd.get("product_id"),
        p_quantity: fd.get("quantity"),
        p_adjustment_date: fd.get("adjustment_date"),
        p_reason: fd.get("reason"),
      });
      if(error) throw error;
      toast("Adjustment posted");
      e.target.reset();
      toggleFields();
      e.target.querySelector('[name="adjustment_date"]').value = todayStr();
      await loadAdjustments();
    }catch(err){ toast(err.message, "bad"); }
  });

  await loadAdjustments();
}

async function loadAdjustments(){
  const tbody = document.querySelector("#adjTable tbody");
  const { data, error } = await sb
    .from("inventory_adjustments")
    .select("adjustment_date, entity_type, quantity, reason, schools(emis_code,school_name), markaz(name), products(product_name,unit_name)")
    .order("adjustment_date", { ascending: false })
    .order("created_at", { ascending: false })
    .limit(100);

  if(error){ tbody.innerHTML = `<tr><td colspan="6" class="err">${esc(error.message)}</td></tr>`; return; }
  if(!data?.length){ tbody.innerHTML = `<tr><td colspan="6" style="color:var(--ink-soft)">No adjustments posted yet.</td></tr>`; return; }

  tbody.innerHTML = data.map(r => `
    <tr>
      <td>${fmtDate(r.adjustment_date)}</td>
      <td>${esc(r.entity_type)}</td>
      <td>${r.entity_type === "school" ? esc(r.schools?.emis_code) + " — " + esc(r.schools?.school_name) : esc(r.markaz?.name)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td style="color:${Number(r.quantity) < 0 ? "var(--bad-fg)" : "var(--ok-fg)"}">${Number(r.quantity) > 0 ? "+" : ""}${fmt(r.quantity)}</td>
      <td>${esc(r.reason)}</td>
    </tr>
  `).join("");
}
</script>
</body>
</html>
