<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operations — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Operations</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/*
  Note on scope: this page previously carried "Company Deliveries", "School
  Receipts", and a "Comparison Dashboard" section ported from an earlier
  build. All three are now properly homed elsewhere - company data upload
  lives in report-comparison.html's wizard, AEO receipt entry lives in
  inventory.html's "My Receipts" section, and the comparison view lives in
  report-comparison.html (admin/TR only - the old copy here was wrongly
  visible to aeo/school_user too). Keeping duplicate copies here would mean
  two different UIs writing to the same tables with room to drift out of
  sync, so they were removed rather than kept as a second entry point.

  What's here now: Inventory Adjustments (admin-only, unchanged) plus a new
  Missing Consumption card - open to aeo/tr/admin/school_user, each scoped
  to their own jurisdiction, admin/tr able to narrow further and export a
  CSV of schools that haven't logged a consumption entry for a given day.
*/

const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

let currentUser = null, currentProfile = null;
let cache = { markaz:[], schools:[], products:[] };
let lastMissing = null; // kept around for CSV export
const WING_OPTIONS = ["M-EE", "W-EE", "SE"];

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
// Standard school ordering used everywhere in this app: markaz name A-Z,
// then EMIS code A-Z within each markaz. Sorted client-side (not via an
// .order() on the query) because the sort key lives on the markaz table,
// not on schools - and every page already has cache.markaz loaded.
// ---- Jurisdiction scoping (single source of truth, mirrors the DB) ----
// A person's access is: their home markaz PLUS any additional markaz they
// hold charge of (A-I-DB scope_value when scope_type=Markaz), or - for a
// TR - their whole tehsil, optionally narrowed to one wing (A-I-DB
// scope_value '<TEHSIL>:<WING>'). Both used to be dropped, which is why
// additional-charge markaz were invisible and wing-restricted people saw
// the whole tehsil. RLS enforces the same rule server-side; this exists so
// the UI shows exactly what the person can actually act on.
function myMarkazIds(){
  return [currentProfile.markaz_id, ...(currentProfile.extra_markaz_ids || [])].filter(Boolean);
}
function scopeSchoolsQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("markaz_id", ids) : q.eq("markaz_id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "school_user"){
    q = q.eq("id", currentProfile.school_id);
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("markaz.tehsil", currentProfile.tehsil);
    if(currentProfile.wing_scope) q = q.eq("wing", currentProfile.wing_scope);
  }
  return q;
}
function scopeMarkazQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("id", ids) : q.eq("id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("tehsil", currentProfile.tehsil);
  }
  return q;
}

function sortSchoolsStandard(schools){
  const markazName = {};
  (cache.markaz || []).forEach(m => { markazName[m.id] = m.name || ""; });
  return (schools || []).slice().sort((a, b) =>
    (markazName[a.markaz_id] || "").localeCompare(markazName[b.markaz_id] || "")
    || (a.emis_code || "").localeCompare(b.emis_code || "")
  );
}

function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  // This page now covers Missing Consumption (all roles) plus Adjustments
  // (admin-only - enforced again below at the section level, and by
  // fn_create_adjustment itself server-side).
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderPage();
}

async function loadRefData(){
  const [{ data: markaz }, { data: schools }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name,tehsil").eq("active", true).order("name"),
    sb.from("schools").select("id,school_name,emis_code,markaz_id,wing").eq("active", true).order("emis_code"),
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  cache.schools = sortSchoolsStandard(schools);
  // Milk first, then Biscuit - matches the convention used everywhere else
  // in the app (forms, tables, reports).
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });
}

/* ===================== SECTION NAV ===================== */
let currentSection = "missing";
function visibleSections(){
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);
  const sections = [
    { id:"missing", label:"Missing Consumption", desc:"Schools that haven't logged a consumption entry" },
  ];
  if(isAdmin) sections.push({ id:"adjustments", label:"Inventory Adjustments", desc:"Post stock corrections" });
  return sections;
}

function renderPage(){
  const content = document.getElementById("content");
  const sections = visibleSections();
  if(!sections.find(s => s.id === currentSection)) currentSection = sections[0].id;
  content.innerHTML = `<div class="menu-cards" id="opsSectionNav"></div><div id="opsSectionContent"></div>`;
  const nav = document.getElementById("opsSectionNav");
  sections.forEach(s => {
    const a = document.createElement("a");
    a.className = "menu-card" + (s.id === currentSection ? " active" : "");
    a.innerHTML = `<span class="label">${esc(s.label)}</span><span class="desc">${esc(s.desc)}</span>`;
    a.dataset.id = s.id;
    a.onclick = () => { currentSection = s.id; renderPage(); };
    nav.appendChild(a);
  });
  if(currentSection === "missing") renderMissingSection();
  else renderAdjustmentsSection();
}

/* ===================== MISSING CONSUMPTION ===================== */
function renderMissingSection(){
  const content = document.getElementById("opsSectionContent");
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);
  const isTr = currentProfile.role === "tr";
  const isAeo = currentProfile.role === "aeo";

  let scopeNote, tehsilField = "", markazField = "", wingField = "";
  if(isAdmin){
    const tehsils = [...new Set(cache.markaz.map(m => m.tehsil))].filter(Boolean).sort();
    scopeNote = "Pick a tehsil to check, then a wing (Markaz can't be picked until a wing is chosen, since which markaz have schools of that wing depends on it). Leave tehsil unset to check the whole district.";
    tehsilField = `<div><label>Tehsil</label><select name="tehsil" id="missTehsil"><option value="">All</option>${tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select></div>`;
    wingField = `<div><label>Wing</label><select name="wing" id="missWing"><option value="">All</option>${WING_OPTIONS.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>`;
    markazField = `<div><label>Markaz</label><select name="markaz_id" id="missMarkaz" disabled><option value="">All (pick a Wing to narrow)</option></select></div>`;
  } else if(isTr){
    scopeNote = `Checks your tehsil${currentProfile.tehsil ? " (" + esc(currentProfile.tehsil) + ")" : ""} - pick a wing to narrow to a single markaz.`;
    wingField = `<div><label>Wing</label><select name="wing" id="missWing"><option value="">All</option>${WING_OPTIONS.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>`;
    markazField = `<div><label>Markaz</label><select name="markaz_id" id="missMarkaz" disabled><option value="">All (pick a Wing to narrow)</option></select></div>`;
  } else if(isAeo){
    scopeNote = "Checks the schools in your own markaz.";
    wingField = `<div><label>Wing</label><select name="wing"><option value="">All</option>${WING_OPTIONS.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>`;
  } else {
    scopeNote = "Checks your own school.";
  }

  content.innerHTML = `
    <div class="card">
      <h3>Check missing consumption entries</h3>
      <p class="sub">${scopeNote} Only days each product is actually scheduled to be distributed (or specifically allowed via an exception) are checked against - a day a product isn't due is never counted as "missing". Results are grouped by EMIS code, listing exactly which scheduled dates are missing for each product.</p>
      <form id="missForm" class="form-row">
        <div><label>From</label><input type="date" name="from" value="${daysAgoStr(6)}" required/></div>
        <div><label>To</label><input type="date" name="to" value="${todayStr()}" required/></div>
        ${tehsilField}
        ${wingField}
        ${markazField}
        <div><label>EMIS Code (optional)</label><input type="text" name="emis" placeholder="Narrow to one school"/></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Check</button></div>
      </form>
      <div id="missRangeWarning"></div>
      <div id="missStatus"></div>
    </div>
    <div class="card" id="missCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;" id="missTitle">Results</h3>
        <button class="btn-secondary" id="missExportBtn" type="button">Download CSV</button>
      </div>
      <div class="table-wrap"><table id="missTable"><thead><tr>
        <th>Sr#</th><th>Tehsil</th><th>Markaz</th><th>EMIS</th><th>School</th><th>Wing</th><th>Product</th><th>Missing Dates</th><th>Count</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  `;

  if(isAdmin || isTr){
    const tehsilSel = document.getElementById("missTehsil"); // absent for TR - fine, guarded below
    const wingSel = document.getElementById("missWing");
    const markazSel = document.getElementById("missMarkaz");
    function refreshMarkazOptions(){
      const t = tehsilSel ? tehsilSel.value : currentProfile.tehsil;
      const w = wingSel.value;
      const markazIdsWithWing = w ? new Set(cache.schools.filter(s => s.wing === w).map(s => s.markaz_id)) : null;
      const list = cache.markaz.filter(m => (!t || m.tehsil === t) && (!markazIdsWithWing || markazIdsWithWing.has(m.id)));
      markazSel.disabled = !w;
      markazSel.innerHTML = w
        ? `<option value="">All</option>${list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")}`
        : `<option value="">All (pick a Wing to narrow)</option>`;
    }
    if(tehsilSel) tehsilSel.addEventListener("change", refreshMarkazOptions);
    wingSel.addEventListener("change", () => { markazSel.value = ""; refreshMarkazOptions(); });
    refreshMarkazOptions();
  }

  document.getElementById("missForm").addEventListener("submit", (e) => {
    e.preventDefault();
    checkMissingConsumption(new FormData(e.target));
  });
}

function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function dateRangeArr(from, to){
  const dates = []; let d = new Date(from); const end = new Date(to);
  while(d <= end){ dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return dates;
}

async function checkMissingConsumption(fd){
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);
  const isTr = currentProfile.role === "tr";
  const isAeo = currentProfile.role === "aeo";
  const from = fd.get("from"), to = fd.get("to");
  const tehsil = fd.get("tehsil");
  const markazId = fd.get("markaz_id");
  const wing = fd.get("wing");
  const emis = (fd.get("emis") || "").trim();
  const statusBox = document.getElementById("missStatus");
  const warnBox = document.getElementById("missRangeWarning");
  statusBox.innerHTML = "";

  if(to < from){ toast('"To" must be on or after "From"', "bad"); return; }
  const allDates = dateRangeArr(from, to);
  warnBox.innerHTML = allDates.length > 31
    ? `<div style="margin-top:12px;background:var(--warn-bg);color:var(--warn-fg);padding:10px 12px;border-radius:8px;font-size:12.5px;">This is a ${allDates.length}-day range - results may take a moment and the missing-dates list per school can get long.</div>`
    : "";

  if(isTr && !currentProfile.tehsil){
    toast("Your account has no tehsil set - contact your admin to fix this in A-I-DB.", "bad");
    return;
  }

  // Resolve the in-scope school list (also used to render every school's
  // name/markaz/wing, not just the ones missing).
  let q = sb.from("schools").select("id,school_name,emis_code,markaz_id,wing,markaz!inner(name,tehsil)").eq("active", true);
  // aeo/tr/school_user get their own jurisdiction applied the same way as
  // every other page (home markaz + additional charge, or tehsil + wing).
  q = scopeSchoolsQuery(q);
  if(isTr){
    if(markazId) q = q.eq("markaz_id", markazId);
  } else if(isAdmin){
    if(tehsil) q = q.eq("markaz.tehsil", tehsil);
    if(markazId) q = q.eq("markaz_id", markazId);
  }
  if(wing) q = q.eq("wing", wing);
  if(emis) q = q.eq("emis_code", emis);

  const { data: schools, error: schoolErr } = await q;
  if(schoolErr){ toast(schoolErr.message, "bad"); return; }
  if(!schools?.length){ toast("No schools found for this scope", "bad"); return; }
  // Standard ordering: markaz name A-Z, then EMIS within each markaz.
  schools.sort((a,b) => (a.markaz?.name||"").localeCompare(b.markaz?.name||"") || (a.emis_code||"").localeCompare(b.emis_code||""));
  const schoolIds = schools.map(s => s.id);

  document.getElementById("missCard").style.display = "";
  const tbody = document.querySelector("#missTable tbody");
  tbody.innerHTML = `<tr><td colspan="9">Loading…</td></tr>`;

  const { data: missing, error: missErr } = await sb.rpc("fn_missing_consumption_period", { p_school_ids: schoolIds, p_from: from, p_to: to });
  if(missErr){ tbody.innerHTML = `<tr><td colspan="9" class="err">${esc(missErr.message)}</td></tr>`; return; }

  // Group by school + product, collecting each missing scheduled date -
  // this is the "date-wise, EMIS-wise" view: every row below is one
  // school's one product, with the exact dates it's missing in this period.
  const grouped = {};
  (missing || []).forEach(r => {
    const key = `${r.school_id}|${r.product_id}`;
    if(!grouped[key]) grouped[key] = { school_id:r.school_id, product_name:r.product_name, dates:[] };
    grouped[key].dates.push(r.missing_date);
  });
  const groupRows = Object.values(grouped);
  const flaggedSchoolIds = new Set(groupRows.map(g => g.school_id));

  // Markaz-wise summary - always computed (even when nothing's missing, so
  // the CSV shows a clean 0-missing summary too), included as a second
  // table in the same CSV download.
  const markazAgg = {};
  schools.forEach(s => {
    const key = `${s.markaz?.tehsil}|${s.markaz?.name}`;
    if(!markazAgg[key]) markazAgg[key] = { tehsil: s.markaz?.tehsil, markaz: s.markaz?.name, total: 0, missing: 0 };
    markazAgg[key].total++;
    if(flaggedSchoolIds.has(s.id)) markazAgg[key].missing++;
  });
  const markazSummary = Object.values(markazAgg).sort((a,b) =>
    (a.tehsil||"").localeCompare(b.tehsil||"") || (a.markaz||"").localeCompare(b.markaz||""));

  document.getElementById("missTitle").textContent =
    `${flaggedSchoolIds.size} of ${schools.length} schools missing at least one entry, ${fmtDMY(from)} to ${fmtDMY(to)}`;
  statusBox.innerHTML = groupRows.length
    ? ""
    : `<p style="color:var(--ok-fg); font-size:12.5px; margin-top:10px;">No scheduled product is missing an entry in this period for this scope.</p>`;

  if(!groupRows.length){
    tbody.innerHTML = `<tr><td colspan="9" style="color:var(--ink-soft)">Nothing missing in this period.</td></tr>`;
    lastMissing = { rows: [], from, to, markazSummary };
    return;
  }

  const schoolById = Object.fromEntries(schools.map(s => [s.id, s]));
  groupRows.sort((a,b) => {
    const sa = schoolById[a.school_id], sb2 = schoolById[b.school_id];
    return (sa.emis_code||"").localeCompare(sb2.emis_code||"") || a.product_name.localeCompare(b.product_name);
  });

  const rows = groupRows.map((g, i) => {
    const s = schoolById[g.school_id];
    return {
      sr: i+1, tehsil: s.markaz?.tehsil, markaz: s.markaz?.name,
      emis: s.emis_code, school: s.school_name, wing: s.wing,
      product: g.product_name,
      dates: g.dates.map(fmtDMY).join(", "),
      count: g.dates.length,
    };
  });
  lastMissing = { rows, from, to, markazSummary };

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.sr}</td>
      <td>${esc(r.tehsil)}</td>
      <td>${esc(r.markaz)}</td>
      <td>${esc(r.emis)}</td>
      <td>${esc(r.school)}</td>
      <td>${esc(r.wing)}</td>
      <td>${esc(r.product)}</td>
      <td><span class="pill pill-bad">${esc(r.dates)}</span></td>
      <td>${r.count}</td>
    </tr>
  `).join("");

  document.getElementById("missExportBtn").onclick = () => exportMissingCsv(lastMissing);
}

function fmtDMY(d){ const dt = new Date(d + "T00:00:00"); const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${dt.getDate()}-${months[dt.getMonth()]}-${dt.getFullYear()}`; }

function exportMissingCsv(missing){
  const { rows, from, to, markazSummary } = missing;
  const header = ["Sr#","Tehsil","Markaz","EMIS","School","Wing","Product","Missing Dates","Count"];
  const csvRows = [header, ...rows.map(r => [r.sr, r.tehsil, r.markaz, r.emis, r.school, r.wing, r.product, r.dates, r.count])];

  // Markaz-wise summary as a second table in the same CSV, separated by a
  // blank row - opens fine in Excel/Sheets as one file with two blocks.
  csvRows.push([]);
  csvRows.push(["Markaz-wise Summary"]);
  csvRows.push(["Tehsil","Markaz","Schools Missing","Total Schools In Scope","% Missing"]);
  (markazSummary || []).forEach(m => {
    csvRows.push([m.tehsil, m.markaz, m.missing, m.total, m.total ? Math.round((m.missing/m.total)*100) + "%" : "0%"]);
  });

  const csv = csvRows.map(row => row.map(v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `smp-missing-consumption-${from}-to-${to}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ===================== INVENTORY ADJUSTMENTS (admin-only) ===================== */
function renderAdjustmentsSection(){
  if(!["admin","super_admin"].includes(currentProfile.role)){
    // Defensive - the nav card is admin-only already, and fn_create_adjustment
    // itself checks fn_is_admin() server-side regardless.
    currentSection = "missing";
    renderPage();
    return;
  }
  const content = document.getElementById("opsSectionContent");
  // Markaz named on each option - an adjustment posted against the wrong
  // school silently corrupts that school's balance.
  const schoolOpts = cache.schools.map(s => {
    const mk = cache.markaz.find(m => m.id === s.markaz_id)?.name;
    return `<option value="${s.id}">${esc(s.emis_code)} — ${esc(s.school_name)}${mk ? ` (${esc(mk)})` : ""}</option>`;
  }).join("");
  const markazOpts = cache.markaz.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const productOpts = cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");

  content.innerHTML = `
    <div class="card">
      <h3>Post an inventory adjustment</h3>
      <p class="sub">Corrects a school's or markaz's balance directly - spoilage, damage, a physical count correction, etc. Use a negative quantity to reduce stock, positive to increase it.</p>
      <form id="adjForm" class="form-row">
        <div><label>Level</label>
          <select name="entity_type" id="entityType" required>
            <option value="school">School</option>
            <option value="markaz">Markaz</option>
          </select>
        </div>
        <div id="schoolField"><label>School</label><select name="school_id"><option value="">Select…</option>${schoolOpts}</select></div>
        <div id="markazField" class="hidden"><label>Markaz</label><select name="markaz_id"><option value="">Select…</option>${markazOpts}</select></div>
        <div><label>Product</label><select name="product_id" required><option value="">Select…</option>${productOpts}</select></div>
        <div><label>Quantity (+/-)</label><input type="number" name="quantity" step="0.01" required placeholder="e.g. -12 or 5"/></div>
        <div><label>Date</label><input type="date" name="adjustment_date" value="${todayStr()}" required/></div>
        <div style="grid-column:1/-1;"><label>Reason</label><input type="text" name="reason" required placeholder="e.g. Spoiled during transport"/></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Post adjustment</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Recent adjustments</h3>
      <div class="table-wrap"><table id="adjTable"><thead><tr>
        <th>Date</th><th>Level</th><th>School / Markaz</th><th>Product</th><th>Qty</th><th>Reason</th>
      </tr></thead><tbody><tr><td colspan="6" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  const entityType = document.getElementById("entityType");
  const schoolField = document.getElementById("schoolField");
  const markazField = document.getElementById("markazField");
  function toggleFields(){
    const isSchool = entityType.value === "school";
    schoolField.classList.toggle("hidden", !isSchool);
    markazField.classList.toggle("hidden", isSchool);
  }
  entityType.addEventListener("change", toggleFields);
  toggleFields();

  document.getElementById("adjForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const entity = fd.get("entity_type");
    try{
      const { error } = await sb.rpc("fn_create_adjustment", {
        p_entity_type: entity,
        p_school_id: entity === "school" ? (fd.get("school_id") || null) : null,
        p_markaz_id: entity === "markaz" ? (fd.get("markaz_id") || null) : null,
        p_product_id: fd.get("product_id"),
        p_quantity: fd.get("quantity"),
        p_adjustment_date: fd.get("adjustment_date"),
        p_reason: fd.get("reason"),
      });
      if(error) throw error;
      toast("Adjustment posted");
      e.target.reset();
      toggleFields();
      e.target.querySelector('[name="adjustment_date"]').value = todayStr();
      await loadAdjustments();
    }catch(err){ toast(err.message, "bad"); }
  });

  loadAdjustments();
}

async function loadAdjustments(){
  const tbody = document.querySelector("#adjTable tbody");
  const { data, error } = await sb
    .from("inventory_adjustments")
    .select("adjustment_date, entity_type, quantity, reason, schools(emis_code,school_name), markaz(name), products(product_name,unit_name)")
    .order("adjustment_date", { ascending: false })
    .order("created_at", { ascending: false })
    .limit(100);

  if(error){ tbody.innerHTML = `<tr><td colspan="6" class="err">${esc(error.message)}</td></tr>`; return; }
  if(!data?.length){ tbody.innerHTML = `<tr><td colspan="6" style="color:var(--ink-soft)">No adjustments posted yet.</td></tr>`; return; }

  tbody.innerHTML = data.map(r => `
    <tr>
      <td>${fmtDate(r.adjustment_date)}</td>
      <td>${esc(r.entity_type)}</td>
      <td>${r.entity_type === "school" ? esc(r.schools?.emis_code) + " — " + esc(r.schools?.school_name) : esc(r.markaz?.name)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td style="color:${Number(r.quantity) < 0 ? "var(--bad-fg)" : "var(--ok-fg)"}">${Number(r.quantity) > 0 ? "+" : ""}${fmt(r.quantity)}</td>
      <td>${esc(r.reason)}</td>
    </tr>
  `).join("");
}
</script>
</body>
</html>
