<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consumption — School Meal Program</title>
<script src="assets/safety.js?v=20261015a"></script>
<script src="assets/layout.js?v=20261018a"></script>
<script src="assets/sync-me.js?v=20261015a"></script>
<script src="assets/config.js?v=20261015a"></script>

<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Consumption</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null;
let cache = { markaz:[], schools:[], products:[] };
let selectedDate = new Date().toISOString().slice(0,10);

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
// Standard school ordering used everywhere in this app: markaz name A-Z,
// then EMIS code A-Z within each markaz. Sorted client-side (not via an
// .order() on the query) because the sort key lives on the markaz table,
// not on schools - and every page already has cache.markaz loaded.
// ---- Jurisdiction scoping (single source of truth, mirrors the DB) ----
// A person's access is: their home markaz PLUS any additional markaz they
// hold charge of (A-I-DB scope_value when scope_type=Markaz), or - for a
// TR - their whole tehsil, optionally narrowed to one wing (A-I-DB
// scope_value '<TEHSIL>:<WING>'). Both used to be dropped, which is why
// additional-charge markaz were invisible and wing-restricted people saw
// the whole tehsil. RLS enforces the same rule server-side; this exists so
// the UI shows exactly what the person can actually act on.
function myMarkazIds(){
  return [currentProfile.markaz_id, ...(currentProfile.extra_markaz_ids || [])].filter(Boolean);
}
function scopeSchoolsQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("markaz_id", ids) : q.eq("markaz_id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "school_user"){
    q = q.eq("id", currentProfile.school_id);
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("markaz.tehsil", currentProfile.tehsil);
    if(currentProfile.wing_scope) q = q.eq("wing", currentProfile.wing_scope);
  }
  return q;
}
function scopeMarkazQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("id", ids) : q.eq("id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("tehsil", currentProfile.tehsil);
  }
  return q;
}

function sortSchoolsStandard(schools){
  const markazName = {};
  (cache.markaz || []).forEach(m => { markazName[m.id] = m.name || ""; });
  return (schools || []).slice().sort((a, b) =>
    (markazName[a.markaz_id] || "").localeCompare(markazName[b.markaz_id] || "")
    || (a.emis_code || "").localeCompare(b.emis_code || "")
  );
}

function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

// A toast is easy to miss for something that needs the user to actually stop
// and act - insufficient stock means the entry did NOT save, so this shows a
// modal instead, names the product plainly, and points at where to fix the
// real cause (an un-rationalized transfer) rather than just letting them
// re-type a smaller (wrong) number to make the error go away.
function showInsufficientStockModal({ productName, unitName, available, emisCode, schoolName }){
  const existing = document.getElementById("insufficientModal");
  if(existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.id = "insufficientModal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>⚠ Insufficient ${esc(productName)} Stock</h3>
      <p><b>${esc(schoolName)}</b> (EMIS ${esc(emisCode)}) only has <b>${fmt(available)} ${esc(unitName || "packs")}</b> of ${esc(productName)} available - not enough to save this entry.</p>
      <div class="modal-note">
        Do not enter a number larger than what's actually available just to save this - it will make every report using this school's balance wrong from this point on.
        If stock was rationalized in from another school, go to <b>Stock Rationalization</b> and rationalize the required quantity from that EMIS code to <b>${esc(schoolName)}</b> first, then come back and enter the real consumption figure.
      </div>
      <div class="actions-row">
        <button class="btn-secondary" id="insufficientCloseBtn" type="button">Close</button>
        <a class="btn-primary" href="transfers.html?section=loans" style="text-decoration:none; display:inline-flex; align-items:center;">Go to Stock Rationalization</a>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById("insufficientCloseBtn").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
}

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  if(!["admin","super_admin","tr","aeo"].includes(profile.role)){
    alert("This module is for AEOs and administrators.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderSidebarNav();
  renderConsumption();
}

async function loadRefData(){
  const markazQuery = scopeMarkazQuery(sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"));
  // markaz!inner is always joined so the TR tehsil/wing scope can filter on it.
  const schoolsQuery = scopeSchoolsQuery(
    sb.from("schools").select("id,school_name,emis_code,markaz_id,wing,markaz!inner(tehsil)").eq("active", true)
  );
  const [{ data: markaz }, { data: schools }, { data: products }] = await Promise.all([
    markazQuery,
    schoolsQuery,
    sb.from("products").select("id,product_name,unit_name,schedule_dow").eq("active", true),
  ]);
  cache.markaz = markaz || [];
  cache.schools = sortSchoolsStandard(schools);
  // Milk block first, then Biscuit (and anything else after), matching the
  // requested column order rather than plain alphabetical.
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });
}

/* ===================== JURISDICTION FILTER (admin/tr only) ===================== */
function renderJurisdictionFilter(container, onApply){
  // An AEO with only one markaz has nothing to narrow, so skip straight to their schools.
  // An AEO holding charge of several markaz gets a Markaz picker scoped to just those markaz,
  // same as everyone else - previously this whole filter was skipped for every AEO, so someone
  // with multiple markaz had no way to work on one at a time.
  const isAeoMulti = currentProfile.role === "aeo" && myMarkazIds().length > 1;
  if(!["admin","super_admin","tr"].includes(currentProfile.role) && !isAeoMulti){
    container.innerHTML = `
      <div class="card">
        <div class="form-row">
          <div style="flex:1 1 320px;"><label>Search <span id="jfSearchCount" class="sub"></span></label><input type="search" id="jfSearch" placeholder="Type to search: school name, EMIS, markaz…" autocomplete="off"/></div>
          <div style="align-self:end;"><button class="btn-primary" id="jfApply" type="button">Apply filter</button></div>
        </div>
      </div>`;
    const sOnly = document.getElementById("jfSearch");
    const go = () => onApply(cache.schools.map(s => s.id));
    sOnly.addEventListener("keydown", (e) => { if(e.key === "Enter") e.preventDefault(); });
    document.getElementById("jfApply").addEventListener("click", go);
    smpLiveSearch(sOnly, document.getElementById("content"), "#summaryTable, #consumptionTable", document.getElementById("jfSearchCount"));
    onApply(cache.schools.map(s => s.id));
    return;
  }
  const scopedMarkaz = currentProfile.role === "aeo" ? cache.markaz.filter(m => myMarkazIds().includes(m.id)) : cache.markaz;
  const districts = [...new Set(scopedMarkaz.map(m => m.district))].filter(Boolean).sort();
  const wings = [...new Set(cache.schools.map(s => s.wing))].filter(Boolean).sort();
  container.innerHTML = `
    <div class="card">
      <h3>Filter by jurisdiction</h3>
      <p class="sub">District and Tehsil narrow the area; Wing must be picked before Markaz becomes selectable, since which Markaz have schools of that Wing depends on it.</p>
      <div class="form-row">
        <div style="${currentProfile.role === 'aeo' ? 'display:none' : ''}"><label>District</label><select id="jfDistrict"><option value="">All</option>${districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>
        <div><label>Tehsil</label><select id="jfTehsil"><option value="">All</option></select></div>
        <div><label>Wing</label><select id="jfWing"><option value="">All</option>${wings.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>
        <div><label>Markaz</label><select id="jfMarkaz" disabled><option value="">All (pick a Wing to narrow)</option></select></div>
        <div><label>EMIS Code</label><input type="text" id="jfEmis" placeholder="Search one school"/></div>
        <div style="flex:1 1 260px;"><label>Search <span id="jfSearchCount" class="sub"></span></label><input type="search" id="jfSearch" placeholder="Type to search: school name, markaz…" autocomplete="off"/></div>
        <div style="align-self:end;"><button class="btn-primary" id="jfApply" type="button">Apply filter</button></div>
      </div>
    </div>
  `;
  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz"), wEl = document.getElementById("jfWing"), eEl = document.getElementById("jfEmis"), sEl = document.getElementById("jfSearch");
  function refreshTehsil(){
    const d = dEl.value;
    const tehsils = [...new Set(scopedMarkaz.filter(m => !d || m.district === d).map(m => m.tehsil))].filter(Boolean).sort();
    tEl.innerHTML = `<option value="">All</option>` + tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  function refreshMarkaz(){
    const d = dEl.value, t = tEl.value, w = wEl.value;
    // Markaz has no wing column of its own (wing is a per-school attribute) -
    // "belongs to" a wing here means it has at least one active school of
    // that wing, which is the only meaningful reading given the data model.
    const markazIdsWithWing = w
      ? new Set(cache.schools.filter(s => s.wing === w).map(s => s.markaz_id))
      : null;
    const list = scopedMarkaz.filter(m =>
      (!d || m.district === d) && (!t || m.tehsil === t) && (!markazIdsWithWing || markazIdsWithWing.has(m.id)));
    mEl.disabled = !w;
    mEl.innerHTML = w
      ? `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")
      : `<option value="">All (pick a Wing to narrow)</option>`;
  }
  function apply(){
    const d = dEl.value, t = tEl.value, mId = wEl.value ? mEl.value : "", wing = wEl.value;
    const emis = (eEl.value || "").trim();
    // An EMIS code identifies exactly one school, so when one is entered it
    // overrides the geography/wing pickers entirely rather than intersecting
    // with them - otherwise a valid code would return nothing whenever the
    // dropdowns happened to be pointed elsewhere.
    if(emis){
      onApply(cache.schools.filter(s => (s.emis_code || "").includes(emis)).map(s => s.id));
      return;
    }
    const markazIds = new Set(scopedMarkaz.filter(m => (!d || m.district === d) && (!t || m.tehsil === t) && (!mId || m.id === mId)).map(m => m.id));
    onApply(cache.schools.filter(s => markazIds.has(s.markaz_id) && (!wing || s.wing === wing)).map(s => s.id));
  }
  refreshTehsil(); refreshMarkaz();
  // Filters only take effect when "Apply filter" is clicked (or Enter is pressed in the EMIS box) - nothing
  // reloads while the pickers are being changed. The pickers still narrow each other's options as you go.
  dEl.addEventListener("change", () => { refreshTehsil(); refreshMarkaz(); });
  tEl.addEventListener("change", () => { refreshMarkaz(); });
  // Changing Wing always resets the Markaz selection - a previously chosen
  // Markaz may not even belong to the new Wing's list.
  wEl.addEventListener("change", () => { mEl.value = ""; refreshMarkaz(); });
  eEl.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); apply(); } });
  sEl.addEventListener("keydown", (e) => { if(e.key === "Enter") e.preventDefault(); });
  smpLiveSearch(sEl, document.getElementById("content"), "#summaryTable, #consumptionTable", document.getElementById("jfSearchCount"));
  document.getElementById("jfApply").addEventListener("click", apply);
  apply();   // one initial load with the default scope
}

/* ===================== GRID ===================== */
/* ===================== CONSUMPTION: ADD FORM + ENTRIES LIST ===================== */
// Consumption is entered through a form (one school and one product at a time), like inventory - there is no grid of
// every school. The product is chosen automatically from the date: only products scheduled for that day can be entered
// (schedule_dow, overridden by schedule_exceptions - the same rule the database enforces when it saves).
let currentVisibleIds = [];

async function scheduledProductsFor(dateStr){
  const { data: exceptions } = await sb.from("schedule_exceptions")
    .select("product_id, status").eq("exception_date", dateStr);
  const exceptionByProduct = {};
  (exceptions || []).forEach(e => { exceptionByProduct[e.product_id] = e.status; });
  const dow = new Date(dateStr + "T00:00:00").getDay();
  return cache.products.filter(p => {
    const ex = exceptionByProduct[p.id];
    if(ex === "blocked") return false;
    if(ex === "allowed") return true;
    return (p.schedule_dow || []).includes(dow);
  });
}
const weekdayName = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long" });

async function renderConsumption(){
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <h3>Date</h3>
      <p class="sub">Defaults to today. Pick a date and click Apply filter to see that day's entries.</p>
      <div class="form-row">
        <div><label>Consumption date</label><input type="date" id="dateInput" value="${selectedDate}" max="${todayStr()}" /></div>
        <div style="align-self:end;"><button class="btn-primary" id="applyDateBtn" type="button">Apply filter</button> <button class="btn-secondary" id="todayBtn" type="button">Jump to today</button></div>
      </div>
    </div>
    <div id="filterMount"></div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          <h3 style="margin:0;">Consumption</h3>
          <p class="sub" id="consDaySub" style="margin:4px 0 0;">Checking which product is scheduled…</p>
        </div>
        <button class="btn-primary" id="addConsumptionBtn" type="button">+ Add consumption</button>
      </div>
    </div>
    <div class="card" id="summaryCard">
      <h3>All schools summary — ${esc(selectedDate)}</h3>
      <p class="sub">Every school in your filter: opening balance, received on this date, consumption and remaining. Use the filter above to look at one markaz.</p>
      <div class="table-wrap"><table id="summaryTable"><thead></thead><tbody><tr><td colspan="6" style="color:var(--ink-soft)">Loading…</td></tr></tbody><tfoot></tfoot></table></div>
    </div>
    <div class="card">
      <h3>Entries added — ${esc(selectedDate)}</h3>
      <p class="sub">Every consumption entry for this date. Edit or delete an entry here.</p>
      <div class="table-wrap"><table id="consumptionTable"><thead><tr>
        <th>Sr#</th><th>Markaz</th><th>EMIS</th><th>School</th><th>Product</th><th>Opening</th><th>Received</th><th>Consumed</th><th>Remaining</th><th></th>
      </tr></thead><tbody><tr><td colspan="10" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  document.getElementById("dateInput").addEventListener("change", (e) => {
    if(e.target.value && e.target.value > todayStr()){
      toast("Consumption can't be dated in the future - check the day and month.", "bad");
      e.target.value = todayStr();
    }
  });
  document.getElementById("applyDateBtn").addEventListener("click", () => {
    selectedDate = document.getElementById("dateInput").value || todayStr();
    renderConsumption();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    selectedDate = todayStr();
    renderConsumption();
  });
  document.getElementById("addConsumptionBtn").addEventListener("click", () => showAddConsumptionModal());

  scheduledProductsFor(selectedDate).then(list => {
    const el = document.getElementById("consDaySub");
    if(!el) return;
    el.textContent = list.length
      ? `${weekdayName(selectedDate)}: ${list.map(p => p.product_name).join(" and ")} ${list.length === 1 ? "day - only " + list[0].product_name + " can be added" : "can be added"}. Every entry is listed below, where you can edit or delete it.`
      : `${weekdayName(selectedDate)}: no product is scheduled for consumption on this date, so nothing can be added.`;
  });

  renderJurisdictionFilter(document.getElementById("filterMount"), (schoolIds) => loadConsumptionList(schoolIds));
}

async function loadConsumptionList(visibleSchoolIds){
  currentVisibleIds = visibleSchoolIds;
  const tbody = document.querySelector("#consumptionTable tbody");
  const sBody = document.querySelector("#summaryTable tbody");
  if(!tbody || !sBody) return;
  const sHead = document.querySelector("#summaryTable thead"), sFoot = document.querySelector("#summaryTable tfoot");
  if(!visibleSchoolIds.length){
    sHead.innerHTML = ""; sFoot.innerHTML = "";
    sBody.innerHTML = `<tr><td colspan="6" style="color:var(--ink-soft)">No schools match this filter.</td></tr>`;
    tbody.innerHTML = `<tr><td colspan="10" style="color:var(--ink-soft)">No schools match this filter.</td></tr>`;
    return;
  }
  const idSet = new Set(visibleSchoolIds);

  // Entries already added for this date (paged: a plain select is silently capped at 1,000 rows).
  const { data, error } = await smpFetchAll(() => {
    let q = sb.from("consumption").select("id, school_id, product_id, quantity")
      .eq("consumption_date", selectedDate).eq("status", "active");
    if(visibleSchoolIds.length <= 150) q = q.in("school_id", visibleSchoolIds);
    return q.order("id");
  });
  if(error){ tbody.innerHTML = `<tr><td colspan="10" class="err">${esc(error.message)}</td></tr>`; return; }
  const entries = (data || []).filter(r => idSet.has(r.school_id));

  // Opening / received / consumed / remaining for EVERY school in the filter on this date.
  const grid = {};
  for(let i = 0; i < visibleSchoolIds.length; i += 100){
    const chunk = visibleSchoolIds.slice(i, i + 100);
    const { data: g, error: gErr } = await smpFetchAll(() => sb.rpc("fn_consumption_grid", { p_school_ids: chunk, p_date: selectedDate }).order("school_id").order("product_id"));
    if(gErr){
      sBody.innerHTML = `<tr><td colspan="6" class="err">${esc(gErr.message)}</td></tr>`;
      tbody.innerHTML = `<tr><td colspan="10" class="err">${esc(gErr.message)}</td></tr>`;
      return;
    }
    (g || []).forEach(r => { grid[r.school_id + "|" + r.product_id] = r; });
  }

  renderSchoolsSummary(visibleSchoolIds, grid, await scheduledProductsFor(selectedDate));
  renderConsumptionEntries(entries, grid);
}

// Read-only summary of every school in the filter, for the scheduled product(s) of the selected date (all products
// on a day with nothing scheduled, so the balances can still be seen).
function renderSchoolsSummary(visibleSchoolIds, grid, scheduled){
  const head = document.querySelector("#summaryTable thead"), body = document.querySelector("#summaryTable tbody"), foot = document.querySelector("#summaryTable tfoot");
  if(!head || !body || !foot) return;
  const shown = scheduled.length ? scheduled : cache.products;
  const visible = new Set(visibleSchoolIds);
  const schools = cache.schools.filter(s => visible.has(s.id));
  const grp = p => (p.product_name || "").toLowerCase().includes("milk") ? "col-group-milk" : "col-group-biscuit";
  head.innerHTML = `<tr>
      <th rowspan="2">Sr#</th><th rowspan="2">Markaz</th><th rowspan="2">EMIS</th><th rowspan="2">School</th>
      ${shown.map(p => `<th colspan="4" class="${grp(p)}">${esc(p.product_name)}</th>`).join("")}
      <th rowspan="2">${scheduled.length ? "Status" : ""}</th>
    </tr><tr>
      ${shown.map(p => `<th class="${grp(p)}">Opening</th><th class="${grp(p)}">Received</th><th class="${grp(p)}">Consumption</th><th class="${grp(p)}">Remaining</th>`).join("")}
    </tr>`;
  const colspan = 5 + shown.length * 4;
  if(!schools.length){ body.innerHTML = `<tr><td colspan="${colspan}" style="color:var(--ink-soft)">No schools match this filter.</td></tr>`; foot.innerHTML = ""; return; }

  const totals = shown.map(() => ({ opening: 0, received: 0, consumed: 0, remaining: 0 }));
  let entered = 0;
  body.innerHTML = schools.map((s, i) => {
    const markazName = cache.markaz.find(m => m.id === s.markaz_id)?.name || "—";
    let didEnter = false;
    const cells = shown.map((p, pi) => {
      const g = grid[s.id + "|" + p.id] || { opening: 0, received: 0, consumed: 0, remaining: 0 };
      totals[pi].opening += Number(g.opening); totals[pi].received += Number(g.received);
      totals[pi].consumed += Number(g.consumed); totals[pi].remaining += Number(g.remaining);
      if(scheduled.some(sp => sp.id === p.id) && Number(g.consumed) > 0) didEnter = true;
      return `<td class="${grp(p)}">${fmt(g.opening)}</td><td class="${grp(p)}">${fmt(g.received)}</td><td class="${grp(p)}"><b>${fmt(g.consumed)}</b></td><td class="${grp(p)}">${fmt(g.remaining)}</td>`;
    }).join("");
    if(didEnter) entered++;
    const status = scheduled.length ? (didEnter ? '<span class="pill pill-ok">✓ Entered</span>' : '<span class="pill pill-warn">Not entered</span>') : "";
    return `<tr><td>${i + 1}</td><td>${esc(markazName)}</td><td>${esc(s.emis_code)}</td><td>${esc(s.school_name)}</td>${cells}<td>${status}</td></tr>`;
  }).join("");
  foot.innerHTML = `<tr style="font-weight:700;"><td colspan="4">Total - ${schools.length} school${schools.length === 1 ? "" : "s"}</td>
    ${totals.map(t => `<td>${fmt(t.opening)}</td><td>${fmt(t.received)}</td><td>${fmt(t.consumed)}</td><td>${fmt(t.remaining)}</td>`).join("")}
    <td>${scheduled.length ? `${entered} of ${schools.length} entered` : ""}</td></tr>`;
}

function renderConsumptionEntries(entries, grid){
  const tbody = document.querySelector("#consumptionTable tbody");
  if(!tbody) return;
  if(!entries.length){
    tbody.innerHTML = `<tr><td colspan="10" style="color:var(--ink-soft)">No consumption has been added for ${esc(selectedDate)} yet. Click “+ Add consumption”.</td></tr>`;
    return;
  }
  const schoolOrder = Object.fromEntries(cache.schools.map((s, i) => [s.id, i]));
  const productOrder = Object.fromEntries(cache.products.map((p, i) => [p.id, i]));
  entries.sort((a, b) => ((schoolOrder[a.school_id] ?? 1e9) - (schoolOrder[b.school_id] ?? 1e9)) || ((productOrder[a.product_id] ?? 0) - (productOrder[b.product_id] ?? 0)));

  tbody.innerHTML = entries.map((r, i) => {
    const s = cache.schools.find(x => x.id === r.school_id) || {};
    const p = cache.products.find(x => x.id === r.product_id) || {};
    const g = grid[r.school_id + "|" + r.product_id] || { opening: 0, received: 0, remaining: 0 };
    const cls = (p.product_name || "").toLowerCase().includes("milk") ? "col-group-milk" : "col-group-biscuit";
    const markazName = cache.markaz.find(m => m.id === s.markaz_id)?.name || "—";
    return `<tr data-entry="${r.id}">
      <td>${i + 1}</td><td>${esc(markazName)}</td><td>${esc(s.emis_code)}</td><td>${esc(s.school_name)}</td>
      <td class="${cls}">${esc(p.product_name)}</td><td>${fmt(g.opening)}</td><td>${fmt(g.received)}</td>
      <td><b>${fmt(r.quantity)}</b></td><td>${fmt(g.remaining)}</td>
      <td><button class="link-btn edit" type="button" data-act="edit" data-id="${r.id}">Edit</button>
          <button class="link-btn danger" type="button" data-act="delete" data-id="${r.id}">Delete</button></td></tr>`;
  }).join("");

  const byId = Object.fromEntries(entries.map(r => [r.id, r]));
  tbody.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const r = byId[btn.dataset.id];
      if(btn.dataset.act === "edit") showEditConsumptionModal(r);
      else deleteConsumption(r, btn);
    });
  });
}

async function deleteConsumption(r, btn){
  const school = cache.schools.find(s => s.id === r.school_id);
  const product = cache.products.find(p => p.id === r.product_id);
  if(!confirm(`Delete the ${product?.product_name} consumption entry (${fmt(r.quantity)}) for ${school?.school_name} on ${selectedDate}? This cannot be undone from here.`)) return;
  btn.disabled = true;
  try{
    const { error } = await sb.rpc("fn_delete_consumption", { p_school_id: r.school_id, p_product_id: r.product_id, p_consumption_date: selectedDate });
    if(error) throw error;
    toast("Entry deleted");
    await loadConsumptionList(currentVisibleIds);
  }catch(err){
    toast(err.message, "bad");
    btn.disabled = false;
  }
}

// Opening + received for a school/product/date, from the same function the old grid used.
async function consumptionFigures(schoolId, productId, dateStr){
  const { data, error } = await sb.rpc("fn_consumption_grid", { p_school_ids: [schoolId], p_date: dateStr });
  if(error) throw error;
  return (data || []).find(r => r.product_id === productId) || { opening: 0, received: 0, consumed: 0, remaining: 0 };
}

// Save through the existing database function (it re-checks the schedule, the date and the available stock).
async function saveConsumption(school, product, dateStr, qty){
  const { error } = await sb.rpc("fn_upsert_consumption", {
    p_school_id: school.id, p_product_id: product.id, p_consumption_date: dateStr, p_quantity: qty,
  });
  if(!error) return { ok: true };
  const m = /Insufficient inventory\. Available quantity: ([\d.]+)/.exec(error.message || "");
  if(m){
    showInsufficientStockModal({ productName: product.product_name, unitName: product.unit_name, available: Number(m[1]),
                                 emisCode: school.emis_code, schoolName: school.school_name });
    return { ok: false, handled: true };
  }
  return { ok: false, message: error.message };
}

function showAddConsumptionModal(){
  const old = document.getElementById("addConsumptionModal");
  if(old) old.remove();
  // EMIS is looked up against every school this person is allowed to work with (not just the filtered list).
  const mySchools = cache.schools;
  if(!mySchools.length){ toast("No schools are available for your account.", "bad"); return; }
  const findSchool = (emis) => mySchools.find(s => String(s.emis_code).trim() === String(emis || "").trim());

  const overlay = document.createElement("div");
  overlay.id = "addConsumptionModal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Add consumption</h3>
      <form id="addConsForm" class="form-row" style="grid-template-columns:1fr;">
        <div><label>EMIS code *</label><input type="text" name="emis_code" required autocomplete="off" inputmode="numeric" placeholder="Enter the school's EMIS code"/>
          <div id="addConsSchoolName" class="sub" style="margin:4px 0 0;"></div></div>
        <div><label>Consumption date *</label><input type="date" name="consumption_date" value="${selectedDate}" max="${todayStr()}" required/></div>
        <div><label>Consumption type (selected automatically for the date)</label>
          <select name="product_id" id="addConsProduct"></select>
          <div id="addConsTypeNote" class="sub" style="margin:4px 0 0;"></div></div>
        <div id="addConsAvail"></div>
        <div><label>Quantity consumed (packs) *</label><input type="number" name="quantity" min="0" step="0.01" required/></div>
        <div id="addConsError"></div>
        <div class="actions-row">
          <button class="btn-secondary" id="addConsCancel" type="button">Cancel</button>
          <button class="btn-primary" id="addConsSubmit" type="submit">Submit</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);

  const form = document.getElementById("addConsForm");
  const errBox = document.getElementById("addConsError");
  const submitBtn = document.getElementById("addConsSubmit");
  const nameBox = document.getElementById("addConsSchoolName");
  const typeSel = document.getElementById("addConsProduct");
  const typeNote = document.getElementById("addConsTypeNote");
  const availBox = document.getElementById("addConsAvail");
  let busy = false, typeToken = 0, figToken = 0, figures = null, scheduled = [];
  const close = () => { if(!busy) overlay.remove(); };
  document.getElementById("addConsCancel").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
  const showErr = (msg) => { errBox.innerHTML = `<div class="modal-note" style="color:var(--bad-fg);">${esc(msg)}</div>`; };

  // Product follows the date: only what is scheduled that day, selected for the user.
  async function refreshType(){
    const my = ++typeToken;
    const date = form.elements.consumption_date.value;
    if(!date){ typeSel.innerHTML = ""; typeNote.textContent = "Choose the date first."; scheduled = []; return refreshFigures(); }
    scheduled = await scheduledProductsFor(date);
    if(my !== typeToken) return;
    typeSel.innerHTML = scheduled.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");
    typeNote.innerHTML = scheduled.length
      ? (scheduled.length === 1 ? `${esc(weekdayName(date))} is a <b>${esc(scheduled[0].product_name)}</b> day - only ${esc(scheduled[0].product_name)} can be entered.`
                                : `${esc(weekdayName(date))}: choose from the products scheduled for this day.`)
      : `<span style="color:var(--bad-fg);">No product is scheduled for consumption on ${esc(date)} (${esc(weekdayName(date))}). Pick another date.</span>`;
    await refreshFigures();
  }

  // Shows opening + received for the chosen school/product/date, and stops a second entry for the same day.
  async function refreshFigures(){
    const my = ++figToken;
    figures = null; availBox.innerHTML = ""; errBox.innerHTML = "";
    const school = findSchool(form.elements.emis_code.value);
    const date = form.elements.consumption_date.value, productId = typeSel.value;
    const product = cache.products.find(p => p.id === productId);
    submitBtn.disabled = !scheduled.length;
    if(!school || !product || !date) return;
    try{
      const f = await consumptionFigures(school.id, product.id, date);
      if(my !== figToken) return;
      figures = f;
      const available = Number(f.opening) + Number(f.received);
      if(Number(f.consumed) > 0){
        availBox.innerHTML = `<div class="modal-note" style="color:var(--bad-fg);"><b>⚠ ${esc(product.product_name)} consumption is already recorded for this school on ${esc(date)}</b> (${fmt(f.consumed)}). It cannot be added again - edit the existing entry instead.
          <button class="link-btn edit" id="addConsEditExisting" type="button">Edit the existing entry</button></div>`;
        submitBtn.disabled = true;
        document.getElementById("addConsEditExisting").addEventListener("click", async () => {
          const { data: ex, error } = await sb.from("consumption").select("id, school_id, product_id, quantity")
            .eq("school_id", school.id).eq("product_id", product.id).eq("consumption_date", date).eq("status", "active").maybeSingle();
          if(error || !ex){ toast(error ? error.message : "Entry not found.", "bad"); return; }
          overlay.remove();
          if(date !== selectedDate){ selectedDate = date; await renderConsumption(); }
          showEditConsumptionModal(ex);
        });
      } else {
        availBox.innerHTML = `<div class="modal-note">Opening ${fmt(f.opening)} + received today ${fmt(f.received)} = <b>${fmt(available)} ${esc(product.unit_name || "packs")} available</b>.</div>`;
        submitBtn.disabled = false;
      }
    }catch(err){
      if(my === figToken) showErr(err.message || "Could not load the school's stock.");
    }
  }

  form.elements.emis_code.addEventListener("input", (e) => {
    const v = e.target.value.trim();
    const s = v ? findSchool(v) : null;
    const mk = s ? cache.markaz.find(m => m.id === s.markaz_id)?.name : "";
    nameBox.innerHTML = !v ? "" : s ? `<span style="color:var(--ok-fg);">✓ ${esc(s.school_name)}${mk ? ` (${esc(mk)})` : ""}</span>`
                                    : `<span style="color:var(--bad-fg);">No school with this EMIS code in your list</span>`;
    refreshFigures();
  });
  form.elements.consumption_date.addEventListener("change", (e) => {
    if(e.target.value && e.target.value > todayStr()){
      toast("Consumption can't be dated in the future - check the day and month.", "bad");
      e.target.value = todayStr();
    }
    refreshType();
  });
  typeSel.addEventListener("change", refreshFigures);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if(busy) return;                                    // no double submission
    errBox.innerHTML = "";
    const fd = new FormData(form);
    const school = findSchool(fd.get("emis_code"));
    const product = cache.products.find(p => p.id === fd.get("product_id"));
    const date = fd.get("consumption_date"), qtyRaw = fd.get("quantity");
    if(!String(fd.get("emis_code") || "").trim()){ showErr("EMIS code is required."); return; }
    if(!school){ showErr("This EMIS code was not found among your schools. Check the code and try again."); return; }
    if(!date){ showErr("Enter the consumption date."); return; }
    if(date > todayStr()){ showErr("Consumption can't be dated in the future - check the day and month."); return; }
    if(!product || !scheduled.some(p => p.id === product.id)){ showErr(`No product is scheduled for consumption on ${date}. Pick another date.`); return; }
    if(qtyRaw === "" || isNaN(Number(qtyRaw)) || Number(qtyRaw) < 0){ showErr("Enter the quantity consumed."); return; }
    const qty = Number(qtyRaw);
    if(qty === 0 && !confirm(`Save a consumption of 0 for ${product.product_name} at ${school.school_name} (${date})? Confirm only if nothing was consumed.`)) return;
    if(figures && qty > Number(figures.opening) + Number(figures.received)){
      showInsufficientStockModal({ productName: product.product_name, unitName: product.unit_name, available: Number(figures.opening) + Number(figures.received),
                                   emisCode: school.emis_code, schoolName: school.school_name });
      return;
    }
    busy = true; submitBtn.disabled = true; submitBtn.textContent = "Saving…";
    try{
      const res = await saveConsumption(school, product, date, qty);
      if(res.ok){
        busy = false; overlay.remove();
        toast(`${product.product_name} consumption added for ${school.school_name}`);
        if(date !== selectedDate){ selectedDate = date; await renderConsumption(); }
        else await loadConsumptionList(currentVisibleIds);
        return;
      }
      if(!res.handled) showErr(res.message || "Could not save.");
    }catch(err){
      showErr(err.message || "Could not save.");
    }finally{
      if(document.body.contains(overlay)){ busy = false; submitBtn.disabled = false; submitBtn.textContent = "Submit"; }
    }
  });

  form.elements.emis_code.focus();
  refreshType();
}

function showEditConsumptionModal(entry){
  const old = document.getElementById("editConsumptionModal");
  if(old) old.remove();
  const school = cache.schools.find(s => s.id === entry.school_id);
  const product = cache.products.find(p => p.id === entry.product_id);
  if(!school || !product){ toast("School or product not found.", "bad"); return; }
  const overlay = document.createElement("div");
  overlay.id = "editConsumptionModal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Edit consumption</h3>
      <p><b>${esc(school.school_name)}</b> (EMIS ${esc(school.emis_code)}) - ${esc(product.product_name)} - ${esc(selectedDate)}</p>
      <form id="editConsForm" class="form-row" style="grid-template-columns:1fr;">
        <div id="editConsAvail"></div>
        <div><label>Quantity consumed (packs) *</label><input type="number" name="quantity" min="0" step="0.01" value="${Number(entry.quantity)}" required/></div>
        <div id="editConsError"></div>
        <div class="actions-row">
          <button class="btn-secondary" id="editConsCancel" type="button">Cancel</button>
          <button class="btn-primary" id="editConsSubmit" type="submit">Save</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const form = document.getElementById("editConsForm");
  const errBox = document.getElementById("editConsError");
  const submitBtn = document.getElementById("editConsSubmit");
  let busy = false, available = null;
  const close = () => { if(!busy) overlay.remove(); };
  document.getElementById("editConsCancel").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
  consumptionFigures(school.id, product.id, selectedDate).then(f => {
    available = Number(f.opening) + Number(f.received);
    document.getElementById("editConsAvail").innerHTML = `<div class="modal-note">Opening ${fmt(f.opening)} + received today ${fmt(f.received)} = <b>${fmt(available)} ${esc(product.unit_name || "packs")} available</b>.</div>`;
  }).catch(() => {});

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if(busy) return;
    errBox.innerHTML = "";
    const qtyRaw = new FormData(form).get("quantity");
    if(qtyRaw === "" || isNaN(Number(qtyRaw)) || Number(qtyRaw) < 0){ errBox.innerHTML = `<div class="modal-note" style="color:var(--bad-fg);">Enter the quantity consumed.</div>`; return; }
    const qty = Number(qtyRaw);
    if(available !== null && qty > available){
      showInsufficientStockModal({ productName: product.product_name, unitName: product.unit_name, available, emisCode: school.emis_code, schoolName: school.school_name });
      return;
    }
    busy = true; submitBtn.disabled = true; submitBtn.textContent = "Saving…";
    try{
      const res = await saveConsumption(school, product, selectedDate, qty);
      if(res.ok){
        busy = false; overlay.remove();
        toast("Consumption updated");
        await loadConsumptionList(currentVisibleIds);
        return;
      }
      if(!res.handled) errBox.innerHTML = `<div class="modal-note" style="color:var(--bad-fg);">${esc(res.message || "Could not save.")}</div>`;
    }finally{
      if(document.body.contains(overlay)){ busy = false; submitBtn.disabled = false; submitBtn.textContent = "Save"; }
    }
  });
}
</script>
