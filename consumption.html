<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consumption — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Consumption</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null;
let cache = { markaz:[], schools:[], products:[] };
let selectedDate = new Date().toISOString().slice(0,10);

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  if(!["admin","super_admin","tr","aeo"].includes(profile.role)){
    alert("This module is for AEOs and administrators.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderGrid();
}

async function loadRefData(){
  let markazQuery = sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name");
  if(currentProfile.role === "aeo") markazQuery = markazQuery.eq("id", currentProfile.markaz_id);
  if(currentProfile.role === "tr" && currentProfile.tehsil) markazQuery = markazQuery.eq("tehsil", currentProfile.tehsil);
  let schoolsQuery = sb.from("schools").select("id,school_name,emis_code,markaz_id").eq("active", true).order("emis_code");
  if(currentProfile.role === "aeo") schoolsQuery = schoolsQuery.eq("markaz_id", currentProfile.markaz_id);
  if(currentProfile.role === "tr" && currentProfile.tehsil) schoolsQuery = sb.from("schools").select("id,school_name,emis_code,markaz_id,markaz!inner(tehsil)").eq("active", true).eq("markaz.tehsil", currentProfile.tehsil).order("emis_code");
  const [{ data: markaz }, { data: schools }, { data: products }] = await Promise.all([
    markazQuery,
    schoolsQuery,
    sb.from("products").select("id,product_name,unit_name").eq("active", true),
  ]);
  cache.markaz = markaz || [];
  cache.schools = schools || [];
  // Milk block first, then Biscuit (and anything else after), matching the
  // requested column order rather than plain alphabetical.
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });
}

/* ===================== JURISDICTION FILTER (admin/tr only) ===================== */
function renderJurisdictionFilter(container, onApply){
  if(!["admin","super_admin","tr"].includes(currentProfile.role)){
    onApply(cache.schools.map(s => s.id));
    return;
  }
  const districts = [...new Set(cache.markaz.map(m => m.district))].filter(Boolean).sort();
  container.innerHTML = `
    <div class="card">
      <h3>Filter by jurisdiction</h3>
      <p class="sub">Narrow the schools shown below by District, Tehsil, or Markaz.</p>
      <div class="form-row">
        <div><label>District</label><select id="jfDistrict"><option value="">All</option>${districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>
        <div><label>Tehsil</label><select id="jfTehsil"><option value="">All</option></select></div>
        <div><label>Markaz</label><select id="jfMarkaz"><option value="">All</option></select></div>
      </div>
    </div>
  `;
  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz");
  function refreshTehsil(){
    const d = dEl.value;
    const tehsils = [...new Set(cache.markaz.filter(m => !d || m.district === d).map(m => m.tehsil))].filter(Boolean).sort();
    tEl.innerHTML = `<option value="">All</option>` + tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  function refreshMarkaz(){
    const d = dEl.value, t = tEl.value;
    const list = cache.markaz.filter(m => (!d || m.district === d) && (!t || m.tehsil === t));
    mEl.innerHTML = `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  }
  function apply(){
    const d = dEl.value, t = tEl.value, mId = mEl.value;
    const markazIds = new Set(cache.markaz.filter(m => (!d || m.district === d) && (!t || m.tehsil === t) && (!mId || m.id === mId)).map(m => m.id));
    onApply(cache.schools.filter(s => markazIds.has(s.markaz_id)).map(s => s.id));
  }
  refreshTehsil(); refreshMarkaz();
  dEl.addEventListener("change", () => { refreshTehsil(); refreshMarkaz(); apply(); });
  tEl.addEventListener("change", () => { refreshMarkaz(); apply(); });
  mEl.addEventListener("change", apply);
  apply();
}

/* ===================== GRID ===================== */
async function renderGrid(){
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <h3>Date</h3>
      <p class="sub">Defaults to today. Pick an earlier date to review or correct that day's entries.</p>
      <div class="form-row">
        <div><label>Consumption date</label><input type="date" id="dateInput" value="${selectedDate}" max="${todayStr()}" /></div>
        <div style="align-self:end;"><button class="btn-primary" id="loadDateBtn" type="button">Load</button></div>
        <div style="align-self:end;"><button class="btn-secondary" id="todayBtn" type="button">Jump to today</button></div>
      </div>
    </div>
    <div id="filterMount"></div>
    <div class="card">
      <h3>Schools — ${esc(selectedDate)}</h3>
      <p class="sub">Click a Consumed cell to enter or correct that school's figure for the selected date. Values save immediately.</p>
      <div class="table-wrap"><table id="gridTable"><thead></thead><tbody>
        <tr><td colspan="20" style="color:var(--ink-soft)">Loading…</td></tr>
      </tbody></table></div>
    </div>
  `;

  document.getElementById("loadDateBtn").addEventListener("click", () => {
    selectedDate = document.getElementById("dateInput").value || todayStr();
    renderGrid();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    selectedDate = todayStr();
    renderGrid();
  });

  renderJurisdictionFilter(document.getElementById("filterMount"), (schoolIds) => loadGridData(schoolIds));
}

async function loadGridData(visibleSchoolIds){
  const schoolIds = visibleSchoolIds;
  const visibleSchools = cache.schools.filter(s => schoolIds.includes(s.id));
  const thead = document.querySelector("#gridTable thead");
  const tbody = document.querySelector("#gridTable tbody");

  if(!schoolIds.length){
    tbody.innerHTML = `<tr><td colspan="3" style="color:var(--ink-soft)">No schools match this filter.</td></tr>`;
    return;
  }

  const { data, error } = await sb.rpc("fn_consumption_grid", { p_school_ids: schoolIds, p_date: selectedDate });
  if(error){
    tbody.innerHTML = `<tr><td colspan="3" class="err">${esc(error.message)}</td></tr>`;
    return;
  }

  // Pivot the long RPC result (one row per school+product) into a wide row per school.
  const bySchool = {};
  (data || []).forEach(r => {
    bySchool[r.school_id] = bySchool[r.school_id] || {};
    bySchool[r.school_id][r.product_id] = r;
  });

  // Header: Sr#, EMIS, School, then Opening/Received/Consumed/Remaining per product.
  thead.innerHTML = `<tr>
    <th rowspan="2">Sr#</th><th rowspan="2">EMIS</th><th rowspan="2">School</th>
    ${cache.products.map(p => `<th colspan="4" class="${p.product_name.toLowerCase().includes('milk') ? 'col-group-milk' : 'col-group-biscuit'}">${esc(p.product_name)}</th>`).join("")}
  </tr><tr>
    ${cache.products.map(p => `
      <th class="${p.product_name.toLowerCase().includes('milk') ? 'col-group-milk' : 'col-group-biscuit'}">Opening</th>
      <th class="${p.product_name.toLowerCase().includes('milk') ? 'col-group-milk' : 'col-group-biscuit'}">Received</th>
      <th class="${p.product_name.toLowerCase().includes('milk') ? 'col-group-milk' : 'col-group-biscuit'}">Consumed</th>
      <th class="${p.product_name.toLowerCase().includes('milk') ? 'col-group-milk' : 'col-group-biscuit'}">Remaining</th>
    `).join("")}
  </tr>`;

  tbody.innerHTML = visibleSchools.map((s, i) => {
    const cells = cache.products.map(p => {
      const r = (bySchool[s.id] || {})[p.id] || { opening:0, received:0, consumed:0, remaining:0 };
      const cls = p.product_name.toLowerCase().includes("milk") ? "col-group-milk" : "col-group-biscuit";
      return `
        <td class="${cls}">${fmt(r.opening)}</td>
        <td class="${cls}">${fmt(r.received)}</td>
        <td class="${cls}">
          <input type="number" min="0" step="0.01" class="consumed-input" style="width:80px;padding:5px 6px;"
                 data-school="${s.id}" data-product="${p.id}" value="${r.consumed}" />
        </td>
        <td class="${cls}">${fmt(r.remaining)}</td>
      `;
    }).join("");
    return `<tr><td>${i+1}</td><td>${esc(s.emis_code)}</td><td>${esc(s.school_name)}</td>${cells}</tr>`;
  }).join("");

  tbody.querySelectorAll(".consumed-input").forEach(inp => {
    inp.addEventListener("change", async () => {
      const schoolId = inp.dataset.school;
      const productId = inp.dataset.product;
      const qty = Number(inp.value || 0);
      try{
        const { error } = await sb.rpc("fn_upsert_consumption", {
          p_school_id: schoolId,
          p_product_id: productId,
          p_consumption_date: selectedDate,
          p_quantity: qty,
        });
        if(error) throw error;
        toast("Saved");
        await loadGridData(schoolIds);
      }catch(err){
        toast(err.message, "bad");
        await loadGridData(schoolIds); // revert the cell to the real stored value
      }
    });
  });
}
</script>
</body>
</html>
