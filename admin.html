<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — School Meal Program</title>
<script src="assets/safety.js?v=20261015a"></script>
<script src="assets/layout.js?v=20261015a"></script>
<script src="assets/sync-me.js?v=20261015a"></script>
<script src="assets/email-prompt.js?v=20261018a"></script>
<script src="assets/config.js?v=20261015a"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css?v=20261022a" />
<style>
  .dow-grid{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
  .dow-chip{ display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; }
  .dow-chip input{ margin:0; }

.wa-hub{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:14px; }
.wa-tile{ display:flex; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); cursor:pointer; }
.wa-tile:hover{ border-color:var(--navy); }
.wa-tile .ic{ font-size:26px; line-height:1; }
.wa-tile .t{ font-size:14px; font-weight:700; color:var(--navy); display:block; }
.wa-tile .d{ font-size:12px; color:var(--ink-soft); display:block; margin-top:2px; }
.wa-back{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.wa-back h2{ margin:0; font-size:16px; color:var(--navy); }
details.wa-det{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; }
details.wa-det > summary{ cursor:pointer; padding:10px 14px; font-weight:700; font-size:14px; color:var(--navy); list-style:none; }
details.wa-det > summary::-webkit-details-marker{ display:none; }
details.wa-det > summary::before{ content:"\25B8  "; }
details.wa-det[open] > summary::before{ content:"\25BE  "; }
details.wa-det > .wa-body{ padding:2px 14px 12px; }
#adminSectionContent .card{ padding:12px 14px; margin-bottom:10px; }
#adminSectionContent .form-row{ gap:10px; }
.wa-casc{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:8px; }
.wa-casc select:disabled, .wa-casc input:disabled{ opacity:.55; }
.wa-casc label{ font-size:12px; }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Admin Panel</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/*
  Admin-only. Not linked anywhere for non-admins, and boot() below redirects
  anyone who isn't admin/super_admin straight back to the dashboard before
  any content renders - same belt-and-suspenders approach as Operations'
  Adjustments section (client-side gate here, RLS as the real backstop:
  products_write and schedule_exceptions_admin_write are both fn_is_admin()
  only, so even a manually-forged request from a non-admin session fails).
*/

const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);
const DOW_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let currentUser = null, currentProfile = null;
let cache = { products: [] };

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d + "T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  if(!["admin","super_admin"].includes(profile.role)){
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();

function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderSidebarNav();
  renderPage();
}

async function loadRefData(){
  const { data: products } = await sb.from("products").select("id,product_name,unit_name,schedule_dow").eq("active", true).order("product_name");
  // Milk first, then Biscuit - matches the convention used everywhere else
  // in the app (forms, tables, reports).
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });
}

/* ===================== SECTION NAV ===================== */
const SECTIONS = [
  { id:"schedule", label:"Consumption Schedule", desc:"Which weekdays each product is distributed, plus one-off overrides" },
  { id:"report", label:"Missing Consumption Report", desc:"Auto-email missing-consumption reports - to concerned persons and to each user" },
  { id:"locks", label:"Inventory & Consumption Period Lock", desc:"Lock a product's inventory and/or consumption entries through a date" },
  { id:"whatsapp", label:"WhatsApp Automation", desc:"Tehsil-wise missing-consumption messages to added recipients (max 50/day)" },
  { id:"health", label:"Start/Stop School Meal Program", desc:"Close or start the meal program (stops inventory, consumption and WhatsApp) - plus database keep-alive status" },
];
let currentSection = "schedule";

function renderPage(){
  const content = document.getElementById("content");
  content.innerHTML = `<div class="menu-cards" id="adminSectionNav"></div><div id="adminSectionContent"></div>`;
  const nav = document.getElementById("adminSectionNav");
  SECTIONS.forEach(s => {
    const a = document.createElement("a");
    a.className = "menu-card" + (s.id === currentSection ? " active" : "");
    a.innerHTML = `<span class="label">${esc(s.label)}</span><span class="desc">${esc(s.desc)}</span>`;
    a.onclick = () => { currentSection = s.id; if(s.id === "whatsapp") waView = "hub"; renderPage(); };
    nav.appendChild(a);
  });
  if(currentSection === "health") renderHealthSection();
  else if(currentSection === "report") renderReportSection();
  else if(currentSection === "locks") renderLocksSection();
  else if(currentSection === "whatsapp") renderWhatsappSection();
  else renderScheduleSection();
}

/* ===================== MISSING CONSUMPTION REPORT (EMAIL) ===================== */
function pktToUtc(hh, mm){ let h = (hh - 5 + 24) % 24; return { h, m: mm }; }
function utcToPkt(hh, mm){ let h = (hh + 5) % 24; return { h, m: mm }; }
function pad2(n){ return String(n).padStart(2, "0"); }

async function renderReportSection(){
  const content = document.getElementById("adminSectionContent");
  content.innerHTML = `<div class="card"><p style="color:var(--ink-soft)">Loading…</p></div>`;

  const { data: s, error } = await sb.from("missing_consumption_report_settings").select("*").eq("id", true).single();
  if(error){ content.innerHTML = `<div class="card"><div class="err">${esc(error.message)}</div></div>`; return; }

  const times = (s.send_times && s.send_times.length ? s.send_times : [{ hour: s.send_hour_utc, minute: s.send_minute_utc }]);
  const recipients = s.recipients || [];

  content.innerHTML = `
    <div class="card">
      <h3>Remaining Schools Auto Email</h3>
      <p class="sub">Automatically emails the Missing Consumption report (schools + markaz-wise summary, same data as Operations &rarr; Missing Consumption) to configured recipients on a schedule, so nobody has to remember to check it manually.</p>

      <div class="form-row" style="margin-top:14px;">
        <div><label>Enabled</label>
          <select id="repEnabled">
            <option value="true" ${s.enabled ? "selected" : ""}>Enabled</option>
            <option value="false" ${!s.enabled ? "selected" : ""}>Disabled</option>
          </select>
        </div>
        <div><label>Lookback (days checked each run)</label>
          <input type="number" id="repLookback" min="1" max="31" value="${s.lookback_days}"/>
        </div>
      </div>

      <div style="margin-top:16px;">
        <label>Sending Times (Pakistan Time - Asia/Karachi)</label>
        <p class="sub">Add as many times a day as needed - each one generates a fresh report and sends it independently.</p>
        <div id="repTimes" style="display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;"></div>
        <div style="display:flex; gap:8px;">
          <input type="time" id="repNewTime" style="flex:1;"/>
          <button class="btn-secondary" type="button" id="repAddTimeBtn">Add</button>
        </div>
      </div>

      <div style="margin-top:16px;">
        <label>Recipient Emails</label>
        <div id="repRecipients" style="display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;"></div>
        <div style="display:flex; gap:8px;">
          <input type="email" id="repNewEmail" placeholder="name@example.com" style="flex:1;"/>
          <button class="btn-secondary" type="button" id="repAddEmailBtn">Add</button>
        </div>
      </div>

      <div class="actions-row" style="margin-top:18px;">
        <button class="btn-primary" type="button" id="repSaveBtn">Save Settings</button>
        <button class="btn-secondary" type="button" id="repSendNowBtn">Send Now</button>
      </div>
      <div id="repStatus"></div>
    </div>

    <div class="card">
      <h3>Last Run</h3>
      <div class="grid-4">
        <div class="stat"><div class="n">${s.last_run_at ? fmtDateTime(s.last_run_at) : "—"}</div><div class="l">Last run (local time)</div></div>
        <div class="stat"><div class="n" style="color:${s.last_run_status === 'sent' ? 'var(--ok-fg)' : (s.last_run_status ? 'var(--bad-fg)' : 'inherit')}">${esc(s.last_run_status || "Never run")}</div><div class="l">Status</div></div>
        <div class="stat"><div class="n">${s.last_run_missing_count ?? "—"}</div><div class="l">Schools in last report</div></div>
      </div>
    </div>
  `;

  let currentTimes = times.map(t => utcToPkt(t.hour, t.minute)); // work in PKT in the UI, convert back on save
  function renderTimeChips(){
    currentTimes.sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m));
    document.getElementById("repTimes").innerHTML = currentTimes.length
      ? currentTimes.map((t, i) => `<span class="pill pill-role">${pad2(t.h)}:${pad2(t.m)} <a href="#" data-idx="${i}" style="margin-left:6px; text-decoration:none;" class="rem-time-chip">&times;</a></span>`).join("")
      : `<span style="color:var(--ink-soft); font-size:12.5px;">No times configured yet - add at least one below.</span>`;
    document.querySelectorAll(".rem-time-chip").forEach(el => el.addEventListener("click", (e) => {
      e.preventDefault();
      currentTimes.splice(Number(el.dataset.idx), 1);
      renderTimeChips();
    }));
  }
  renderTimeChips();

  document.getElementById("repAddTimeBtn").addEventListener("click", () => {
    const input = document.getElementById("repNewTime");
    if(!input.value) return;
    const [hh, mm] = input.value.split(":").map(Number);
    if(currentTimes.some(t => t.h === hh && t.m === mm)){ toast("That time is already in the list", "bad"); return; }
    currentTimes.push({ h: hh, m: mm });
    input.value = "";
    renderTimeChips();
  });

  let currentRecipients = [...recipients];
  function renderChips(){
    document.getElementById("repRecipients").innerHTML = currentRecipients.length
      ? currentRecipients.map(e => `<span class="pill pill-role">${esc(e)} <a href="#" data-email="${esc(e)}" style="margin-left:6px; text-decoration:none;" class="rem-chip">&times;</a></span>`).join("")
      : `<span style="color:var(--ink-soft); font-size:12.5px;">No recipients configured yet - add at least one below.</span>`;
    document.querySelectorAll(".rem-chip").forEach(el => el.addEventListener("click", (e) => {
      e.preventDefault();
      currentRecipients = currentRecipients.filter(x => x !== el.dataset.email);
      renderChips();
    }));
  }
  renderChips();

  document.getElementById("repAddEmailBtn").addEventListener("click", () => {
    const input = document.getElementById("repNewEmail");
    const email = input.value.trim();
    if(!email) return;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("Enter a valid email address", "bad"); return; }
    if(currentRecipients.includes(email)){ toast("Already added", "bad"); return; }
    currentRecipients.push(email);
    input.value = "";
    renderChips();
  });

  document.getElementById("repSaveBtn").addEventListener("click", async () => {
    if(!currentTimes.length){ toast("Add at least one sending time", "bad"); return; }
    const sendTimesUtc = currentTimes.map(t => {
      const utc = pktToUtc(t.h, t.m);
      return { hour: utc.h, minute: utc.m };
    });
    try{
      const { error } = await sb.rpc("fn_set_report_schedule", {
        p_enabled: document.getElementById("repEnabled").value === "true",
        p_recipients: currentRecipients,
        p_send_times: sendTimesUtc,
        p_lookback_days: Number(document.getElementById("repLookback").value),
      });
      if(error) throw error;
      toast("Settings saved");
      renderReportSection();
    }catch(err){ toast(err.message, "bad"); }
  });

  document.getElementById("repSendNowBtn").addEventListener("click", async () => {
    const btn = document.getElementById("repSendNowBtn");
    const statusBox = document.getElementById("repStatus");
    btn.disabled = true; btn.textContent = "Sending…";
    statusBox.innerHTML = "";
    try{
      const { data: { session } } = await sb.auth.getSession();
      const resp = await fetch(`${SMP_CONFIG.SUPABASE_URL}/functions/v1/send-missing-report`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}` },
        body: JSON.stringify({ force: true }),
      });
      const result = await resp.json();
      if(!resp.ok) throw new Error(result.error || "Send failed");
      toast(`Sent - ${result.missing} of ${result.total} schools included`);
      renderReportSection();
    }catch(err){
      statusBox.innerHTML = `<div class="err" style="margin-top:10px;">${esc(err.message)}</div>`;
      toast("Send failed - see details below", "bad");
    } finally {
      btn.disabled = false; btn.textContent = "Send Now";
    }
  });

  // Per-user Gmail + send time sit under this same card.
  await renderUserReportsCard();
}

/* ---- Per-user daily report settings (Gmail + send time for each user) - lives under the same Missing Consumption Report card ---- */
async function renderUserReportsCard(){
  const content = document.getElementById("adminSectionContent");
  const old = document.getElementById("userReportsCard");
  if(old) old.remove();
  const card = document.createElement("div");
  card.className = "card";
  card.id = "userReportsCard";
  card.innerHTML = `<h3>Daily Report to Each User</h3><p style="color:var(--ink-soft)">Loading users…</p>`;
  content.appendChild(card);

  const [usersRes, markazRes] = await Promise.all([
    sb.from("profiles").select("id,full_name,role,markaz_id,tehsil,notify_email,report_time,active").eq("active", true),
    sb.from("markaz").select("id,name,tehsil"),
  ]);
  if(usersRes.error){ card.innerHTML = `<h3>Daily Report to Each User</h3><div class="err">${esc(usersRes.error.message)}</div>`; return; }
  const markazById = Object.fromEntries((markazRes.data || []).map(m => [m.id, m]));
  const roleOrder = { super_admin: 0, admin: 0, tr: 1, aeo: 2 };
  const users = (usersRes.data || []).slice().sort((a, b) =>
    (roleOrder[a.role] ?? 9) - (roleOrder[b.role] ?? 9)
    || String(a.tehsil || markazById[a.markaz_id]?.tehsil || "").localeCompare(String(b.tehsil || markazById[b.markaz_id]?.tehsil || ""))
    || String(markazById[a.markaz_id]?.name || "").localeCompare(String(markazById[b.markaz_id]?.name || ""))
    || String(a.full_name || "").localeCompare(String(b.full_name || "")));
  const hhmm = (t) => t ? String(t).slice(0, 5) : "";
  const ready = users.filter(u => u.notify_email && u.report_time).length;
  const GMAIL_RE = /^[a-z0-9._%+-]+@gmail\.com$/;

  card.innerHTML = `
    <h3>Daily Report to Each User</h3>
    <p class="sub">Set the Gmail address and the daily send time (Pakistan time) for each user. A user with no Gmail or no time gets no email.
      Users can also enter their own Gmail when they log in - whatever was saved last is used. These settings are stored now; the daily emails start once the sending service is connected.</p>
    <div class="grid-4" style="margin-bottom:10px;">
      <div class="stat"><div class="n">${users.length}</div><div class="l">Active users</div></div>
      <div class="stat"><div class="n">${ready}</div><div class="l">Ready (Gmail + time set)</div></div>
      <div class="stat"><div class="n">${users.filter(u => !u.notify_email).length}</div><div class="l">Still need a Gmail</div></div>
    </div>
    <div class="form-row" style="align-items:end;">
      <div><label>Same time for everyone</label><input type="time" id="urBulkTime"/></div>
      <div><button class="btn-secondary" type="button" id="urBulkApply">Fill this time for all users</button></div>
    </div>
    <div class="table-wrap" style="margin-top:12px;"><table id="urTable"><thead><tr>
      <th>Name</th><th>Role</th><th>Markaz / Tehsil</th><th>Gmail</th><th>Send time (PKT)</th>
    </tr></thead><tbody>
      ${users.map(u => `<tr data-uid="${esc(u.id)}">
        <td>${esc(u.full_name || "—")}</td>
        <td>${esc(u.role)}</td>
        <td>${esc(markazById[u.markaz_id]?.name || u.tehsil || "—")}</td>
        <td><input type="email" class="urEmail" value="${esc(u.notify_email || "")}" data-orig="${esc(u.notify_email || "")}" placeholder="name@gmail.com" style="min-width:210px;"/></td>
        <td><input type="time" class="urTime" value="${esc(hhmm(u.report_time))}" data-orig="${esc(hhmm(u.report_time))}"/></td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="actions-row" style="margin-top:14px;">
      <button class="btn-primary" type="button" id="urSaveBtn">Save changes</button>
      <span id="urDirty" class="sub" style="align-self:center;"></span>
    </div>
    <div id="urStatus"></div>`;

  const rows = () => [...card.querySelectorAll("#urTable tbody tr")];
  const changedRows = () => rows().filter(tr => {
    const e = tr.querySelector(".urEmail"), t = tr.querySelector(".urTime");
    return e.value.trim().toLowerCase() !== e.dataset.orig || t.value !== t.dataset.orig;
  });
  const refreshDirty = () => {
    const n = changedRows().length;
    rows().forEach(tr => {
      const e = tr.querySelector(".urEmail"), t = tr.querySelector(".urTime");
      tr.style.background = (e.value.trim().toLowerCase() !== e.dataset.orig || t.value !== t.dataset.orig) ? "var(--edit-bg, #fff8e1)" : "";
    });
    document.getElementById("urDirty").textContent = n ? `${n} unsaved change${n === 1 ? "" : "s"}` : "";
  };
  card.addEventListener("input", refreshDirty);

  document.getElementById("urBulkApply").addEventListener("click", () => {
    const v = document.getElementById("urBulkTime").value;
    if(!v){ toast("Pick a time first", "bad"); return; }
    card.querySelectorAll(".urTime").forEach(i => { i.value = v; });
    refreshDirty();
  });

  document.getElementById("urSaveBtn").addEventListener("click", async () => {
    const btn = document.getElementById("urSaveBtn");
    if(btn.disabled) return;
    const changed = changedRows();
    if(!changed.length){ toast("No changes to save"); return; }
    const payload = [];
    for(const tr of changed){
      const email = tr.querySelector(".urEmail").value.trim().toLowerCase();
      const time = tr.querySelector(".urTime").value;
      const name = tr.children[0].textContent;
      if(email && !GMAIL_RE.test(email)){ toast(`${name}: enter a valid Gmail address (name@gmail.com)`, "bad"); return; }
      payload.push({ id: tr.dataset.uid, email, time });
    }
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      const { data, error } = await sb.rpc("fn_admin_set_user_reports", { p_rows: payload });
      if(error) throw error;
      toast(`Saved ${data} user${data === 1 ? "" : "s"}`);
      await renderUserReportsCard();
    }catch(err){
      document.getElementById("urStatus").innerHTML = `<div class="err" style="margin-top:10px;">${esc(err.message)} - nothing was saved.</div>`;
      btn.disabled = false; btn.textContent = "Save changes";
    }
  });
}

/* ===================== INVENTORY & CONSUMPTION PERIOD LOCK ===================== */
function lkPkToday(){ return new Date(Date.now() + 5 * 3600 * 1000).toISOString().slice(0, 10); }   // Pakistan date
function lkAddDays(s, n){ const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function lkLong(s){ if(!s) return "—"; const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }); }
const LK_LABEL = { inventory: "Inventory", consumption: "Consumption" };

function lkEnsureCss(){
  if(document.getElementById("lkCss")) return;
  const s = document.createElement("style"); s.id = "lkCss";
  s.textContent = `
    .lk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100000;padding:14px;}
    .lk-box{background:#fff;color:#1b1f23;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-radius:10px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);}
    .lk-box h3{margin:0 0 8px;} .lk-box ul{margin:8px 0 8px 18px;padding:0;} .lk-box li{margin:6px 0;}
    .lk-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;}
    .lk-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
    .lk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end;}
  `;
  document.head.appendChild(s);
}

function lkConfirm({ title, lines, confirmText }){
  lkEnsureCss();
  return new Promise((resolve) => {
    const o = document.createElement("div");
    o.className = "lk-overlay";
    o.innerHTML = `<div class="lk-box" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>
      <ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul>
      <p style="margin:8px 0 0;color:#555;font-size:13px;">No inventory or consumption record is deleted or changed by this action.</p>
      <div class="lk-actions"><button type="button" class="btn-secondary" id="lkNo">Cancel</button><button type="button" class="btn-primary" id="lkYes">${esc(confirmText)}</button></div>
    </div>`;
    document.body.appendChild(o);
    const done = v => { o.remove(); resolve(v); };
    o.querySelector("#lkNo").addEventListener("click", () => done(false));
    o.querySelector("#lkYes").addEventListener("click", () => done(true));
  });
}

async function lkCount(productId, type, through){
  const q = type === "inventory"
    ? sb.from("school_receipts").select("id", { count: "exact", head: true }).eq("product_id", productId).eq("status", "active").lte("receipt_date", through)
    : sb.from("consumption").select("id", { count: "exact", head: true }).eq("product_id", productId).eq("status", "active").lte("consumption_date", through);
  const { count } = await q;
  return count || 0;
}

    if(r) return `<span class="pill pill-ok">🔓 Unlocked</span> <span style="color:var(--ink-soft);font-size:12px;">(was locked through ${esc(lkLong(r.locked_through))})</span>`;
    return `<span class="pill pill-ok">🔓 Not locked</span>`;
  };
  const byWho = (pid, t) => { const r = byKey[pid + "|" + t]; return r ? `${esc(r.locked_by_name || "—")}<br><span style="color:var(--ink-soft);font-size:12px;">${esc(fmtTime(r.locked_at))}</span>` : "—"; };

  content.innerHTML = `
    <div class="card">
      <h3>Inventory &amp; Consumption Period Lock</h3>
      <p class="sub">Lock a product's inventory and/or consumption entries through a date. Nobody (users or Admin) can then add, edit or delete entries dated on or before that date, for that product only, until you unlock it here.
        Example: choose Milk, pick 15 October 2026, then click <b>Lock Both</b>.</p>
      <p class="sub" style="margin-top:4px;">${activeLocks.length ? `<b>Locked now:</b> ${activeLocks.map(r => `${esc(r.product_name)} ${esc(LK_LABEL[r.entry_type].toLowerCase())} through ${esc(lkLong(r.locked_through))}`).join(" · ")}` : "No period is locked right now."}</p>
      <div class="lk-grid" style="margin-top:12px;">
        <div><label>Select Product</label><select id="lkProduct">${cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("")}</select></div>
        <div><label>Lock Through Date</label><input type="date" id="lkDate" max="${lkPkToday()}"/></div>
      </div>
      <div class="lk-btns">
        <button class="btn-primary" type="button" id="lkInv">Lock Inventory</button>
        <button class="btn-primary" type="button" id="lkCons">Lock Consumption</button>
        <button class="btn-primary" type="button" id="lkBoth">Lock Both</button>
      </div>
      <div class="lk-btns" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line, #ddd);">
        <label style="margin:0;">Unlock</label>
        <select id="lkUnlockType"><option value="both">Inventory and Consumption</option><option value="inventory">Inventory only</option><option value="consumption">Consumption only</option></select>
        <button class="btn-secondary" type="button" id="lkUnlock">Unlock</button>
      </div>
    </div>

    <div class="card">
      <h3>Lock status</h3>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th>Entry type</th><th>Status</th><th>Locked by / when</th></tr></thead><tbody>
        ${cache.products.map(p => ["inventory", "consumption"].map((t, i) => `<tr>
          <td>${i === 0 ? `<b>${esc(p.product_name)}</b>` : ""}</td><td>${esc(LK_LABEL[t])}</td><td>${statusCell(p.id, t)}</td><td>${byWho(p.id, t)}</td></tr>`).join("")).join("")}
      </tbody></table></div>
    </div>

    <div class="card">
      <h3>Lock history</h3>
      ${audRes.error ? `<div class="err">${esc(audRes.error.message)}</div>` : `
      <div class="table-wrap"><table><thead><tr><th>When</th><th>Product</th><th>Entry type</th><th>Action</th><th>Previous date</th><th>New date</th><th>Admin</th></tr></thead><tbody>
        ${(audRes.data || []).length ? audRes.data.map(a => `<tr><td>${esc(fmtTime(a.created_at))}</td><td>${esc(a.product_name)}</td><td>${esc(LK_LABEL[a.entry_type])}</td>
          <td>${esc({ lock: "Lock", unlock: "Unlock", date_change: "Date change" }[a.action] || a.action)}</td><td>${a.previous_through ? esc(lkLong(a.previous_through)) : "—"}</td><td>${a.new_through ? esc(lkLong(a.new_through)) : "—"}</td><td>${esc(a.admin_name || "—")}</td></tr>`).join("")
          : `<tr><td colspan="7" style="color:var(--ink-soft)">No lock actions yet.</td></tr>`}
      </tbody></table></div>`}
      <details style="margin-top:12px;"><summary style="cursor:pointer;">Refused attempts on locked periods (latest 25)</summary>
        ${attRes.error ? `<div class="err">${esc(attRes.error.message)}</div>` : `
        <div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Product</th><th>Entry type</th><th>Entry date</th><th>Locked through</th><th>Operation</th></tr></thead><tbody>
          ${(attRes.data || []).length ? attRes.data.map(a => `<tr><td>${esc(fmtTime(a.created_at))}</td><td>${esc(a.user_name || "—")}</td><td>${esc(a.product_name)}</td><td>${esc(LK_LABEL[a.entry_type] || a.entry_type)}</td>
            <td>${a.entry_date ? esc(lkLong(a.entry_date)) : "—"}</td><td>${a.locked_through ? esc(lkLong(a.locked_through)) : "—"}</td><td>${esc(a.operation || "")}</td></tr>`).join("")
            : `<tr><td colspan="7" style="color:var(--ink-soft)">None recorded.</td></tr>`}
        </tbody></table></div>`}
      </details>
    </div>`;

  let busy = false;
  async function act(action, types){
    if(busy) return;
    const pid = document.getElementById("lkProduct").value;
    const product = cache.products.find(p => p.id === pid);
    const through = document.getElementById("lkDate").value;
    if(!pid){ toast("Select a product", "bad"); return; }
    if(action === "lock"){
      if(!through){ toast("Pick the date to lock through", "bad"); return; }
      if(through > lkPkToday()){ toast("The lock-through date cannot be in the future", "bad"); return; }
    }
    const lines = []; let changes = 0;
    for(const t of types){
      const cur = byKey[pid + "|" + t];
      const curThrough = cur && cur.status === "locked" ? cur.locked_through : null;
      const label = `<b>${esc(product.product_name)} ${esc(LK_LABEL[t].toLowerCase())}</b>`;
      if(action === "lock"){
        if(curThrough === through){ lines.push(`${label}: already locked through ${esc(lkLong(through))} - no change.`); continue; }
        changes++;
        if(!curThrough){
          const n = await lkCount(pid, t, through);
          lines.push(`${label}: every entry dated on or before <b>${esc(lkLong(through))}</b> will be locked (${n} existing ${n === 1 ? "entry becomes" : "entries become"} read-only). Nobody can add, edit or delete entries in that period.`);
        } else if(through > curThrough){
          lines.push(`${label}: lock date moves from ${esc(lkLong(curThrough))} to <b>${esc(lkLong(through))}</b>. <b>${esc(lkLong(lkAddDays(curThrough, 1)))} to ${esc(lkLong(through))} will become LOCKED.</b>`);
        } else {
          lines.push(`${label}: lock date moves back from ${esc(lkLong(curThrough))} to <b>${esc(lkLong(through))}</b>. <b>${esc(lkLong(lkAddDays(through, 1)))} to ${esc(lkLong(curThrough))} will be UNLOCKED</b> - users can add, edit and delete entries on those dates again.`);
        }
      } else {
        if(!curThrough){ lines.push(`${label}: not locked - nothing to unlock.`); continue; }
        changes++;
        lines.push(`${label}: everything through <b>${esc(lkLong(curThrough))}</b> will be <b>UNLOCKED</b>. Users can add, edit and delete entries in that period again.`);
      }
    }
    if(!changes){ toast("No change - already in that state"); return; }
    const ok = await lkConfirm({
      title: action === "lock" ? "Confirm lock" : "Confirm unlock", lines,
      confirmText: action === "lock" ? "Yes, lock" : "Yes, unlock",
    });
    if(!ok) return;
    busy = true;
    ["lkInv", "lkCons", "lkBoth", "lkUnlock"].forEach(id => { const b = document.getElementById(id); if(b) b.disabled = true; });
    try{
      const { error } = await sb.rpc("fn_admin_set_period_lock", { p_product_id: pid, p_entry_types: types, p_action: action, p_through: action === "lock" ? through : null });
      if(error) throw error;
      toast(action === "lock" ? "Period locked" : "Period unlocked");
      await renderLocksSection();
    }catch(err){
      toast(err.message, "bad");
      busy = false;
      ["lkInv", "lkCons", "lkBoth", "lkUnlock"].forEach(id => { const b = document.getElementById(id); if(b) b.disabled = false; });
    }
  }
  document.getElementById("lkInv").addEventListener("click", () => act("lock", ["inventory"]));
  document.getElementById("lkCons").addEventListener("click", () => act("lock", ["consumption"]));
  document.getElementById("lkBoth").addEventListener("click", () => act("lock", ["inventory", "consumption"]));
  document.getElementById("lkUnlock").addEventListener("click", () => {
    const v = document.getElementById("lkUnlockType").value;
    act("unlock", v === "both" ? ["inventory", "consumption"] : [v]);
  });
}

      <div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Started (consumption from)</th><th>Closed on</th></tr></thead><tbody>
        ${periods.map(x => `<tr><td>${fmtDate(x.start_date)}</td><td>${x.end_date ? fmtDate(x.end_date) : "<span class='pill pill-ok'>Running</span>"}</td></tr>`).join("")}
      </tbody></table></div>
    </div>`;
  const hoursAgo = (Date.now() - new Date(data.last_beat_at).getTime()) / 36e5;

  content.innerHTML = programHtml + `
    <div class="card">
      <h3>Database keep-alive</h3>
      <p class="sub">Supabase's free tier pauses a project after 7 days with no database activity. A daily job (pg_cron, 03:00 UTC) writes a real update to keep this project active - well under that threshold with margin to spare.</p>
      <div class="grid-4" style="margin-top:14px;">
        <div class="stat"><div class="n" style="color:${healthy ? 'var(--ok-fg)' : 'var(--bad-fg)'}">${healthy ? "Healthy" : "Check needed"}</div><div class="l">Status</div></div>

    if(!d){ toast("Choose the date consumption starts from", "bad"); return; }

        <div><label>Automation</label><select id="waEnabled"><option value="true" ${s.enabled ? "selected" : ""}>Enabled</option><option value="false" ${!s.enabled ? "selected" : ""}>Disabled</option></select></div>
        <div><label>Mode</label><select id="waDry"><option value="true" ${s.dry_run ? "selected" : ""}>Dry-run (nothing is sent)</option><option value="false" ${!s.dry_run ? "selected" : ""}>Live (real messages)</option></select></div>
        <div><label>Daily limit (max 50)</label><input type="number" id="waCap" min="0" max="50" value="${s.daily_cap}"/></div>
      </div>
      <div class="form-row">
        <div><label>Queue reports after (PKT) - default</label><input type="time" id="waSendTime" value="${esc(String(s.send_time).slice(0,5))}"/></div>
        <div><label>Sending window start</label><input type="time" id="waWinStart" value="${esc(String(s.window_start).slice(0,5))}"/></div>
        <div><label>Sending window end</label><input type="time" id="waWinEnd" value="${esc(String(s.window_end).slice(0,5))}"/></div>
        <div><label>Lookback (days)</label><input type="number" id="waLookback" min="1" max="30" value="${s.lookback_days}"/></div>
      </div>
      <div class="actions-row" style="margin-top:14px;">
        <button class="btn-primary" type="button" id="waSaveBtn">Save Settings</button>
        <button class="${s.emergency_stop ? 'btn-secondary' : 'btn-danger'}" type="button" id="waStopBtn">${s.emergency_stop ? "Clear Emergency Stop" : "Emergency Stop"}</button>
      </div>
    </div>

    <details class="wa-det" id="waFormDet"><summary id="waFormTitle">Add Recipient</summary><div class="wa-body">
      <p class="sub">Only people added here receive messages. Add consent before activating; a "STOP" reply opts a recipient out automatically.</p>
      <div class="form-row" style="margin-top:12px;">
        <div><label>Name</label><input type="text" id="waName" placeholder="Recipient name"/></div>
        <div><label>Send to</label><select id="waTarget"><option value="person">A person</option><option value="group">A WhatsApp group (whole-tehsil summary)</option></select></div>
        <div id="waPhoneBox"><label>WhatsApp number</label><input type="text" id="waPhone" placeholder="03001234567 (can be added later)"/></div>
        <div id="waGroupBox" style="display:none;"><label>WhatsApp group</label><select id="waGroup"><option value="">Select group…</option>${waGroups.map(g => `<option value="${esc(g.jid)}">${esc(g.subject || g.jid)}</option>`).join("")}</select>${waGroups.length ? "" : `<div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">No groups yet. Add the WhatsApp number to the group, then restart the worker - it lists its groups when it connects.</div>`}</div>
        <div><label>Reports to receive</label><select id="waScope">
          <option value="markaz">Selected markaz (one or more - one combined message)</option>
          <option value="tehsil">Whole tehsil (markaz-wise detail)</option></select></div>
      </div>
      <div class="form-row">
        <div id="waDistBox"><label>District</label><select id="waDistrict"><option value="">Select…</option>${districts.map(d => `<option value="${esc(d)}"${districts.length === 1 ? " selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
        <div id="waWingBox"><label>Wing (optional)</label><select id="waWing"><option value="">All wings</option><option value="M-EE">M-EE</option><option value="W-EE">W-EE</option></select></div>
        <div id="waTehBox"><label>Tehsil</label><select id="waTehsil"><option value="">Select…</option></select></div>
      </div>
      <div id="waMarkazBox" style="margin-top:6px;">
        <label>Markaz (tick one or more - include any extra markaz this person covers)</label>
        <div id="waMarkazList" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px 14px; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--paper); max-height:220px; overflow:auto;"><span style="color:var(--ink-soft)">Select a tehsil first.</span></div>
      </div>
      <div class="form-row">
        <div><label>Consent source</label><input type="text" id="waConsentSrc" placeholder="e.g. agreed verbally / written"/></div>
        <div><label>Queue time for this recipient (optional)</label><input type="time" id="waRecTime"/><div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">Blank = the general time above. Sending still waits for the sending window.</div></div>
        <div><label>Consent given?</label><select id="waConsent"><option value="pending">Not yet</option><option value="granted">Yes - consent recorded</option></select></div>
      </div>
      <div class="actions-row" style="margin-top:12px;"><button class="btn-primary" type="button" id="waAddBtn">Add Recipient</button> <button class="btn-secondary" type="button" id="waCancelEdit" style="display:none;">Cancel edit</button></div>
    </div></details>

    <div class="card">
      <h3>Recipients (${recs.length})</h3>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Number</th><th>Tehsil</th><th>Receives</th><th>Wing</th><th>Queue time</th><th>Consent</th><th>Active</th><th></th></tr></thead><tbody>
        ${recs.length ? recs.map(r => `<tr>
          <td>${esc(r.recipient_name)}</td><td>${r.group_jid ? "Group: " + esc((waGroups.find(g => g.jid === r.group_jid) || {}).subject || "WhatsApp group") : (r.phone_e164 ? esc(r.phone_e164) : `<span style="color:var(--bad-fg)">add number</span>`)}</td><td>${esc(r.tehsil)}</td><td>${esc(scopeLabel(r))}</td><td>${esc(r.wing || (r.scope_type === "own" ? "User's scope" : "All"))}</td><td>${r.send_time ? esc(String(r.send_time).slice(0,5)) : "Default"}</td>
          <td><span class="pill ${r.consent_status === 'granted' ? 'pill-ok' : (r.consent_status === 'opted_out' ? 'pill-bad' : 'pill-warn')}">${esc(r.consent_status)}</span></td>
          <td><span class="pill ${r.active ? 'pill-ok' : 'pill-role'}">${r.active ? "Active" : "Inactive"}</span></td>
          <td style="white-space:nowrap;">
            <button class="btn-secondary" data-act="preview" data-id="${esc(r.id)}">Preview</button>
            <button class="btn-secondary" data-act="edit" data-id="${esc(r.id)}">Edit</button>
            ${r.consent_status !== "granted" ? `<button class="btn-secondary" data-act="consent" data-id="${esc(r.id)}">Record consent</button>` : ""}
            <button class="btn-secondary" data-act="toggle" data-id="${esc(r.id)}" data-active="${r.active}">${r.active ? "Deactivate" : "Activate"}</button>
            <button class="btn-danger" data-act="delete" data-id="${esc(r.id)}">Delete</button>
          </td></tr>`).join("") : `<tr><td colspan="9" style="color:var(--ink-soft)">No recipients added yet.</td></tr>`}
      </tbody></table></div>
      <pre id="waPreviewBox" style="display:none; white-space:pre-wrap; background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:12px; margin-top:12px; font-size:13px;"></pre>
    </div>

    <details class="wa-det"><summary>Queue &amp; Delivery Log (latest 100)</summary><div class="wa-body">
      <div style="margin-bottom:10px;"><select id="waStatusFilter"><option value="">All statuses</option>${["queued","processing","sent","delivered","failed","skipped","cancelled","dry_run"].map(x => `<option value="${x}">${x}</option>`).join("")}</select></div>
      <div class="table-wrap"><table><thead><tr><th>Created</th><th>Recipient</th><th>Tehsil</th><th>Period</th><th>Status</th><th>Attempts</th><th>Sent</th><th>Note</th></tr></thead><tbody id="waQueueBody"></tbody></table></div>
    </div></details>`;

  function drawQueue(){
    const f = document.getElementById("waStatusFilter").value;
    const rows = queue.filter(q => !f || q.status === f);
    document.getElementById("waQueueBody").innerHTML = rows.length ? rows.map(q => `<tr>
      <td>${fmtDateTime(q.created_at)}</td><td>${esc(q.wa_recipients?.recipient_name || "—")}</td><td>${esc(q.wa_recipients?.tehsil || "—")}</td>
      <td>${fmtDate(q.period_start)}${q.period_start !== q.period_end ? " – " + fmtDate(q.period_end) : ""}</td>
      <td><span class="pill ${stCls[q.status] || 'pill-role'}">${esc(q.status)}</span></td><td>${q.attempt_count}</td>
      <td>${q.sent_at ? fmtDateTime(q.sent_at) : "—"}</td><td>${esc(q.last_error || "")}</td></tr>`).join("")
      : `<tr><td colspan="8" style="color:var(--ink-soft)">Nothing to show.</td></tr>`;
  }
  drawQueue();
  document.getElementById("waStatusFilter").onchange = drawQueue;

  function normPhone(v){
    let p = String(v || "").replace(/[\s\-()]/g, "");
    if(/^03\d{9}$/.test(p)) p = "+92" + p.slice(1);
    else if(/^923\d{9}$/.test(p)) p = "+" + p;
    return /^\+[1-9]\d{7,14}$/.test(p) ? p : null;
  }

  document.getElementById("waSaveBtn").onclick = async () => {
    const cap = parseInt(document.getElementById("waCap").value, 10);
    const look = parseInt(document.getElementById("waLookback").value, 10);
    if(!(cap >= 0 && cap <= 50)){ toast("Daily limit must be between 0 and 50", "bad"); return; }
    if(!(look >= 1 && look <= 30)){ toast("Lookback must be 1-30 days", "bad"); return; }
    const goingLive = document.getElementById("waDry").value === "false" && document.getElementById("waEnabled").value === "true";
    if(goingLive && !confirm("Live mode will send real WhatsApp messages to active, consented recipients. Continue?")) return;
    const { error } = await sb.from("wa_settings").update({
      enabled: document.getElementById("waEnabled").value === "true",
      dry_run: document.getElementById("waDry").value === "true",
      daily_cap: cap, lookback_days: look,
      send_time: document.getElementById("waSendTime").value,
      window_start: document.getElementById("waWinStart").value,
      window_end: document.getElementById("waWinEnd").value,
      updated_by: currentUser.id, updated_at: new Date().toISOString()
    }).eq("id", true);
    if(error){ toast(error.message, "bad"); return; }
    toast("Settings saved"); renderWaSendView();
  };

  document.getElementById("waStopBtn").onclick = async () => {
    const { error } = await sb.from("wa_settings").update({ emergency_stop: !s.emergency_stop, updated_by: currentUser.id, updated_at: new Date().toISOString() }).eq("id", true);
    if(error){ toast(error.message, "bad"); return; }
    toast(s.emergency_stop ? "Emergency stop cleared" : "Emergency stop ON - nothing will be sent"); renderWaSendView();
  };

  const $ = id => document.getElementById(id);
  let editingId = null;
  function drawTehsils(keepTehsil){
    const d = $("waDistrict").value;
    const list = [...new Set(markazList.filter(m => !d || m.district === d).map(m => m.tehsil).filter(Boolean))].sort();
    $("waTehsil").innerHTML = `<option value="">Select…</option>` + list.map(t => `<option value="${esc(t)}"${(keepTehsil ? keepTehsil === t : list.length === 1) ? " selected" : ""}>${esc(t)}</option>`).join("");
    drawMarkaz();
  }
  function drawMarkaz(ticked){
    const t = $("waTehsil").value, d = $("waDistrict").value, w = $("waWing").value;
    const keep = new Set(ticked || [...$("waMarkazList").querySelectorAll(".waMk:checked")].map(c => c.value));
    const list = markazList.filter(m => t && m.tehsil === t && (!d || m.district === d) && (!w || (markazWings[m.id] && markazWings[m.id].has(w))));
    $("waMarkazList").innerHTML = list.length
      ? `<label style="grid-column:1/-1; margin:0; font-weight:600;"><input type="checkbox" id="waMarkazAll"/> Select all (${list.length})</label>` +
        list.map(m => `<label style="margin:0;"><input type="checkbox" class="waMk" value="${esc(m.id)}"${keep.has(m.id) ? " checked" : ""}/> ${esc(m.name)}</label>`).join("")
      : `<span style="color:var(--ink-soft)">${t ? "No markaz with schools in this wing." : "Select a tehsil first."}</span>`;
    const all = $("waMarkazAll");
    if(all) all.onchange = () => $("waMarkazList").querySelectorAll(".waMk").forEach(c => c.checked = all.checked);
  }
  function drawScope(){ $("waMarkazBox").style.display = $("waScope").value === "markaz" ? "" : "none"; }
  function drawTarget(){
    const grp = $("waTarget").value === "group";
    $("waPhoneBox").style.display = grp ? "none" : "";
    $("waGroupBox").style.display = grp ? "" : "none";
    if(grp) $("waScope").value = "tehsil";          // groups only ever get the whole-tehsil summary
    $("waScope").disabled = grp;
    drawScope();
  }
  $("waTarget").onchange = () => {
    drawTarget();
    if($("waTarget").value === "group" && !$("waName").value.trim()){ const g = waGroups.find(x => x.jid === $("waGroup").value); if(g) $("waName").value = g.subject || ""; }
  };
  $("waGroup").onchange = () => { const g = waGroups.find(x => x.jid === $("waGroup").value); if(g && !$("waName").value.trim()) $("waName").value = g.subject || ""; };
  $("waScope").onchange = drawScope;
  $("waDistrict").onchange = () => drawTehsils();
  $("waTehsil").onchange = () => drawMarkaz();
  $("waWing").onchange = () => drawMarkaz();
  drawScope(); drawTehsils();

  function resetForm(){
    editingId = null;
    ["waName","waPhone","waConsentSrc","waRecTime"].forEach(i => $(i).value = "");
    $("waConsent").value = "pending"; $("waScope").value = "markaz"; $("waWing").value = "";
    $("waTarget").value = "person"; $("waGroup").value = ""; drawTarget();
    $("waFormTitle").textContent = "Add Recipient"; $("waAddBtn").textContent = "Add Recipient"; $("waCancelEdit").style.display = "none";
    drawScope(); drawTehsils();
  }
  $("waCancelEdit").onclick = resetForm;

  function startEdit(rec){
    editingId = rec.id;
    $("waName").value = rec.recipient_name || ""; $("waPhone").value = rec.phone_e164 || "";
    $("waRecTime").value = rec.send_time ? String(rec.send_time).slice(0,5) : "";
    $("waConsentSrc").value = rec.consent_source || ""; $("waConsent").value = rec.consent_status === "granted" ? "granted" : "pending";
    $("waScope").value = rec.scope_type === "tehsil" ? "tehsil" : "markaz";
    $("waWing").value = rec.wing || "";
    $("waTarget").value = rec.group_jid ? "group" : "person"; $("waGroup").value = rec.group_jid || ""; drawTarget();
    let ids = rec.markaz_ids || [];
    if(rec.scope_type === "own"){           // older "own jurisdiction" row: show the user's home + extra markaz as a normal markaz list
      const u = waUsers.find(x => x.id === rec.user_id);
      ids = u ? [u.markaz_id, ...(u.extra_markaz_ids || [])].filter(Boolean) : [];
    }
    $("waDistrict").value = rec.district || (districts.length === 1 ? districts[0] : "");
    drawTehsils(rec.tehsil);
    drawMarkaz(ids);
    drawTarget();
    $("waFormTitle").textContent = "Edit Recipient - " + rec.recipient_name;
    $("waAddBtn").textContent = "Save changes"; $("waCancelEdit").style.display = "";
    $("waFormDet").open = true;
    $("waFormTitle").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("waAddBtn").onclick = async () => {
    const name = $("waName").value.trim();
    const isGroup = $("waTarget").value === "group";
    const groupJid = isGroup ? $("waGroup").value : "";
    const rawPhone = isGroup ? "" : $("waPhone").value.trim();
    const phone = rawPhone ? normPhone(rawPhone) : null;
    const scope = isGroup ? "tehsil" : $("waScope").value;
    if(!name){ toast("Enter a name", "bad"); return; }
    if(isGroup && !groupJid){ toast("Select the WhatsApp group", "bad"); return; }
    if(rawPhone && !phone){ toast("Enter a valid number, e.g. 03001234567", "bad"); return; }
    const row = { recipient_name: name, phone_e164: phone, group_jid: groupJid || null, send_time: $("waRecTime").value || null, scope_type: scope, wing: $("waWing").value || null,
      markaz_ids: [], user_id: null, district: $("waDistrict").value || null, tehsil: $("waTehsil").value };
    if(!row.district){ toast("Select a district", "bad"); return; }
    if(!row.tehsil){ toast("Select a tehsil", "bad"); return; }
    if(scope === "markaz"){
      row.markaz_ids = [...$("waMarkazList").querySelectorAll(".waMk:checked")].map(c => c.value);
      if(!row.markaz_ids.length){ toast("Tick at least one markaz", "bad"); return; }
    }
    const consent = { consent_status: $("waConsent").value, consent_source: $("waConsentSrc").value.trim() || null };
    let error;
    if(editingId){
      const cur = recs.find(r => r.id === editingId);
      if(cur && cur.active && !phone && !groupJid){ toast("An active recipient needs a number - deactivate first or add the number", "bad"); return; }
      ({ error } = await sb.from("wa_recipients").update({ ...row, ...consent, updated_at: new Date().toISOString() }).eq("id", editingId));
    } else {
      ({ error } = await sb.from("wa_recipients").insert({ ...row, ...consent, active: false, created_by: currentUser.id }));
    }
    if(error){ toast(error.code === "23505" ? "That number is already added" : error.message, "bad"); return; }
    toast(editingId ? "Recipient updated" : "Recipient added (inactive until you activate it)"); renderWaSendView();
  };

  content.querySelectorAll("button[data-act]").forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.id, act = b.dataset.act;
      const rec = recs.find(r => r.id === id);
      if(act === "preview"){
        const { data, error } = await sb.rpc("fn_wa_preview", { p_recipient_id: id });
        const box = document.getElementById("waPreviewBox");
        box.style.display = "block";
        box.textContent = error ? "Preview failed: " + error.message : (data[0].missing_schools === 0 ? "No missing entries for the current period - no message would be sent." : data[0].message_text);
        return;
      }
      if(act === "edit"){ startEdit(rec); return; }
      if(act === "delete"){
        if(!confirm(`Delete ${rec.recipient_name}? Their queue history is removed too.`)) return;
        const { error } = await sb.from("wa_recipients").delete().eq("id", id);
        if(error){ toast(error.message, "bad"); return; }
      } else if(act === "toggle"){
        const turnOn = b.dataset.active !== "true";
        if(turnOn && !rec.phone_e164 && !rec.group_jid){ toast("Add the WhatsApp number (Edit) before activating", "bad"); return; }
        if(turnOn && rec.consent_status !== "granted"){ toast("Record consent before activating", "bad"); return; }
        const { error } = await sb.from("wa_recipients").update({ active: turnOn }).eq("id", id);
        if(error){ toast(error.message, "bad"); return; }
      } else if(act === "consent"){
        const { error } = await sb.from("wa_recipients").update({ consent_status: "granted" }).eq("id", id);
        if(error){ toast(error.message, "bad"); return; }
      }
      renderWaSendView();
    };
  });
}

/* ===================== WHATSAPP DATA COLLECTION (separate card; branch feature) ===================== */
let wcEdit = null, wcDraft = null, wcMemEdit = null, wcCMk = "";
const WC_CAT = { date_missing:"Date missing", product_missing:"Product missing", format_unreadable:"EMIS / packs not readable", emis_not_found:"Wrong EMIS code",
  wrong_markaz:"School not in sender's markaz", not_registered_for_school:"Number not registered for that school", outside_group_jurisdiction:"School outside the group's area",
  future_date:"Date in the future", not_consumption_day:"Not a consumption day", program_closed:"Program closed / before start", period_locked:"Period locked",
  already_recorded:"Already entered in the system", unregistered_sender:"Unregistered number posting a report", message_edited:"Message edited", message_deleted:"Message deleted" };
async function wcLoadStudy(box){
  const body = box.querySelector("#wcStudyBody"), sel = box.querySelector("#wcStudyDays");
  if(!body) return;
  body.innerHTML = `<p class="sub">Loading…</p>`;
  const { data, error } = await sb.rpc("fn_wa_collect_issue_summary", { p_days: sel.value ? Number(sel.value) : null });
  if(error){ body.innerHTML = `<div class="err">${esc(error.message)}<br>(The mistake-study database update has not been applied yet.)</div>`; return; }
  const d = data || {}, tot = (d.accepted || 0) + (d.rejected || 0), rate = tot ? Math.round(100 * (d.rejected || 0) / tot) : 0;
  const dl = Number(d.days_logged || 0);
  const lab = c => WC_CAT[c] || c || "-";
  const t = v => v ? new Date(v).toLocaleString("en-GB", { timeZone:"Asia/Karachi", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }) : "-";
  body.innerHTML = `
    <p class="sub"><b>Days logged: ${dl}</b> ${dl >= 8 ? "- enough data to start finding solutions." : `- keep collecting (${8 - dl} more day${8 - dl === 1 ? "" : "s"} for a fair picture).`}${d.first_logged ? " Log began " + esc(t(d.first_logged)) + "." : ""}</p>
    <div class="grid-4" style="margin:8px 0;">
      <div class="stat"><div class="n">${tot}</div><div class="l">Entries read</div></div>
      <div class="stat"><div class="n" style="color:var(--ok-fg)">${d.accepted || 0}</div><div class="l">Accepted</div></div>
      <div class="stat"><div class="n" style="color:var(--bad-fg)">${d.rejected || 0}</div><div class="l">Rejected (${rate}%)</div></div>
      <div class="stat"><div class="n">${(d.ignored || 0)} / ${(d.edited || 0)} / ${(d.deleted || 0)}</div><div class="l">Unregistered / edited / deleted</div></div>
    </div>
    <h4 style="margin:12px 0 4px;">Mistakes by type</h4>
    <div class="table-wrap"><table><thead><tr><th>Type</th><th>Times</th><th>People</th></tr></thead><tbody>
      ${(d.by_category || []).map(c => `<tr><td>${esc(lab(c.category))}</td><td>${c.n}</td><td>${c.senders}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--ink-soft)">No mistakes logged yet.</td></tr>`}</tbody></table></div>
    <h4 style="margin:12px 0 4px;">By person</h4>
    <div class="table-wrap"><table><thead><tr><th>Person</th><th>Accepted</th><th>Rejected</th><th>Main mistake</th></tr></thead><tbody>
      ${(d.by_sender || []).map(x => `<tr><td>${esc(x.name || "-")}<br><small>${esc(x.phone)} · ${esc(x.kind || "")}</small></td><td>${x.accepted}</td><td>${x.rejected}</td><td>${esc(x.main_mistake ? lab(x.main_mistake) : "-")}</td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--ink-soft)">Nothing yet.</td></tr>`}</tbody></table></div>
    <h4 style="margin:12px 0 4px;">By day</h4>
    <div class="table-wrap"><table><thead><tr><th>Day</th><th>Accepted</th><th>Rejected</th></tr></thead><tbody>
      ${(d.by_day || []).map(x => `<tr><td>${esc(x.day)}</td><td>${x.accepted}</td><td>${x.rejected}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--ink-soft)">Nothing yet.</td></tr>`}</tbody></table></div>
    <h4 style="margin:12px 0 4px;">Latest rejected messages</h4>
    <div class="table-wrap"><table><thead><tr><th>When</th><th>From</th><th>Problem</th><th>Message</th></tr></thead><tbody>
      ${(d.recent || []).map(x => `<tr><td>${esc(t(x.at))}</td><td>${esc(x.sender)}${x.emis ? "<br><small>" + esc(x.emis) + "</small>" : ""}</td><td>${esc(lab(x.category))}</td><td><small>${esc((x.text || "").slice(0, 200))}</small></td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--ink-soft)">Nothing yet.</td></tr>`}</tbody></table></div>`;
}
async function wcStudyCsv(){
  const { data, error } = await sb.from("wa_collect_issues").select("created_at,sender_name,sender_last10,sender_kind,emis_code,outcome,category,detail,raw_text,group_jid").order("created_at").limit(10000);
  if(error){ toast(error.message, "bad"); return; }
  const cols = ["created_at","sender_name","sender_last10","sender_kind","emis_code","outcome","category","detail","raw_text","group_jid"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""').replace(/\r?\n/g, " ") + '"';
  const csv = cols.join(",") + "\n" + (data || []).map(r => cols.map(c => q(r[c])).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" })); a.download = "whatsapp-collection-study.csv"; a.click();
}

    q("wcCAdd").onclick = async () => {
      const sid = q("wcCSchool").value, nm = q("wcCName").value.trim(), ph = normPh(q("wcCPh").value);
      if(!sid){ toast("Select the school", "bad"); return; }
      if(!nm){ toast("Enter the person's name", "bad"); return; }
      if(!ph){ toast("Enter a valid number, e.g. 03001234567", "bad"); return; }
      const r = await sb.from("wa_collect_school_contacts").insert({ school_id: sid, contact_name: nm, contact_role: q("wcCRole").value, phone_e164: ph });
      if(r.error){ toast(r.error.code === "23505" ? "This number is already added for that school" : r.error.message, "bad"); return; }
      toast("Number added"); loadContacts();
    };
    body.querySelectorAll("[data-cact]").forEach(b => b.onclick = async () => {
      if(b.dataset.cact === "del"){
        if(!confirm("Remove this number? Entries already received are kept.")) return;
        const r = await sb.from("wa_collect_school_contacts").delete().eq("id", b.dataset.id).select("id");
        if(r.error){ toast("Could not remove: " + r.error.message, "bad"); return; }
        const gone = r.data && r.data.length;
        toast(gone ? "Number removed" : "Nothing was removed", gone ? undefined : "bad");
      } else {
        const r = await sb.from("wa_collect_school_contacts").update({ active: b.dataset.active !== "true" }).eq("id", b.dataset.id);
        if(r.error){ toast(r.error.message, "bad"); return; }
      }
      loadContacts();
    });
  };
  loadContacts();

  const readForm = () => ({
    aeo_id: q("wcGrpAeo").value || null, aeo_ph: q("wcGrpAeoPh").value,
    sel_jid: q("wcGroupSel").value,
    district: q("wcDist").value || null, tehsil: q("wcTeh").value || null, scope_type: q("wcScope").value,
    markaz_ids: [...box.querySelectorAll(".wcMk:checked")].map(x => x.value),
    send_time: q("wcPostTime").value || null, missing_time: q("wcMissTime").value || null });
  const redraw = () => { wcDraft = readForm(); again(); };
  q("wcDist").onchange = () => { const d = readForm(); d.tehsil = null; d.markaz_ids = []; wcDraft = d; again(); };
  q("wcTeh").onchange = () => { const d = readForm(); d.markaz_ids = []; wcDraft = d; again(); };
  q("wcScope").onchange = redraw;
  // the group can always be re-selected: an already-added group opens for editing, a new one just changes the target
  q("wcGroupSel").onchange = () => {
    const jid = q("wcGroupSel").value;
    if(jid && groups.some(g => g.group_jid === jid)){ wcEdit = jid; wcDraft = null; again(); }
    else redraw();
  };
  q("wcGroupSave").onclick = async () => {
    const row = readForm(), jid = row.sel_jid;
    const aeoId = row.aeo_id, aeoPh = normPh(row.aeo_ph);
    delete row.sel_jid; delete row.aeo_id; delete row.aeo_ph;
    const needAeo = aeoId && !members.some(m => m.user_id === aeoId);
    if(needAeo && !aeoPh){ toast("Enter the AEO's valid WhatsApp number, e.g. 03001234567", "bad"); return; }
    if(!jid){ toast("Select a group", "bad"); return; }
    if(!row.tehsil){ toast("Select the tehsil", "bad"); return; }
    if(row.scope_type === "markaz" && !row.markaz_ids.length){ toast("Select at least one markaz", "bad"); return; }
    if(row.scope_type === "tehsil") row.markaz_ids = [];
    if(row.missing_time && row.send_time && row.missing_time <= row.send_time){ toast("The missing list must be later than the daily message", "bad"); return; }
    row.group_jid = jid; row.label = waGroups.find(g => g.jid === jid)?.subject || null;
    const moved = wcEdit && wcEdit !== jid;
    if(moved && !confirm("Move this setup to the newly selected group? The previous group will be removed from data collection.")) return;
    const up = await sb.from("wa_collect_groups").upsert(row, { onConflict:"group_jid" });
    if(up.error){ toast(up.error.message, "bad"); return; }
    if(moved){ const del = await sb.from("wa_collect_groups").delete().eq("group_jid", wcEdit); if(del.error){ toast(del.error.message, "bad"); return; } }
    if(needAeo){
      const mr = await sb.from("wa_collect_members").insert({ user_id: aeoId, phone_e164: aeoPh });
      if(mr.error){ toast("Group saved, but the AEO could not be added: " + mr.error.message, "bad"); }
    }
    toast(moved ? "Moved to the selected group" : (wcEdit ? "Group updated" : "Group added"));
    wcEdit = null; wcDraft = null; again();
  };
  if(q("wcGroupCancel")) q("wcGroupCancel").onclick = () => { wcEdit = null; wcDraft = null; again(); };
  box.querySelectorAll("[data-gact]").forEach(b => b.onclick = () => {
    if(b.dataset.gact === "edit"){ wcEdit = b.dataset.id; wcDraft = null; again(); }
    else if(b.dataset.gact === "del"){ run(sb.from("wa_collect_groups").delete().eq("group_jid", b.dataset.id)); }
    else run(sb.from("wa_collect_groups").update({ active:b.dataset.active !== "true" }).eq("group_jid", b.dataset.id));
  });
  // cascading AEO picker: District -> Wing -> Tehsil -> Markaz -> AEO -> Cell
  const taken = new Set(members.map(m => m.user_id));
  const wingsOf = m => waMarkazWings[m.id] ? [...waMarkazWings[m.id]].filter(Boolean) : [];
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
  const cs = { d:"", w:"", t:"", m:"", u:"" };
  const fill = (id, list, val, ph, enabled) => {
    const el = q(id);
    el.innerHTML = `<option value="">${esc(ph)}</option>` + list.map(([v, l]) => `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(l)}</option>`).join("");
    el.disabled = !enabled;
  };
  const aeosFor = mid => waUsers.filter(u => (u.role === "aeo" || u.role === "admin") && !taken.has(u.id) && (u.markaz_id === mid || (u.extra_markaz_ids || []).includes(mid)));
  function drawCasc(){
    const inD = markazList.filter(m => m.district === cs.d);
    const inW = inD.filter(m => wingsOf(m).includes(cs.w));
    const inT = inW.filter(m => m.tehsil === cs.t);
    const aeos = cs.m ? aeosFor(cs.m) : [];
    fill("wcaD", uniq(markazList.map(m => m.district)).map(x => [x, x]), cs.d, "Select district…", true);
    fill("wcaW", uniq(inD.flatMap(wingsOf)).map(x => [x, x]), cs.w, "Select wing…", !!cs.d);
    fill("wcaT", uniq(inW.map(m => m.tehsil)).map(x => [x, x]), cs.t, "Select tehsil…", !!cs.w);
    fill("wcaM", inT.sort((a, b) => a.name.localeCompare(b.name)).map(m => [m.id, m.name]), cs.m, "Select markaz…", !!cs.t);
    fill("wcaU", aeos.map(u => [u.id, u.full_name]), cs.u, "Select AEO…", !!cs.m && aeos.length > 0);
    const u = cs.u && waUsers.find(x => x.id === cs.u);
    const ph = q("wcaPh");
    ph.value = u ? (u.cell_no || "") : "";
    ph.readOnly = false;   // always editable: the WhatsApp number may differ from the profile cell number
    ph.placeholder = "03001234567";
    q("wcaMsg").textContent = !cs.m ? "" : (!aeos.length ? "No AEO available for this markaz (none registered, or all already added)." : (u && !u.cell_no ? "This AEO has no cell number on their profile - enter it." : ""));
    q("wcMemAdd").disabled = !u;
  }
  q("wcaD").onchange = e => { cs.d = e.target.value; cs.w = cs.t = cs.m = cs.u = ""; drawCasc(); };
  q("wcaW").onchange = e => { cs.w = e.target.value; cs.t = cs.m = cs.u = ""; drawCasc(); };
  q("wcaT").onchange = e => { cs.t = e.target.value; cs.m = cs.u = ""; drawCasc(); };
  q("wcaM").onchange = e => { cs.m = e.target.value; cs.u = ""; drawCasc(); };
  q("wcaU").onchange = e => { cs.u = e.target.value; drawCasc(); };
  drawCasc();
  q("wcMemAdd").onclick = () => {
    const mk = markazById[cs.m], u = waUsers.find(x => x.id === cs.u);
    // re-validate the whole chain before saving
    if(!mk || mk.district !== cs.d || mk.tehsil !== cs.t || !wingsOf(mk).includes(cs.w) || !u || !aeosFor(cs.m).some(x => x.id === u.id)){ toast("Invalid jurisdiction selection", "bad"); return; }
    let ph = (q("wcaPh").value || "").replace(/[\s-]/g, "");
    if(/^0\d{10}$/.test(ph)) ph = "+92" + ph.slice(1); else if(/^92\d{10}$/.test(ph)) ph = "+" + ph;
    if(!/^\+92\d{10}$/.test(ph)){ toast("A valid cell number (e.g. 03001234567) is required", "bad"); return; }
    run(sb.from("wa_collect_members").insert({ user_id:u.id, phone_e164:ph }), "AEO added"); };
  box.querySelectorAll("[data-mact]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.mact, m = members.find(x => x.id === id);
    if(a === "edit"){ wcMemEdit = id; again(); }
    else if(a === "cancel"){ wcMemEdit = null; again(); }
    else if(a === "save"){
      let ph = (q("wcMemPh").value || "").replace(/[\s-]/g, "");
      if(/^0\d{10}$/.test(ph)) ph = "+92" + ph.slice(1); else if(/^92\d{10}$/.test(ph)) ph = "+" + ph;
      if(!/^\+92\d{10}$/.test(ph)){ toast("A valid cell number (e.g. 03001234567) is required", "bad"); return; }
      if(members.some(x => x.id !== id && x.phone_e164 === ph)){ toast("This number is already used by another authorised AEO", "bad"); return; }
      if(await run(sb.from("wa_collect_members").update({ phone_e164: ph }).eq("id", id), "Number updated")) wcMemEdit = null;
      again();
    }
    else if(a === "del"){
      if(!confirm(`Remove ${userById[m?.user_id]?.full_name || "this AEO"} from the authorised list? They will no longer be able to post data. Entries already received are kept.`)) return;
      const r = await sb.from("wa_collect_members").delete().eq("id", id).select("id");
      if(r.error){ toast("Could not remove: " + r.error.message, "bad"); return; }
      if(!r.data || !r.data.length){ toast("Nothing was removed - the AEO is still listed", "bad"); again(); return; }
      toast("AEO removed"); again();
    }
    else run(sb.from("wa_collect_members").update({ active: b.dataset.active !== "true" }).eq("id", id));
  });
  const packsOf = id => box.querySelector(`[data-packs="${id}"]`)?.value;
  box.querySelectorAll("[data-eact]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.eact;
    if(a === "reject"){ run(sb.rpc("fn_wa_collect_reject", { p_entry:id }), "Removed"); return; }
    const sv = await sb.rpc("fn_wa_collect_update_entry", { p_entry:id, p_packs:Number(packsOf(id)) });
    if(sv.error){ toast(sv.error.message, "bad"); return; }
    if(a === "save"){ toast("Saved"); again(); return; }
    const r = await sb.rpc("fn_wa_collect_approve", { p_entry:id });
    if(r.error){ toast(r.error.message, "bad"); return; }
    toast(r.data === "OK" ? "Approved - recorded as consumption" : r.data, r.data === "OK" ? undefined : "bad"); again();
  });
  q("wcStudyRefresh").onclick = () => wcLoadStudy(box);
  q("wcStudyDays").onchange = () => wcLoadStudy(box);
  q("wcStudyCsv").onclick = wcStudyCsv;
  q("wcStudyDet").addEventListener("toggle", () => { if(q("wcStudyDet").open) wcLoadStudy(box); });
  q("wcApproveAll").onclick = async () => {
    if(!confirm(`Approve ${pending.length} pending entr${pending.length === 1 ? "y" : "ies"} and record them as consumption?`)) return;
    let ok = 0, bad = 0;
    for(const e of pending){ const r = await sb.rpc("fn_wa_collect_approve", { p_entry:e.id }); (r.data === "OK" ? ok++ : bad++); }
    toast(`Approved ${ok}${bad ? `, ${bad} could not be approved (see reason)` : ""}`, bad ? "bad" : undefined); again();
  };
}

/* ===================== CONSUMPTION SCHEDULE ===================== */
function renderScheduleSection(){
  const content = document.getElementById("adminSectionContent");
  content.innerHTML = `
    <div class="card">
      <h3>Weekly schedule (default)</h3>
      <p class="sub">The normal weekday pattern each product is distributed on - e.g. Milk on Mon/Tue/Wed, Biscuits on Thursday. This drives every "missing consumption" check across the app, so a day left unchecked here is never counted as missing.</p>
      <div id="scheduleForms"></div>
    </div>
    <div class="card">
      <h3>One-off exceptions</h3>
      <p class="sub">Override a single date without touching the weekly pattern above - e.g. force a Milk day closed for a public holiday, or open an extra Biscuit day to make up for one that was missed.</p>
      <form id="exceptionForm" class="form-row">
        <div><label>Product</label><select name="product_id" required>${cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("")}</select></div>
        <div><label>Date</label><input type="date" name="exception_date" required value="${todayStr()}"/></div>
        <div><label>Status</label><select name="status" required>
          <option value="blocked">Blocked (not distributed this day)</option>
          <option value="allowed">Allowed (distributed this day)</option>
        </select></div>
        <div style="grid-column:1/-1;"><label>Reason</label><input type="text" name="reason" placeholder="e.g. Eid holiday"/></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Add exception</button></div>
      </form>
      <div class="table-wrap" style="margin-top:16px;"><table id="exceptionTable"><thead><tr>
        <th>Date</th><th>Product</th><th>Status</th><th>Reason</th><th></th>
      </tr></thead><tbody><tr><td colspan="5" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  const formsBox = document.getElementById("scheduleForms");
  cache.products.forEach(p => {
    const dow = p.schedule_dow || [];
    const row = document.createElement("form");
    row.className = "form-row";
    row.style.alignItems = "center";
    row.dataset.productId = p.id;
    row.innerHTML = `
      <div style="min-width:140px;"><b>${esc(p.product_name)}</b></div>
      <div class="dow-grid">
        ${DOW_LABELS.map((label, i) => `
          <label class="dow-chip">
            <input type="checkbox" value="${i}" ${dow.includes(i) ? "checked" : ""}/> ${label}
          </label>
        `).join("")}
      </div>
      <div><button class="btn-primary" type="submit">Save</button></div>
    `;
    row.addEventListener("submit", async (e) => {
      e.preventDefault();
      const checked = Array.from(row.querySelectorAll('input[type="checkbox"]:checked')).map(c => Number(c.value));
      try{
        const { error } = await sb.from("products").update({ schedule_dow: checked }).eq("id", p.id);
        if(error) throw error;
        p.schedule_dow = checked;
        toast(`${p.product_name} schedule updated`);
      }catch(err){ toast(err.message, "bad"); }
    });
    formsBox.appendChild(row);
  });

  document.getElementById("exceptionForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try{
      const { error } = await sb.from("schedule_exceptions").insert({
        product_id: fd.get("product_id"),
        exception_date: fd.get("exception_date"),
        status: fd.get("status"),
        reason: fd.get("reason") || null,
        created_by: currentUser.id,
      });
      if(error) throw error;
      toast("Exception added");
      e.target.reset();
      e.target.querySelector('[name="exception_date"]').value = todayStr();
      await loadExceptions();
    }catch(err){ toast(err.message, "bad"); }
  });

  loadExceptions();
}

async function loadExceptions(){
  const tbody = document.querySelector("#exceptionTable tbody");
  const { data, error } = await sb.from("schedule_exceptions")
    .select("id, exception_date, status, reason, products(product_name)")
    .order("exception_date", { ascending: false })
    .limit(100);
  if(error){ tbody.innerHTML = `<tr><td colspan="5" class="err">${esc(error.message)}</td></tr>`; return; }
  if(!data?.length){ tbody.innerHTML = `<tr><td colspan="5" style="color:var(--ink-soft)">No exceptions set.</td></tr>`; return; }
  tbody.innerHTML = data.map(r => `
    <tr>
      <td>${fmtDate(r.exception_date)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td><span class="pill ${r.status === "blocked" ? "pill-bad" : "pill-ok"}">${esc(r.status)}</span></td>
      <td>${esc(r.reason || "—")}</td>
      <td><button class="link-btn" onclick="deleteException('${r.id}')">Remove</button></td>
    </tr>
  `).join("");
}

async function deleteException(id){
  if(!confirm("Remove this exception? The date will revert to the normal weekly schedule.")) return;
  try{
    const { error } = await sb.from("schedule_exceptions").delete().eq("id", id);
    if(error) throw error;
    toast("Exception removed");
    await loadExceptions();
  }catch(err){ toast(err.message, "bad"); }
}
</script>
