<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory Received — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Inventory Received</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div class="menu-cards" id="navList"></div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null, currentSection = "my_receipts";
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
// Standard school ordering used everywhere in this app: markaz name A-Z,
// then EMIS code A-Z within each markaz. Sorted client-side (not via an
// .order() on the query) because the sort key lives on the markaz table,
// not on schools - and every page already has cache.markaz loaded.
// ---- Jurisdiction scoping (single source of truth, mirrors the DB) ----
// A person's access is: their home markaz PLUS any additional markaz they
// hold charge of (A-I-DB scope_value when scope_type=Markaz), or - for a
// TR - their whole tehsil, optionally narrowed to one wing (A-I-DB
// scope_value '<TEHSIL>:<WING>'). Both used to be dropped, which is why
// additional-charge markaz were invisible and wing-restricted people saw
// the whole tehsil. RLS enforces the same rule server-side; this exists so
// the UI shows exactly what the person can actually act on.
function myMarkazIds(){
  return [currentProfile.markaz_id, ...(currentProfile.extra_markaz_ids || [])].filter(Boolean);
}
function scopeSchoolsQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("markaz_id", ids) : q.eq("markaz_id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "school_user"){
    q = q.eq("id", currentProfile.school_id);
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("markaz.tehsil", currentProfile.tehsil);
    if(currentProfile.wing_scope) q = q.eq("wing", currentProfile.wing_scope);
  }
  return q;
}
function scopeMarkazQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("id", ids) : q.eq("id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("tehsil", currentProfile.tehsil);
  }
  return q;
}

function sortSchoolsStandard(schools){
  const markazName = {};
  (cache.markaz || []).forEach(m => { markazName[m.id] = m.name || ""; });
  return (schools || []).slice().sort((a, b) =>
    (markazName[a.markaz_id] || "").localeCompare(markazName[b.markaz_id] || "")
    || (a.emis_code || "").localeCompare(b.emis_code || "")
  );
}

function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  if(!["admin","super_admin","tr","aeo"].includes(profile.role)){
    alert("This module is for AEOs and administrators.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  buildNav();
  navigate("my_receipts");
}

async function loadRefData(){
  const markazQuery = scopeMarkazQuery(sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"));
  const [{ data: markaz }, { data: products }] = await Promise.all([
    markazQuery,
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  // Milk first, then Biscuit - matches the requested column order in the
  // receipts grid (and the convention every other page already uses).
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });

  // "His schools" - the AEO's own markaz plus any additional charge; a TR's
  // whole tehsil (narrowed to their wing where A-I-DB sets one). Admins see all.
  const schoolsQuery = scopeSchoolsQuery(
    sb.from("schools").select("id,school_name,emis_code,markaz_id,wing,markaz!inner(tehsil)").eq("active", true)
  );
  const { data: schools } = await schoolsQuery;
  cache.schools = sortSchoolsStandard(schools);
}

/* ===================== NAV (card-based, not a sidebar) ===================== */
const SECTIONS = [
  { id:"my_receipts", label:"My Receipts", desc:"Add & review what you've entered" },
  { id:"company_data", label:"Company Data & Certification", desc:"Compare and flag vendor-reported deliveries" },
];
function buildNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const a = document.createElement("a");
    a.className = "menu-card" + (s.id === currentSection ? " active" : "");
    a.innerHTML = `<span class="label">${esc(s.label)}</span><span class="desc">${esc(s.desc)}</span>`;
    a.dataset.id = s.id;
    a.onclick = () => navigate(s.id);
    nav.appendChild(a);
  });
}
async function navigate(id){
  currentSection = id;
  document.querySelectorAll("#navList .menu-card").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  const content = document.getElementById("content");
  content.innerHTML = `<p style="color:var(--ink-soft)">Loading…</p>`;
  try{
    if(id === "my_receipts") await renderMyReceipts(content);
    if(id === "company_data") await renderCompanyData(content);
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  }
}

/* ===================== JURISDICTION FILTER (admin/tr only) ===================== */
// Cascading District -> Tehsil -> Markaz filter. AEOs are already scoped to
// their own markaz and never see this. Calls onApply(filteredSchoolIds)
// whenever a selection changes, including once on initial render.
function renderJurisdictionFilter(container, onApply){
  if(!["admin","super_admin","tr"].includes(currentProfile.role)){
    onApply(cache.schools.map(s => s.id));
    return;
  }
  const districts = [...new Set(cache.markaz.map(m => m.district))].filter(Boolean).sort();
  const wings = [...new Set(cache.schools.map(s => s.wing))].filter(Boolean).sort();
  container.innerHTML = `
    <div class="card">
      <h3>Filter by jurisdiction</h3>
      <p class="sub">District and Tehsil narrow the area; Wing must be picked before Markaz becomes selectable, since which Markaz have schools of that Wing depends on it.</p>
      <div class="form-row">
        <div><label>District</label><select id="jfDistrict"><option value="">All</option>${districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>
        <div><label>Tehsil</label><select id="jfTehsil"><option value="">All</option></select></div>
        <div><label>Wing</label><select id="jfWing"><option value="">All</option>${wings.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>
        <div><label>Markaz</label><select id="jfMarkaz" disabled><option value="">All (pick a Wing to narrow)</option></select></div>
        <div><label>EMIS Code</label><input type="text" id="jfEmis" placeholder="Search one school"/></div>
      </div>
    </div>
  `;
  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz"), wEl = document.getElementById("jfWing"), eEl = document.getElementById("jfEmis");

  function refreshTehsil(){
    const d = dEl.value;
    const tehsils = [...new Set(cache.markaz.filter(m => !d || m.district === d).map(m => m.tehsil))].filter(Boolean).sort();
    tEl.innerHTML = `<option value="">All</option>` + tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  function refreshMarkaz(){
    const d = dEl.value, t = tEl.value, w = wEl.value;
    const markazIdsWithWing = w
      ? new Set(cache.schools.filter(s => s.wing === w).map(s => s.markaz_id))
      : null;
    const list = cache.markaz.filter(m =>
      (!d || m.district === d) && (!t || m.tehsil === t) && (!markazIdsWithWing || markazIdsWithWing.has(m.id)));
    mEl.disabled = !w;
    mEl.innerHTML = w
      ? `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")
      : `<option value="">All (pick a Wing to narrow)</option>`;
  }
  function apply(){
    const d = dEl.value, t = tEl.value, mId = wEl.value ? mEl.value : "", wing = wEl.value;
    const emis = (eEl.value || "").trim();
    // An EMIS code identifies exactly one school, so when one is entered it
    // overrides the geography/wing pickers entirely rather than intersecting
    // with them - otherwise a valid code would return nothing whenever the
    // dropdowns happened to be pointed elsewhere.
    if(emis){
      onApply(cache.schools.filter(s => (s.emis_code || "").includes(emis)).map(s => s.id));
      return;
    }
    const markazIds = new Set(cache.markaz.filter(m => (!d || m.district === d) && (!t || m.tehsil === t) && (!mId || m.id === mId)).map(m => m.id));
    onApply(cache.schools.filter(s => markazIds.has(s.markaz_id) && (!wing || s.wing === wing)).map(s => s.id));
  }
  refreshTehsil(); refreshMarkaz();
  dEl.addEventListener("change", () => { refreshTehsil(); refreshMarkaz(); apply(); });
  tEl.addEventListener("change", () => { refreshMarkaz(); apply(); });
  wEl.addEventListener("change", () => { mEl.value = ""; refreshMarkaz(); apply(); });
  mEl.addEventListener("change", apply);
  eEl.addEventListener("input", apply);
  apply();
}

/* ===================== SECTION: MY RECEIPTS ===================== */
async function renderMyReceipts(content){
  content.innerHTML = `<div id="filterMount"></div><div id="receiptsMount"></div>`;
  renderJurisdictionFilter(document.getElementById("filterMount"), (schoolIds) => renderMyReceiptsBody(schoolIds));
}

async function renderMyReceiptsBody(visibleSchoolIds){
  const mount = document.getElementById("receiptsMount");
  const visibleSchools = sortSchoolsStandard(cache.schools.filter(s => visibleSchoolIds.includes(s.id)));
  const [milk, biscuit] = cache.products; // sorted milk-first in loadRefData

  // Grid entry (same pattern as the Consumption grid) instead of a
  // single-school picker - every school in scope gets its own row. Column
  // order within each product is Date -> Invoice # -> Qty (matches the
  // order they're actually decided in); Milk's block comes before
  // Biscuit's. Invoice # is required - it's the join key the system uses
  // to compare what a school actually received against what the company
  // says it delivered.
  const productCols = cache.products.map(p => `<th colspan="3">${esc(p.product_name)}</th>`).join("");
  const productSubCols = cache.products.map(() => `<th>Date</th><th>Invoice #</th><th>Qty</th>`).join("");

  mount.innerHTML = `
    <div class="card">
      <h3>Add inventory received</h3>
      <p class="sub">Enter Date, then Invoice #, then Quantity for any school/product - it saves as soon as Quantity is entered (same as Consumption). Milk's Date and Invoice # copy into Biscuit's automatically, but Biscuit's stay editable if its actual delivery differs.</p>
      <div class="table-wrap"><table id="receiptGrid"><thead>
        <tr><th rowspan="2">Sr#</th><th rowspan="2">Markaz</th><th rowspan="2">EMIS</th><th rowspan="2">School</th>${productCols}</tr>
        <tr>${productSubCols}</tr>
      </thead><tbody>
        ${visibleSchools.map((s, i) => {
          const mk = cache.markaz.find(m => m.id === s.markaz_id)?.name || "—";
          const cells = cache.products.map((p, pi) => `
            <td><input type="date" class="receiptDate" data-school="${s.id}" data-product="${p.id}" data-first="${pi === 0}" value="${todayStr()}" style="width:120px;padding:5px 6px;"/></td>
            <td><input type="text" class="receiptInvoice" data-school="${s.id}" data-product="${p.id}" data-first="${pi === 0}" placeholder="Required" style="width:100px;padding:5px 6px;"/></td>
            <td><input type="number" min="0" step="0.01" class="receiptQty" data-school="${s.id}" data-product="${p.id}" style="width:75px;padding:5px 6px;"/>
              <span class="save-indicator" id="rind-${s.id}-${p.id}"></span></td>
          `).join("");
          return `<tr><td>${i+1}</td><td>${esc(mk)}</td><td>${esc(s.emis_code)}</td><td>${esc(s.school_name)}</td>${cells}</tr>`;
        }).join("")}
      </tbody></table></div>
    </div>
    <div class="card">
      <h3>Receipts already entered</h3>
      <p class="sub">Sorted by date (most recent first), then by EMIS code.</p>
      <div class="table-wrap"><table id="receiptsTable"><thead><tr>
        <th>Date</th><th>Markaz</th><th>EMIS</th><th>School</th><th>Product</th><th>Qty</th><th>Invoice #</th><th>Collected by</th><th>Remarks</th><th></th>
      </tr></thead><tbody><tr><td colspan="10" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  // Milk's Date/Invoice copy into Biscuit's for the same school as soon as
  // Milk's is entered - most deliveries share both, and this only ever
  // copies from the first product's fields, so Biscuit stays independently
  // editable afterward without being fought over.
  if(cache.products.length > 1){
    mount.querySelectorAll('.receiptDate[data-first="true"]').forEach(el => {
      el.addEventListener("change", () => {
        const other = mount.querySelector(`.receiptDate[data-school="${el.dataset.school}"][data-first="false"]`);
        if(other) other.value = el.value;
      });
    });
    mount.querySelectorAll('.receiptInvoice[data-first="true"]').forEach(el => {
      el.addEventListener("input", () => {
        const other = mount.querySelector(`.receiptInvoice[data-school="${el.dataset.school}"][data-first="false"]`);
        if(other) other.value = el.value;
      });
    });
  }

  mount.querySelectorAll(".receiptQty").forEach(inp => {
    inp.addEventListener("input", () => {
      const ind = document.getElementById(`rind-${inp.dataset.school}-${inp.dataset.product}`);
      ind.className = ""; ind.textContent = "";
    });
    inp.addEventListener("change", () => trySaveReceipt(inp, visibleSchoolIds));
  });

  await loadReceiptsTable(visibleSchoolIds);
}

async function trySaveReceipt(inp, visibleSchoolIds){
  const schoolId = inp.dataset.school, productId = inp.dataset.product;
  const qty = inp.value;
  const ind = document.getElementById(`rind-${schoolId}-${productId}`);
  const mount = document.getElementById("receiptsMount");
  if(qty === ""){ ind.className = ""; ind.textContent = ""; return; }

  const dateInput = mount.querySelector(`.receiptDate[data-school="${schoolId}"][data-product="${productId}"]`);
  const invoiceInput = mount.querySelector(`.receiptInvoice[data-school="${schoolId}"][data-product="${productId}"]`);
  const school = cache.schools.find(s => s.id === schoolId);
  const product = cache.products.find(p => p.id === productId);

  // Invoice # is required - it's what the system matches against company
  // data to compare what was actually delivered.
  if(!invoiceInput.value.trim()){
    toast("Invoice # is required before a quantity can be saved", "bad");
    invoiceInput.focus();
    return;
  }

  // Zero is a real, save-able answer (a delivery genuinely didn't arrive),
  // but it's also the easiest number to enter by mistake - confirm intent
  // rather than silently accepting it.
  if(Number(qty) === 0){
    if(!confirm(`Save a quantity of 0 for ${product?.product_name} at ${school?.school_name} (${dateInput.value})? Confirm only if this school genuinely received none.`)){
      return;
    }
  }

  // A second entry for the same school/product/date - same invoice or a
  // different one - is unusual enough to confirm rather than silently
  // create, and common enough (a correction, or a genuine second delivery)
  // that the person should see what's already there before deciding.
  const { data: existing } = await sb.from("school_receipts")
    .select("id, quantity_received, invoice_number, collected_by, remarks")
    .eq("school_id", schoolId).eq("product_id", productId).eq("receipt_date", dateInput.value)
    .eq("status", "active").maybeSingle();

  if(existing){
    showDuplicateReceiptModal({
      existing, school, product, date: dateInput.value,
      onAddSecond: () => saveReceipt(inp, ind, schoolId, productId, dateInput.value, qty, invoiceInput.value, visibleSchoolIds),
      onEdit: () => showEditReceiptModal(existing, school, product, () => {
        inp.value = ""; ind.className = ""; ind.textContent = "";
        loadReceiptsTable(visibleSchoolIds);
      }),
    });
    return;
  }

  await saveReceipt(inp, ind, schoolId, productId, dateInput.value, qty, invoiceInput.value, visibleSchoolIds);
}

async function saveReceipt(inp, ind, schoolId, productId, date, qty, invoiceNumber, visibleSchoolIds){
  ind.className = "save-indicator saving";
  ind.textContent = "Saving…";
  inp.disabled = true;
  try{
    const { data, error } = await sb.rpc("fn_create_school_receipt", {
      p_school_id: schoolId,
      p_product_id: productId,
      p_receipt_date: date,
      p_quantity_received: qty,
      p_invoice_number: invoiceNumber.trim(),
      p_collected_by: null,
      p_remarks: null,
    });
    if(error) throw error;
    ind.className = "save-indicator ok";
    ind.textContent = data?.[0]?.auto_certified ? "✓ Saved & certified" : "✓ Saved";
    inp.disabled = false;
    inp.value = "";
    loadReceiptsTable(visibleSchoolIds);
  }catch(err){
    inp.disabled = false;
    const dupe = err.code === "23505" || /duplicate key/i.test(err.message || "");
    ind.className = "save-indicator bad";
    ind.textContent = dupe ? "✗ Same invoice already saved for this date" : "✗ Not saved";
    toast(err.message, "bad");
  }
}

function showDuplicateReceiptModal({ existing, school, product, date, onAddSecond, onEdit }){
  const existingEl = document.getElementById("dupReceiptModal");
  if(existingEl) existingEl.remove();
  const overlay = document.createElement("div");
  overlay.id = "dupReceiptModal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>⚠ Entry Already Exists</h3>
      <p><b>${esc(school?.school_name)}</b> already has a ${esc(product?.product_name)} receipt on <b>${fmtDate(date)}</b>:</p>
      <div class="modal-note">
        Qty: <b>${fmt(existing.quantity_received)}</b> &middot; Invoice #: <b>${esc(existing.invoice_number) || "—"}</b>${existing.collected_by ? ` &middot; Collected by: ${esc(existing.collected_by)}` : ""}${existing.remarks ? ` &middot; ${esc(existing.remarks)}` : ""}
      </div>
      <p>Was there genuinely a second, separate delivery on this same date - or are you correcting the entry above?</p>
      <div class="actions-row">
        <button class="btn-secondary" id="dupCancelBtn" type="button">Cancel</button>
        <button class="btn-secondary" id="dupEditBtn" type="button">Edit the existing entry</button>
        <button class="btn-primary" id="dupAddBtn" type="button">Yes, add as a second delivery</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById("dupCancelBtn").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
  document.getElementById("dupAddBtn").addEventListener("click", () => { close(); onAddSecond(); });
  document.getElementById("dupEditBtn").addEventListener("click", () => { close(); onEdit(); });
}

function showEditReceiptModal(existing, school, product, onSaved){
  const existingEl = document.getElementById("editReceiptModal");
  if(existingEl) existingEl.remove();
  const overlay = document.createElement("div");
  overlay.id = "editReceiptModal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Edit Receipt</h3>
      <p>${esc(school?.school_name)} — ${esc(product?.product_name)}</p>
      <form id="editReceiptForm" class="form-row" style="grid-template-columns:1fr;">
        <div><label>Date</label><input type="date" name="receipt_date" value="${existing.receipt_date || todayStr()}" required/></div>
        <div><label>Invoice #</label><input type="text" name="invoice_number" value="${esc(existing.invoice_number || "")}" required/></div>
        <div><label>Quantity</label><input type="number" min="0" step="0.01" name="quantity_received" value="${existing.quantity_received}" required/></div>
        <div class="actions-row">
          <button class="btn-secondary" id="editCancelBtn" type="button">Cancel</button>
          <button class="btn-primary" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById("editCancelBtn").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
  document.getElementById("editReceiptForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try{
      const { error } = await sb.rpc("fn_update_school_receipt", {
        p_receipt_id: existing.id,
        p_quantity_received: fd.get("quantity_received"),
        p_invoice_number: fd.get("invoice_number"),
        p_receipt_date: fd.get("receipt_date"),
      });
      if(error) throw error;
      toast("Receipt updated");
      close();
      onSaved();
    }catch(err){ toast(err.message, "bad"); }
  });
}

async function loadReceiptsTable(schoolIds){
  const { data, error } = await sb
    .from("school_receipts")
    .select("id, receipt_date, quantity_received, invoice_number, collected_by, remarks, status, school_id, product_id, schools(emis_code, school_name, markaz_id), products(product_name, unit_name)")
    .in("school_id", schoolIds)
    .eq("status", "active")
    .order("receipt_date", { ascending: false });

  const tbody = document.querySelector("#receiptsTable tbody");
  if(error){ tbody.innerHTML = `<tr><td colspan="10" class="err">${esc(error.message)}</td></tr>`; return; }

  // Requested sort: date descending, then EMIS code ascending within each date.
  const rows = (data || []).sort((a, b) => {
    if(a.receipt_date !== b.receipt_date) return a.receipt_date < b.receipt_date ? 1 : -1;
    return (a.schools?.emis_code || "").localeCompare(b.schools?.emis_code || "");
  });

  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="10" style="color:var(--ink-soft)">No receipts entered yet.</td></tr>`; return; }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${fmtDate(r.receipt_date)}</td>
      <td>${esc(cache.markaz.find(m => m.id === r.schools?.markaz_id)?.name || "—")}</td>
      <td>${esc(r.schools?.emis_code)}</td>
      <td>${esc(r.schools?.school_name)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td>${fmt(r.quantity_received)} ${esc(r.products?.unit_name || "")}</td>
      <td>${esc(r.invoice_number) || "—"}</td>
      <td>${esc(r.collected_by) || "—"}</td>
      <td>${esc(r.remarks) || "—"}</td>
      <td><button class="link-btn" onclick='editExistingReceipt(${JSON.stringify(r.id)}, ${JSON.stringify(schoolIds)})'>Edit</button></td>
    </tr>
  `).join("");
}

// Bridges a row in the already-entered table to the same edit modal used
// from the grid's duplicate-date check, so corrections work from either place.
async function editExistingReceipt(receiptId, schoolIds){
  const { data: existing, error } = await sb.from("school_receipts")
    .select("id, receipt_date, quantity_received, invoice_number, collected_by, remarks, school_id, product_id")
    .eq("id", receiptId).single();
  if(error){ toast(error.message, "bad"); return; }
  const school = cache.schools.find(s => s.id === existing.school_id);
  const product = cache.products.find(p => p.id === existing.product_id);
  showEditReceiptModal(existing, school, product, () => loadReceiptsTable(schoolIds));
}

/* ===================== SECTION: COMPANY DATA & CERTIFICATION ===================== */
async function renderCompanyData(content){
  content.innerHTML = `<div id="filterMount"></div><div id="companyMount"></div>`;
  renderJurisdictionFilter(document.getElementById("filterMount"), (schoolIds) => renderCompanyDataBody(schoolIds));
}

async function renderCompanyDataBody(visibleSchoolIds){
  const mount = document.getElementById("companyMount");
  mount.innerHTML = `
    <div class="card">
      <h3>Company-provided delivery data</h3>
      <p class="sub">Uploaded by admins from vendor invoices. Mark each row Received or Not Received against what actually arrived at the school - flagging "Not Received" surfaces it for rectification.</p>
      <div class="table-wrap"><table id="companyTable"><thead><tr>
        <th>Invoice date</th><th>Markaz</th><th>EMIS</th><th>School</th><th>Product</th><th>Qty</th><th>Invoice #</th><th>Status</th><th>Certify</th>
      </tr></thead><tbody><tr><td colspan="9" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;
  await loadCompanyTable(visibleSchoolIds);
}

async function loadCompanyTable(schoolIds){
  const { data, error } = await sb
    .from("company_invoice_items")
    .select(`
      id, quantity, aeo_verification_status, aeo_verification_remarks,
      schools(emis_code, school_name, markaz_id), products(product_name, unit_name),
      company_invoices(invoice_number, invoice_date, delivery_date, status)
    `)
    .in("school_id", schoolIds)
    .order("created_at", { ascending: false });

  const tbody = document.querySelector("#companyTable tbody");
  if(error){ tbody.innerHTML = `<tr><td colspan="9" class="err">${esc(error.message)}</td></tr>`; return; }

  const rows = (data || []).filter(r => r.company_invoices?.status !== "void");
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="9" style="color:var(--ink-soft)">No company data uploaded yet.</td></tr>`; return; }

  const statusPill = (s) => s === "received" ? '<span class="pill pill-ok">Received</span>'
    : s === "not_received" ? '<span class="pill pill-bad">Not received</span>'
    : '<span class="pill pill-warn">Pending</span>';

  tbody.innerHTML = rows.map(r => `
    <tr data-id="${r.id}">
      <td>${fmtDate(r.company_invoices?.delivery_date || r.company_invoices?.invoice_date)}</td>
      <td>${esc(cache.markaz.find(m => m.id === r.schools?.markaz_id)?.name || "—")}</td>
      <td>${esc(r.schools?.emis_code)}</td>
      <td>${esc(r.schools?.school_name)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td>${fmt(r.quantity)} ${esc(r.products?.unit_name || "")}</td>
      <td>${esc(r.company_invoices?.invoice_number) || "—"}</td>
      <td class="status-cell">${statusPill(r.aeo_verification_status)}</td>
      <td>
        <button class="link-btn" data-action="received">Mark received</button>
        <button class="link-btn danger" data-action="not_received">Not received</button>
      </td>
    </tr>
  `).join("");

  tbody.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const tr = btn.closest("tr");
      const id = tr.dataset.id;
      const status = btn.dataset.action;
      let remarks = null;
      if(status === "not_received"){
        remarks = prompt("Optional: note what's wrong (for rectification)") || null;
      }
      try{
        const { error } = await sb.rpc("fn_verify_company_item", { p_item_id: id, p_status: status, p_remarks: remarks });
        if(error) throw error;
        toast(status === "received" ? "Marked received" : "Flagged as not received");
        await loadCompanyTable(schoolIds);
      }catch(err){ toast(err.message, "bad"); }
    });
  });
}
</script>
