<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null, currentSection = "my_receipts";
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
// Standard school ordering used everywhere in this app: markaz name A-Z,
// then EMIS code A-Z within each markaz. Sorted client-side (not via an
// .order() on the query) because the sort key lives on the markaz table,
// not on schools - and every page already has cache.markaz loaded.
// ---- Jurisdiction scoping (single source of truth, mirrors the DB) ----
// A person's access is: their home markaz PLUS any additional markaz they
// hold charge of (A-I-DB scope_value when scope_type=Markaz), or - for a
// TR - their whole tehsil, optionally narrowed to one wing (A-I-DB
// scope_value '<TEHSIL>:<WING>'). Both used to be dropped, which is why
// additional-charge markaz were invisible and wing-restricted people saw
// the whole tehsil. RLS enforces the same rule server-side; this exists so
// the UI shows exactly what the person can actually act on.
function myMarkazIds(){
  return [currentProfile.markaz_id, ...(currentProfile.extra_markaz_ids || [])].filter(Boolean);
}
function scopeSchoolsQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("markaz_id", ids) : q.eq("markaz_id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "school_user"){
    q = q.eq("id", currentProfile.school_id);
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("markaz.tehsil", currentProfile.tehsil);
    if(currentProfile.wing_scope) q = q.eq("wing", currentProfile.wing_scope);
  }
  return q;
}
function scopeMarkazQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("id", ids) : q.eq("id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("tehsil", currentProfile.tehsil);
  }
  return q;
}

function sortSchoolsStandard(schools){
  const markazName = {};
  (cache.markaz || []).forEach(m => { markazName[m.id] = m.name || ""; });
  return (schools || []).slice().sort((a, b) =>
    (markazName[a.markaz_id] || "").localeCompare(markazName[b.markaz_id] || "")
    || (a.emis_code || "").localeCompare(b.emis_code || "")
  );
}

function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }

/* Last saved / edited time, shown in Pakistan time (Asia/Karachi) in 12-hour format, e.g. "21 October 2026, 05:40 PM".
   The value is the database's own updated_at (stamped by the server on save and on every edit), not the user's device clock.
   A record without a stored time shows "—" - no time is invented. */
const SAVED_AT_FMT = new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Karachi", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:true });
function fmtSavedAt(ts){
  if(!ts) return "—";
  const d = new Date(ts); if(isNaN(d)) return "—";
  const p = Object.fromEntries(SAVED_AT_FMT.formatToParts(d).map(x => [x.type, x.value]));
  return `${p.day} ${p.month} ${p.year}, ${p.hour}:${p.minute} ${String(p.dayPeriod || "").toUpperCase()}`;
}
function savedAtHtml(ts){ return ts ? `<span class="saved-at" title="Last saved or edited (Pakistan time)">${esc(fmtSavedAt(ts))}</span>` : `<span class="saved-at">—</span>`; }

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  if(!["admin","super_admin","tr","aeo"].includes(profile.role)){
    alert("This module is for AEOs and administrators.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderSidebarNav();
  buildNav();
  navigate("my_receipts");
}

async function loadRefData(){
  const markazQuery = scopeMarkazQuery(sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"));
  const [{ data: markaz }, { data: products }] = await Promise.all([
    markazQuery,
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  // Milk first, then Biscuit - matches the requested column order in the
  // receipts grid (and the convention every other page already uses).
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });

  // "His schools" - the AEO's own markaz plus any additional charge; a TR's
  // whole tehsil (narrowed to their wing where A-I-DB sets one). Admins see all.
  const schoolsQuery = scopeSchoolsQuery(
    sb.from("schools").select("id,school_name,emis_code,markaz_id,wing,markaz!inner(tehsil)").eq("active", true)
  );
  const { data: schools } = await schoolsQuery;
  cache.schools = sortSchoolsStandard(schools);
}

/* ===================== NAV (card-based, not a sidebar) ===================== */
const SECTIONS = [
  { id:"my_receipts", label:"My Receipts", desc:"Add & review what you've entered" },

  document.querySelectorAll("#navList .menu-card").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  const content = document.getElementById("content");
  content.innerHTML = `<p style="color:var(--ink-soft)">Loading…</p>`;
  try{
    if(id === "my_receipts") await renderMyReceipts(content);
    if(id === "company_data") await renderCompanyData(content);
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  }
}

/* ===================== JURISDICTION FILTER (admin/tr only) ===================== */
// Cascading District -> Tehsil -> Markaz filter. AEOs are already scoped to
// their own markaz and never see this. Calls onApply(filteredSchoolIds)
// whenever a selection changes, including once on initial render.
// "Search by word" - free text typed in the filter box. Every word must appear somewhere in the row (school name,
// EMIS, markaz, product, invoice #, remarks ...). Invoice-style words also match with O/0 and punctuation ignored.
let jfSearchText = "";
function searchMatches(parts){
  const words = jfSearchText.split(/\s+/).filter(Boolean);
  if(!words.length) return true;
  const hay = parts.filter(v => v !== null && v !== undefined && v !== "").join(" ").toLowerCase();
  const hayNorm = normInvoice(hay);
  return words.every(w => {
    if(hay.includes(w)) return true;
    const wn = normInvoice(w);
    return wn.length >= 4 && hayNorm.includes(wn);
  });
}

function renderJurisdictionFilter(container, onApply){
  jfSearchText = "";
  // An AEO with only one markaz has nothing to narrow, so skip straight to their schools.
  // An AEO holding charge of several markaz gets a Markaz picker scoped to just those markaz,
  // same as everyone else - previously this whole filter was skipped for every AEO, so someone
  // with multiple markaz had no way to work on one at a time.
  const isAeoMulti = currentProfile.role === "aeo" && myMarkazIds().length > 1;
  if(!["admin","super_admin","tr"].includes(currentProfile.role) && !isAeoMulti){
    container.innerHTML = `
      <div class="card">
        <div class="form-row">
          <div style="flex:1 1 320px;"><label>Search <span id="jfSearchCount" class="sub"></span></label><input type="search" id="jfSearch" placeholder="Type to search: school, EMIS, markaz, invoice #, product…" autocomplete="off"/></div>
          <div style="align-self:end;"><button class="btn-primary" id="jfApply" type="button">Apply filter</button></div>
        </div>
      </div>`;
    const sOnly = document.getElementById("jfSearch");
    const go = () => onApply(cache.schools.map(s => s.id));
    sOnly.addEventListener("keydown", (e) => { if(e.key === "Enter") e.preventDefault(); });
    document.getElementById("jfApply").addEventListener("click", go);
    smpLiveSearch(sOnly, document.getElementById("content"), "#receiptsTable, #companyTable", document.getElementById("jfSearchCount"));
    onApply(cache.schools.map(s => s.id));
    return;
  }
  const scopedMarkaz = currentProfile.role === "aeo" ? cache.markaz.filter(m => myMarkazIds().includes(m.id)) : cache.markaz;
  const districts = [...new Set(scopedMarkaz.map(m => m.district))].filter(Boolean).sort();
  const wings = [...new Set(cache.schools.map(s => s.wing))].filter(Boolean).sort();
  container.innerHTML = `
    <div class="card">
      <h3>Filter by jurisdiction</h3>
      <p class="sub">District and Tehsil narrow the area; Wing must be picked before Markaz becomes selectable, since which Markaz have schools of that Wing depends on it.</p>
      <div class="form-row">
        <div style="${currentProfile.role === 'aeo' ? 'display:none' : ''}"><label>District</label><select id="jfDistrict"><option value="">All</option>${districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>
        <div><label>Tehsil</label><select id="jfTehsil"><option value="">All</option></select></div>
        <div><label>Wing</label><select id="jfWing"><option value="">All</option>${wings.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>
        <div><label>Markaz</label><select id="jfMarkaz" disabled><option value="">All (pick a Wing to narrow)</option></select></div>
        <div><label>EMIS Code</label><input type="text" id="jfEmis" placeholder="Search one school"/></div>
        <div style="flex:1 1 260px;"><label>Search <span id="jfSearchCount" class="sub"></span></label><input type="search" id="jfSearch" placeholder="Type to search: school, markaz, invoice #, product…" autocomplete="off"/></div>
        <div style="align-self:end;"><button class="btn-primary" id="jfApply" type="button">Apply filter</button></div>
      </div>
    </div>
  `;
  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz"), wEl = document.getElementById("jfWing"), eEl = document.getElementById("jfEmis"), sEl = document.getElementById("jfSearch");

  function refreshTehsil(){
    const d = dEl.value;
    const tehsils = [...new Set(scopedMarkaz.filter(m => !d || m.district === d).map(m => m.tehsil))].filter(Boolean).sort();
    tEl.innerHTML = `<option value="">All</option>` + tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  function refreshMarkaz(){
    const d = dEl.value, t = tEl.value, w = wEl.value;
    const markazIdsWithWing = w
      ? new Set(cache.schools.filter(s => s.wing === w).map(s => s.markaz_id))
      : null;
    const list = scopedMarkaz.filter(m =>
      (!d || m.district === d) && (!t || m.tehsil === t) && (!markazIdsWithWing || markazIdsWithWing.has(m.id)));
    mEl.disabled = !w;
    mEl.innerHTML = w
      ? `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")
      : `<option value="">All (pick a Wing to narrow)</option>`;
  }
  function apply(){
    const d = dEl.value, t = tEl.value, mId = wEl.value ? mEl.value : "", wing = wEl.value;
    const emis = (eEl.value || "").trim();
    // An EMIS code identifies exactly one school, so when one is entered it
    // overrides the geography/wing pickers entirely rather than intersecting
    // with them - otherwise a valid code would return nothing whenever the
    // dropdowns happened to be pointed elsewhere.
    if(emis){
      onApply(cache.schools.filter(s => (s.emis_code || "").includes(emis)).map(s => s.id));
      return;
    }
    const markazIds = new Set(scopedMarkaz.filter(m => (!d || m.district === d) && (!t || m.tehsil === t) && (!mId || m.id === mId)).map(m => m.id));
    onApply(cache.schools.filter(s => markazIds.has(s.markaz_id) && (!wing || s.wing === wing)).map(s => s.id));
  }
  refreshTehsil(); refreshMarkaz();
  // Filters only take effect when "Apply filter" is clicked (or Enter is pressed in the EMIS box) - nothing
  // reloads while the pickers are being changed. The pickers still narrow each other's options as you go.
  dEl.addEventListener("change", () => { refreshTehsil(); refreshMarkaz(); });
  tEl.addEventListener("change", () => { refreshMarkaz(); });
  wEl.addEventListener("change", () => { mEl.value = ""; refreshMarkaz(); });
  eEl.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); apply(); } });
  sEl.addEventListener("keydown", (e) => { if(e.key === "Enter") e.preventDefault(); });
  smpLiveSearch(sEl, document.getElementById("content"), "#receiptsTable, #companyTable", document.getElementById("jfSearchCount"));
  document.getElementById("jfApply").addEventListener("click", apply);
  apply();   // one initial load with the default scope
}

/* ===================== SECTION: MY RECEIPTS ===================== */

  content.innerHTML = `<div id="filterMount"></div><div id="receiptsMount"></div>`;
  renderJurisdictionFilter(document.getElementById("filterMount"), (schoolIds) => renderMyReceiptsBody(schoolIds));

let receiptFilter = { date: "", product: "" };   // applied History filter (changes only on "Apply filter")
let receiptRowsCache = [];

// After a receipt is saved or edited, matching company data certifies it automatically and the database sets the
// receipt's date to the company delivery date when the AEO entered a different (wrong) one. Report that back.
async function receiptDateNote(receiptId, enteredDate){
  try{
    if(!receiptId || !enteredDate) return "";
    const { data } = await sb.from("school_receipts").select("receipt_date").eq("id", receiptId).single();
    if(data && data.receipt_date && data.receipt_date !== enteredDate) return ` Date corrected to the company delivery date (${fmtDate(data.receipt_date)}).`;
  }catch(e){ /* the note is informational only */ }
  return "";
}

// ---- Duplicate-invoice protection (the database is the authority; these helpers only explain its answer) ----

// Maps a database error to a duplicate / conflict problem, or null if it is some other error.
function invoiceProblemFromError(err){
  const msg = (err && err.message) || "", code = err && err.code;
  let kind = null;
  if(code === "SMDUP" || /^Duplicate Invoice Detected/i.test(msg)) kind = "duplicate";
  else if(code === "SMCNF" || /^Invoice Number Conflict/i.test(msg)) kind = "conflict";
  else if(code === "23505" || /duplicate key/i.test(msg)) kind = "duplicate";
  if(!kind) return null;
  let existingId = null;
  try{ existingId = (JSON.parse((err && err.details) || "null") || {}).existing?.id || null; }catch(e){}
  return { kind, message: /^(Duplicate Invoice Detected|Invoice Number Conflict)/i.test(msg) ? msg : "", existingId };
}

// Asks the database whether this receipt would be a duplicate or a conflict BEFORE anything is saved.
async function precheckReceipt(schoolId, productId, invoice, date, qty){
  try{
    const { data, error } = await sb.rpc("fn_check_school_receipt", {
      p_school_id: schoolId, p_product_id: productId, p_invoice_number: invoice,
      p_receipt_date: date, p_quantity: qty, p_exclude_id: null,
    });
    if(error) return null;          // the save itself is still checked by the database
    return data;
  }catch(e){ return null; }
}

// Same school + product + invoice number already saved. Shows what is on file (school, markaz, who entered it) and
// lets the user go back or save anyway - the entry is flagged for rectification, never blocked.
function showInvoiceWarningModal(chk, school, product, invoice){
  return new Promise((resolve) => {
    const old = document.getElementById("invoiceWarningModal");
    if(old) old.remove();
    const isDup = chk.status === "duplicate";
    const body = String(chk.message || "").replace(/^[^:]+:\s*/, "");
    const overlay = document.createElement("div");
    overlay.id = "invoiceWarningModal";
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>⚠ ${isDup ? "Duplicate Invoice Detected" : "Invoice Number Conflict"}</h3>
        <p>You tried to add <b>${esc(invoice)}</b> for <b>${esc(school?.school_name || "")}</b>${product ? ` - ${esc(product.product_name)}` : ""}.</p>
        <div class="modal-note">${esc(body)}</div>
        <p><b>Nothing was saved.</b> An invoice number can be entered only once. Check the number on your challan. If the entry already on file is the wrong one, edit or delete that entry instead of adding it again.</p>
        <div class="actions-row">
          <button class="btn-secondary" id="iwCancelBtn" type="button">Close</button>
          ${chk.existing?.id ? `<button class="btn-primary" id="iwEditBtn" type="button">Edit the existing entry</button>` : ""}
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const done = (v) => { overlay.remove(); resolve(v); };
    document.getElementById("iwCancelBtn").addEventListener("click", () => done(false));
    const eb = document.getElementById("iwEditBtn");
    if(eb) eb.addEventListener("click", async () => {
      const { data: existing, error } = await sb.from("school_receipts")
        .select("id, receipt_date, quantity_received, invoice_number, collected_by, remarks, school_id, product_id")
        .eq("id", chk.existing.id).single();
      if(error){ toast(error.message, "bad"); return; }
      overlay.remove();
      document.getElementById("addInventoryModal")?.remove();
      showEditReceiptModal(existing, cache.schools.find(s => s.id === existing.school_id) || school,
        cache.products.find(p => p.id === existing.product_id) || product, () => renderMyReceiptsBody(lastVisibleSchoolIds));
      resolve(false);
    });
  });
}

// Caution (not a block): this school already has the SAME product on this date. Different products never come here -
// a school can receive milk and biscuits on one day. Invoice numbers are only ever compared within the same product.
function showSameDayCautionModal(existing, school, product, date){
  return new Promise((resolve) => {
    const old = document.getElementById("sameDayModal");
    if(old) old.remove();
    const overlay = document.createElement("div");
    overlay.id = "sameDayModal";
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>⚠ Caution - ${esc(product?.product_name || "This product")} already received on this date</h3>
        <p><b>${esc(school?.school_name || "")}</b> already has ${existing.length} ${esc(product?.product_name || "")} ${existing.length === 1 ? "entry" : "entries"} dated <b>${esc(fmtDate(date))}</b>:</p>
        <div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>Qty</th></tr></thead><tbody>
          ${existing.map(e => `<tr><td>${esc(e.invoice_number) || "—"}</td><td>${fmt(e.quantity_received)}</td></tr>`).join("")}
        </tbody></table></div>

// "Add inventory" form: School, Product, Invoice no / Challan no, Date received (as per challan), Total pieces/packs.
function showAddInventoryModal(visibleSchoolIds){
  const old = document.getElementById("addInventoryModal");
  if(old) old.remove();
  // EMIS is looked up against every school this person is allowed to work with (not just the filtered list).
  const mySchools = cache.schools;
  if(!mySchools.length){ toast("No schools are available for your account.", "bad"); return; }
  const findSchool = (emis) => mySchools.find(s => String(s.emis_code).trim() === String(emis || "").trim());
  const productOpts = cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");

  const overlay = document.createElement("div");
  overlay.id = "addInventoryModal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Add inventory</h3>
      <form id="addInventoryForm" class="form-row" style="grid-template-columns:1fr;">
        <div><label>EMIS code *</label><input type="text" name="emis_code" required autocomplete="off" inputmode="numeric" placeholder="Enter the school's EMIS code"/>
          <div id="addInvSchoolName" class="sub" style="margin:4px 0 0;"></div></div>
        <div><label>Product *</label><select name="product_id" required><option value="">Select…</option>${productOpts}</select></div>
        <div><label>Invoice no / Challan no *</label><input type="text" name="invoice_number" required autocomplete="off"/></div>
        <div><label>Date of inventory received (as per challan) *</label><input type="date" name="receipt_date" max="${todayStr()}" required/></div>
        <div><label>Total pieces / packs received *</label><input type="number" name="quantity_received" min="0" step="0.01" required/></div>
        <div id="addInvError"></div>
        <div class="actions-row">
          <button class="btn-secondary" id="addInvCancel" type="button">Cancel</button>
          <button class="btn-primary" id="addInvSubmit" type="submit">Submit</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);

  const form = document.getElementById("addInventoryForm");
  const errBox = document.getElementById("addInvError");
  const submitBtn = document.getElementById("addInvSubmit");
  let busy = false;
  const close = () => { if(!busy) overlay.remove(); };
  document.getElementById("addInvCancel").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });

  const nameBox = document.getElementById("addInvSchoolName");
  form.elements.emis_code.addEventListener("input", (e) => {
    const v = e.target.value.trim();
    if(!v){ nameBox.textContent = ""; return; }
    const s = findSchool(v);
    const mk = s ? cache.markaz.find(m => m.id === s.markaz_id)?.name : "";
    nameBox.innerHTML = s ? `<span style="color:var(--ok-fg);">✓ ${esc(s.school_name)}${mk ? ` (${esc(mk)})` : ""}</span>`
                          : `<span style="color:var(--bad-fg);">No school with this EMIS code in your list</span>`;
  });
  form.elements.receipt_date.addEventListener("change", (e) => {
    if(e.target.value && e.target.value > todayStr()){
      toast("A delivery can't be dated in the future - check the day and month.", "bad");
      e.target.value = todayStr();
    }
  });

  const showErr = (msg) => { errBox.innerHTML = `<div class="modal-note" style="color:var(--bad-fg);">${esc(msg)}</div>`; };
  const showProblem = (kind, message, existingId) => {
    const isDup = kind === "duplicate";
    const title = isDup ? "Duplicate Invoice Detected" : "Invoice Number Conflict";
    const fallback = isDup ? "This invoice already exists in the system. The invoice cannot be added again."
      : "This invoice number already exists with different invoice details. Please verify the date, product, and quantity before proceeding.";
    const body = String(message || "").replace(/^[^:]+:\s*/, "") || fallback;
    errBox.innerHTML = `<div class="modal-note" style="color:var(--bad-fg);"><b>⚠ ${esc(title)}</b><br>${esc(body)}<br>Nothing was saved.${existingId ? ` <button class="link-btn edit" id="addInvEditExisting" type="button">Edit the existing entry</button>` : ""}</div>`;
    const b = document.getElementById("addInvEditExisting");
    if(b) b.addEventListener("click", async () => {
      const { data: existing, error } = await sb.from("school_receipts")
        .select("id, receipt_date, quantity_received, invoice_number, collected_by, remarks, school_id, product_id")
        .eq("id", existingId).single();
      if(error){ toast(error.message, "bad"); return; }
      overlay.remove();
      showEditReceiptModal(existing, cache.schools.find(s => s.id === existing.school_id), cache.products.find(p => p.id === existing.product_id),
        () => loadReceiptsTable(visibleSchoolIds));
    });
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if(busy) return;                                    // no double submission
    errBox.innerHTML = "";
    const fd = new FormData(form);
    const school = findSchool(fd.get("emis_code")), schoolId = school ? school.id : "";
    const productId = fd.get("product_id");
    const invoice = String(fd.get("invoice_number") || "").trim();
    const date = fd.get("receipt_date"), qty = fd.get("quantity_received");
    const product = cache.products.find(p => p.id === productId);
    if(!String(fd.get("emis_code") || "").trim()){ showErr("EMIS code is required."); return; }
    if(!schoolId){ showErr("This EMIS code was not found among your schools. Check the code and try again."); return; }
    if(!productId){ showErr("Choose the product."); return; }
    if(!invoice){ showErr("Invoice no / Challan no is required."); return; }
    if(!date){ showErr("Enter the date of inventory received as per the challan."); return; }
    if(date > todayStr()){ showErr("A delivery can't be dated in the future - check the day and month."); return; }
    if(qty === "" || isNaN(Number(qty)) || Number(qty) < 0){ showErr("Enter the total pieces / packs received."); return; }
    // Zero is a real answer (a delivery genuinely didn't arrive) but easy to enter by mistake - confirm intent.
    if(Number(qty) === 0 && !confirm(`Save a quantity of 0 for ${product?.product_name} at ${school?.school_name} (${date})? Confirm only if this school genuinely received none.`)) return;

    busy = true; submitBtn.disabled = true; submitBtn.textContent = "Checking…";
    try{
      // Ask the database first, so an existing invoice is reported before anything is saved. The database
      // re-checks inside the save itself, so this cannot be bypassed (refresh, second tab, double click).
      const chk = await precheckReceipt(schoolId, productId, invoice, date, qty);
      // The invoice number is already in the system (same school or another school): show exactly where and by
      // whom, and STOP. The database enforces the same rule on the save itself, so it cannot be bypassed.
      if(chk && (chk.status === "duplicate" || chk.status === "conflict")){
        if(chk.others && chk.others.length) await showOtherSchoolModal(chk.others, school, product, invoice);
        else await showInvoiceWarningModal(chk, school, product, invoice);
        return;
      }
      // Same product already received by this school on this date? Ask before adding another (other products: no caution).
      const { data: sameDay } = await sb.from("school_receipts")
        .select("id, invoice_number, quantity_received")
        .eq("school_id", schoolId).eq("product_id", productId).eq("receipt_date", date).eq("status", "active");
      if(sameDay && sameDay.length){
        const goOn = await showSameDayCautionModal(sameDay, school, product, date);
        if(!goOn) return;
      }
      submitBtn.textContent = "Saving…";
      const { data, error } = await sb.rpc("fn_create_school_receipt", {
        p_school_id: schoolId, p_product_id: productId, p_receipt_date: date,
        p_quantity_received: qty, p_invoice_number: invoice, p_collected_by: null, p_remarks: null,
      });
      if(error) throw error;
      const r = data?.[0];
      const dateNote = r?.auto_certified ? await receiptDateNote(r.id, date) : "";
      busy = false; overlay.remove();
      toast(r?.auto_certified ? "Inventory added and certified automatically." + dateNote
        : r?.flagged_mismatch ? "Inventory added - flagged for review (quantity matches a different invoice)."
        : "Inventory added.");
      await loadReceiptsTable(visibleSchoolIds);
    }catch(err){
      const prob = invoiceProblemFromError(err);
      if(prob) showProblem(prob.kind, prob.message, prob.existingId);
      else showErr(err.message || "Could not save. Nothing was added.");
    }finally{
      busy = false; submitBtn.disabled = false; submitBtn.textContent = "Submit";
    }
  });
}

async function loadReceiptsTable(schoolIds){
  // Same fix as the Dashboard 400 bug: a large schoolIds array (admin/TR
  // viewing a whole tehsil, 700+ IDs) makes .in() build a URL long enough
  // to be rejected outright. Below a safe size, filter exactly; above it,
  // skip the explicit filter and let RLS return the correct scope on its
  // own - school_receipts_select already limits rows to what this person
  // can see, which is exactly what an unnarrowed schoolIds list means anyway.
  let q = sb.from("school_receipts")
    .select("id, receipt_date, quantity_received, invoice_number, invoice_flag, invoice_flag_note, collected_by, remarks, status, updated_at, school_id, product_id, schools(emis_code, school_name, markaz_id), products(product_name, unit_name)")
    .eq("status", "active");
  if(schoolIds.length <= 150) q = q.in("school_id", schoolIds);
  const { data, error } = await q.order("receipt_date", { ascending: false });

  const tbody = document.querySelector("#receiptsTable tbody");
  if(error){ tbody.innerHTML = `<tr><td colspan="11" class="err">${esc(error.message)}</td></tr>`; return; }
  receiptRowsCache = data || [];
  renderReceiptRows(schoolIds);
}

// Draws the history table from the loaded entries, applying the Date / Product filter chosen with "Apply filter".
function renderReceiptRows(schoolIds){
  const tbody = document.querySelector("#receiptsTable tbody");
  if(!tbody) return;
  // Requested sort: date descending, then EMIS code ascending within each date.
  const sortedRows = receiptRowsCache.slice().sort((a, b) => {
    if(a.receipt_date !== b.receipt_date) return a.receipt_date < b.receipt_date ? 1 : -1;
    return (a.schools?.emis_code || "").localeCompare(b.schools?.emis_code || "");
  });
  // Date dropdown lists only dates that have entries; if the applied date no longer has any, go back to "all".
  const dates = [...new Set(sortedRows.map(r => r.receipt_date))];
  if(receiptFilter.date && !dates.includes(receiptFilter.date)) receiptFilter.date = "";
  const dEl = document.getElementById("rcDate"), pEl = document.getElementById("rcProduct");
  if(dEl){ dEl.innerHTML = `<option value="">All dates</option>` + dates.map(d => `<option value="${esc(d)}">${esc(fmtDate(d))}</option>`).join(""); dEl.value = receiptFilter.date; }
  if(pEl) pEl.value = receiptFilter.product;
  const rows = sortedRows.filter(r => (!receiptFilter.date || r.receipt_date === receiptFilter.date)
      && (!receiptFilter.product || r.product_id === receiptFilter.product)).filter(r => {
    const mz = cache.markaz.find(m => m.id === r.schools?.markaz_id);
    return searchMatches([fmtDate(r.receipt_date), r.receipt_date, mz?.name, mz?.tehsil, mz?.district, r.schools?.emis_code,
      r.schools?.school_name, r.products?.product_name, r.quantity_received, r.invoice_number, r.collected_by, r.remarks]);
  });

  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="11" style="color:var(--ink-soft)">${sortedRows.length ? "No receipts match your search or filter." : "No receipts entered yet."}</td></tr>`; return; }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${fmtDate(r.receipt_date)}</td>
      <td>${esc(cache.markaz.find(m => m.id === r.schools?.markaz_id)?.name || "—")}</td>
      <td>${esc(r.schools?.emis_code)}</td>
      <td>${esc(r.schools?.school_name)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td>${fmt(r.quantity_received)} ${esc(r.products?.unit_name || "")}</td>
      <td>${esc(r.invoice_number) || "—"}${r.invoice_flag ? ` <span class="pill pill-warn" title="${esc((r.invoice_flag_note || "") + " - Edit this entry to correct the invoice number.")}">⚠ Flagged: ${r.invoice_flag === "other_school" ? "also used at another school" : r.invoice_flag === "duplicate" ? "duplicate entry" : "different details on file"}</span>` : ""}</td>
      <td>${esc(r.collected_by) || "—"}</td>
      <td>${esc(r.remarks) || "—"}</td>
      <td>${savedAtHtml(r.updated_at)}</td>
      <td>
        <button class="link-btn edit" onclick='editExistingReceipt(${JSON.stringify(r.id)}, ${JSON.stringify(schoolIds)})'>Edit</button>
        <button class="link-btn danger" onclick='deleteExistingReceipt(${JSON.stringify(r.id)}, ${JSON.stringify(schoolIds)})'>Delete</button>
      </td>
    </tr>
  `).join("");
}

// Bridges a row in the already-entered table to the same edit modal used
// from the grid's duplicate-date check, so corrections work from either place.
async function editExistingReceipt(receiptId, schoolIds){
  const { data: existing, error } = await sb.from("school_receipts")
    .select("id, receipt_date, quantity_received, invoice_number, collected_by, remarks, school_id, product_id")
    .eq("id", receiptId).single();
  if(error){ toast(error.message, "bad"); return; }
  const school = cache.schools.find(s => s.id === existing.school_id);
  const product = cache.products.find(p => p.id === existing.product_id);
  showEditReceiptModal(existing, school, product, () => loadReceiptsTable(schoolIds));
}

async function deleteExistingReceipt(receiptId, schoolIds){
  const { data: existing, error } = await sb.from("school_receipts")
    .select("id, receipt_date, quantity_received, invoice_number, school_id, product_id")
    .eq("id", receiptId).single();
  if(error){ toast(error.message, "bad"); return; }
  const school = cache.schools.find(s => s.id === existing.school_id);
  const product = cache.products.find(p => p.id === existing.product_id);

  if(!confirm(`Delete the ${product?.product_name} receipt (Qty ${fmt(existing.quantity_received)}, Invoice #${existing.invoice_number || "—"}) for ${school?.school_name} on ${fmtDate(existing.receipt_date)}? This cannot be undone from here.`)) return;

  try{
    const { error: delErr } = await sb.rpc("fn_delete_school_receipt", { p_receipt_id: receiptId });
    if(delErr) throw delErr;
    toast("Receipt deleted");
    await loadReceiptsTable(schoolIds);
  }catch(err){
    toast(err.message, "bad");
  }
}

let companyRowsAll = [], companyRowsShown = [], aeoReceiptMap = {};
// Mirrors the database's fn_norm_invoice (upper-case, letters/digits only, letter O read as zero).
function normInvoice(v){ return String(v ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/O/g, "0"); }
// The AEO receipt(s) behind a company row, read live from school_receipts (never cached with the company row),
// so a date changed by the AEO or auto-corrected by the system shows up here immediately.
function aeoReceiptsFor(r){
  const inv = normInvoice(r.company_invoices?.invoice_number);
  return aeoReceiptMap[`${r.school_id}|${r.product_id}|${inv}`] || [];
}
function aeoDateText(r){
  const recs = aeoReceiptsFor(r);
  return recs.length ? [...new Set(recs.map(x => x.receipt_date))].map(d => new Date(d).toLocaleDateString("en-GB")).join(", ") : "";
}
function aeoDateCell(r){
  const recs = aeoReceiptsFor(r);
  if(!recs.length) return '<span style="color:var(--ink-soft)">No AEO receipt</span>';
  const compDate = r.company_invoices?.delivery_date || r.company_invoices?.invoice_date;
  const dates = [...new Set(recs.map(x => x.receipt_date))];
  const main = dates.map(d => `<span style="${compDate && d !== compDate ? "color:#b45309;font-weight:600" : ""}">${fmtDate(d)}</span>`).join(", ");
  const corrected = recs.find(x => x.original_receipt_date && x.original_receipt_date !== x.receipt_date);
  return main + (corrected ? `<div style="font-size:11px;color:var(--ink-soft)">corrected from ${fmtDate(corrected.original_receipt_date)}</div>` : "");
}
function downloadCompanyRows(){
  if(!companyRowsShown.length){ toast("Nothing to download for this selection.", "bad"); return; }
  const dmy = d => d ? new Date(d).toLocaleDateString("en-GB") : "";
  const header = ["Delivery date","AEO receipt date","Markaz","EMIS","School","Product","Quantity","Unit","Invoice #","Status","Matched with company invoice"];
  const rows = companyRowsShown.map(r => {
    const s = r.aeo_verification_status, rem = r.aeo_verification_remarks || "";
    const matched = s === "received" && /^Auto-certified/i.test(rem) ? "Matched - certified automatically"
      : s === "received" ? "Certified manually" : s === "flagged_mismatch" ? "Not matched - invoice # differs" : s === "not_received" ? "Marked not received" : "Not matched yet";
    return [dmy(r.company_invoices?.delivery_date || r.company_invoices?.invoice_date), aeoDateText(r),
      cache.markaz.find(m => m.id === r.schools?.markaz_id)?.name || "", r.schools?.emis_code || "", r.schools?.school_name || "",
      r.products?.product_name || "", Number(r.quantity) || 0, r.products?.unit_name || "", r.company_invoices?.invoice_number || "",
      s || "pending", matched];
  });
  const prod = document.getElementById("companyProduct");
  const label = prod && prod.value ? (prod.options[prod.selectedIndex].text || "").replace(/\s+/g, "-") : "all-products";
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...rows]), "Company data");
  XLSX.writeFile(wb, `company-data_${label}.xlsx`);
}

async function loadCompanyTable(schoolIds){
  // Paged read (a plain select is silently capped at 1,000 rows). Skip the explicit .in() above a safe
  // size and let RLS scope it instead.
  const { data, error } = await smpFetchAll(() => {
    let q = sb.from("company_invoice_items")
      .select(`
        id, quantity, aeo_verification_status, aeo_verification_remarks, created_at,
        school_id, product_id, schools(emis_code, school_name, markaz_id), products(product_name, unit_name),
        company_invoices(invoice_number, invoice_date, delivery_date, status)
      `);
    if(schoolIds.length <= 150) q = q.in("school_id", schoolIds);
    return q.order("created_at", { ascending: false }).order("id");
  });

  const tbody = document.querySelector("#companyTable tbody");
  if(error){ tbody.innerHTML = `<tr><td colspan="11" class="err">${esc(error.message)}</td></tr>`; return; }
  companyRowsAll = (data || []).filter(r => r.company_invoices?.status !== "void");
  // Current AEO receipt dates, read fresh on every load.
  aeoReceiptMap = {};
  const rc = await smpFetchAll(() => {
    let q = sb.from("school_receipts").select("id, school_id, product_id, receipt_date, original_receipt_date, invoice_number").eq("status", "active");
    if(schoolIds.length <= 150) q = q.in("school_id", schoolIds);
    return q.order("id");
  });
  if(rc.error){ toast("Could not load AEO receipt dates: " + rc.error.message, "bad"); }
  (rc.data || []).forEach(x => { (aeoReceiptMap[`${x.school_id}|${x.product_id}|${normInvoice(x.invoice_number)}`] ||= []).push(x); });
  renderCompanyRows(schoolIds);
}

function renderCompanyRows(schoolIds){
  const tbody = document.querySelector("#companyTable tbody");
  const productId = (document.getElementById("companyProduct") || {}).value || "";
  const rows = companyRowsAll.filter(r => (!productId || r.product_id === productId) && searchMatches([
    fmtDate(r.company_invoices?.delivery_date || r.company_invoices?.invoice_date), r.schools?.emis_code, r.schools?.school_name,
    cache.markaz.find(m => m.id === r.schools?.markaz_id)?.name, r.products?.product_name, r.quantity,
    r.company_invoices?.invoice_number, r.aeo_verification_status, r.aeo_verification_remarks]));
  companyRowsShown = rows;
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="11" style="color:var(--ink-soft)">${companyRowsAll.length ? "No company data matches your filter or search." : "No company data uploaded yet."}</td></tr>`; return; }

  const statusPill = (s, remarks) => s === "received" ? '<span class="pill pill-ok">Received</span>'
    : s === "not_received" ? '<span class="pill pill-bad">Not received</span>'
    : s === "flagged_mismatch" ? `<span class="pill pill-warn" title="${esc(remarks || "")}">⚠ Qty matches other invoice</span>`
    : '<span class="pill pill-warn">Pending</span>';

  // Whether the AEO's own receipt matched this company invoice (same invoice #, product and quantity).
  // Auto-certification writes an "Auto-certified: matched ..." remark; anything else marked received was
  // certified by hand.
  // A row whose company invoice matched the AEO receipt was certified by the database - nothing to ask for.
  const autoCertified = r => r.aeo_verification_status === "received" && /^Auto-certified/i.test(r.aeo_verification_remarks || "");
  const matchCell = r => {
    const s = r.aeo_verification_status, rem = r.aeo_verification_remarks || "";
    if(s === "received" && /^Auto-certified/i.test(rem)) return '<span class="pill pill-ok" title="Your receipt matches this company invoice (invoice #, product and quantity). Certified automatically.">✓ Matched with company invoice</span>';
    if(s === "received") return '<span class="pill pill-ok" title="Certified manually">Certified manually</span>';
    if(s === "flagged_mismatch") return `<span class="pill pill-warn" title="${esc(rem)}">⚠ Not matched - invoice # differs</span>`;
    if(s === "not_received") return '<span style="color:var(--ink-soft)">—</span>';
    return '<span style="color:var(--ink-soft)">Not matched yet</span>';
  };

  tbody.innerHTML = rows.map(r => `
    <tr data-id="${r.id}">
      <td>${fmtDate(r.company_invoices?.delivery_date || r.company_invoices?.invoice_date)}</td>
      <td>${aeoDateCell(r)}</td>
      <td>${esc(cache.markaz.find(m => m.id === r.schools?.markaz_id)?.name || "—")}</td>
      <td>${esc(r.schools?.emis_code)}</td>
      <td>${esc(r.schools?.school_name)}</td>
      <td>${esc(r.products?.product_name)}</td>
      <td>${fmt(r.quantity)} ${esc(r.products?.unit_name || "")}</td>
      <td>${esc(r.company_invoices?.invoice_number) || "—"}</td>
      <td class="status-cell">${statusPill(r.aeo_verification_status, r.aeo_verification_remarks)}</td>
      <td>${matchCell(r)}</td>
      <td>${autoCertified(r) ? '<span style="color:var(--ink-soft)">Certified automatically - no action needed</span>'
        : r.aeo_verification_status === "received" ? '<span style="color:var(--ink-soft)">Certified earlier - no action needed</span>'
        : `<span style="color:var(--ink-soft)">${r.aeo_verification_status === "flagged_mismatch" ? "Check the invoice # and quantity in your receipt" : "Enter or correct your receipt"}</span> <button class="link-btn" type="button" data-goto="my_receipts">Go to My Receipts</button>`}
      </td>
    </tr>
  `).join("");

  tbody.querySelectorAll("button[data-goto]").forEach(btn => btn.addEventListener("click", () => navigate(btn.dataset.goto)));
}
</script>
