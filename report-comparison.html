<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Comparison — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Report Comparison</h2>
      </div>
      <a class="home-link" href="dashboard.html">&larr; Dashboard</a>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null;
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

// Excel/CSV dates arrive as arbitrary text (8/1/2026, 2026-08-01, 01-Aug-2026,
// etc.) - normalize to ISO so the database accepts it. Returns "" if unparseable.
function normalizeDate(raw){
  if(!raw) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  const d = new Date(raw);
  if(isNaN(d.getTime())) return "";
  return d.toISOString().slice(0,10);
}

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  // Report Comparison is admin/super_admin/tr only.
  if(!["admin","super_admin","tr"].includes(profile.role)){
    alert("Report Comparison is only available to admins and Tehsil Representatives.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderPage();
}

async function loadRefData(){
  const [{ data: markaz }, { data: schools }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"),
    sb.from("schools").select("id,school_name,emis_code,markaz_id").eq("active", true),
    sb.from("products").select("id,product_name").eq("active", true),
  ]);
  cache.markaz = markaz || [];
  cache.schools = schools || [];
  cache.products = products || [];
}

/* ===================== PAGE ===================== */
async function renderPage(){
  const content = document.getElementById("content");
  const districts = [...new Set(cache.markaz.map(m => m.district))].filter(Boolean).sort();
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);

  content.innerHTML = `
    <div id="uploadMount"></div>
    <div class="card">
      <h3>Company vs AEO comparison</h3>
      <p class="sub">Company-uploaded vendor invoice quantities against what AEOs reported receiving. Non-zero differences are flagged for follow-up.</p>
      <form id="filterForm" class="form-row">
        <div><label>From</label><input type="date" name="from" value="${daysAgoStr(30)}"/></div>
        <div><label>To</label><input type="date" name="to" value="${todayStr()}"/></div>
        <div><label>District</label><select id="jfDistrict"><option value="">All</option>${districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>
        <div><label>Tehsil</label><select id="jfTehsil"><option value="">All</option></select></div>
        <div><label>Markaz</label><select id="jfMarkaz"><option value="">All</option></select></div>
        <div><label>Show only</label><select name="filter"><option value="all">All rows</option><option value="mismatch">Mismatches only</option></select></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Apply</button></div>
      </form>
    </div>
    <div class="grid-4" id="statCards"></div>
    <div class="card">
      <div class="table-wrap"><table id="compTable"><thead><tr>
        <th>Delivery date</th><th>EMIS</th><th>School</th><th>Product</th><th>Invoice #</th>
        <th>Company qty</th><th>AEO qty</th><th>Difference</th><th>Status</th>
      </tr></thead><tbody><tr><td colspan="9" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  if(isAdmin) renderUploadWizard(document.getElementById("uploadMount"));

  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz");
  function refreshTehsil(){
    const d = dEl.value;
    const tehsils = [...new Set(cache.markaz.filter(m => !d || m.district === d).map(m => m.tehsil))].filter(Boolean).sort();
    tEl.innerHTML = `<option value="">All</option>` + tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  function refreshMarkaz(){
    const d = dEl.value, t = tEl.value;
    const list = cache.markaz.filter(m => (!d || m.district === d) && (!t || m.tehsil === t));
    mEl.innerHTML = `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  }
  refreshTehsil(); refreshMarkaz();
  dEl.addEventListener("change", () => { refreshTehsil(); refreshMarkaz(); });
  tEl.addEventListener("change", refreshMarkaz);

  document.getElementById("filterForm").addEventListener("submit", (e) => {
    e.preventDefault();
    loadComparison(new FormData(e.target));
  });

  await loadComparison(new FormData(document.getElementById("filterForm")));
}

/* ===================== UPLOAD WIZARD (admin only) ===================== */
// State carried across the wizard's steps.
let uploadState = { rows: null, headers: null, mapping: null, productId: null, manualInvoiceNumber: null, manualDate: null };

function renderUploadWizard(mount){
  uploadState = { rows: null, headers: null, mapping: null, productId: null };
  const productOpts = cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");
  mount.innerHTML = `
    <div class="card">
      <h3>Upload company-provided data</h3>
      <p class="sub">Import a vendor delivery sheet (Excel/CSV) - a file can cover a whole week or month of deliveries with different dates and invoice numbers per row, so both are read from the file itself, not entered once for the whole batch. Milk and biscuit are uploaded separately, matching how the vendor issues invoices per product.</p>
      <div class="form-row">
        <div><label>Product</label><select id="upProduct" required><option value="">Select…</option>${productOpts}</select></div>
        <div><label>File</label><input type="file" id="upFile" accept=".xlsx,.xls,.csv"/></div>
        <div style="align-self:end;"><button class="btn-secondary" type="button" id="templateBtn">Download template</button></div>
      </div>
      <div id="wizardStep2"></div>
    </div>
  `;

  document.getElementById("templateBtn").addEventListener("click", downloadTemplate);

  document.getElementById("upFile").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
    if(!rows.length){ toast("File appears empty", "bad"); return; }
    uploadState.headers = rows[0].map(h => String(h).trim());
    uploadState.rows = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ""));
    renderColumnMapping();
  });
}

function downloadTemplate(){
  const wsData = [
    ["EMIS Code", "Quantity", "Invoice Number", "Delivery Date"],
    ["40074", "50", "INV-1001", "2026-08-01"],
    ["40074", "50", "INV-1015", "2026-08-08"],
    ["40081", "35", "INV-1002", "2026-08-01"],
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Deliveries");
  XLSX.writeFile(wb, "smp-company-data-template.xlsx");
}

function renderColumnMapping(){
  const step2 = document.getElementById("wizardStep2");
  const headerOpts = `<option value="">Select…</option>` + uploadState.headers.map((h, i) => `<option value="${i}">${esc(h)}</option>`).join("");
  step2.innerHTML = `
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
      <h3 style="font-size:14px;">Map columns</h3>
      <p class="sub">${uploadState.rows.length} rows detected. Every field is read per-row from the file - tell us which column is which.</p>
      <div class="form-row">
        <div><label>EMIS code column *</label><select id="mapEmis">${headerOpts}</select></div>
        <div><label>Quantity column *</label><select id="mapQty">${headerOpts}</select></div>
        <div><label>Invoice # column *</label><select id="mapInvoice">${headerOpts}</select></div>
        <div><label>Delivery date column *</label><select id="mapDate">${headerOpts}</select></div>
      </div>
      <div class="actions-row"><button class="btn-primary" type="button" id="previewBtn">Preview</button></div>
      <div id="wizardStep3"></div>
    </div>
  `;
  document.getElementById("previewBtn").addEventListener("click", renderPreview);
}

function renderPreview(){
  const productId = document.getElementById("upProduct").value;
  const emisCol = document.getElementById("mapEmis").value;
  const qtyCol = document.getElementById("mapQty").value;
  const invoiceCol = document.getElementById("mapInvoice").value;
  const dateCol = document.getElementById("mapDate").value;

  if(!productId){ toast("Select a product first", "bad"); return; }
  if(emisCol === "" || qtyCol === "" || invoiceCol === "" || dateCol === ""){
    toast("EMIS, Quantity, Invoice #, and Delivery Date columns are all required", "bad");
    return;
  }

  const schoolByEmis = Object.fromEntries(cache.schools.map(s => [String(s.emis_code).trim(), s]));

  // Parse every row, resolve school, and read invoice/date per-row from the
  // file (no batch-wide fallback - a real file spans many dates/invoices).
  const parsed = uploadState.rows.map((r, i) => {
    const emis = String(r[emisCol] ?? "").trim();
    const qty = Number(r[qtyCol]);
    const invoiceNumber = String(r[invoiceCol] ?? "").trim();
    const deliveryDate = normalizeDate(String(r[dateCol] ?? "").trim());
    const school = schoolByEmis[emis];
    return { rowNum: i + 2, emis, qty, invoiceNumber, deliveryDate, school, valid: !!school && !isNaN(qty) && qty >= 0 && !!invoiceNumber && !!deliveryDate };
  });

  // Dedupe within this batch: same EMIS + invoice number for this product ->
  // keep the first occurrence, flag the rest.
  const seen = new Set();
  parsed.forEach(row => {
    if(!row.valid) return;
    const key = `${row.emis}|${row.invoiceNumber.toUpperCase()}`;
    if(seen.has(key)){ row.duplicate = true; row.valid = false; }
    else seen.add(key);
  });

  uploadState.parsed = parsed;
  uploadState.productId = productId;

  const validCount = parsed.filter(r => r.valid).length;
  const invalidRows = parsed.filter(r => !r.valid);

  const step3 = document.getElementById("wizardStep3");
  step3.innerHTML = `
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
      <div class="grid-4">
        <div class="stat"><div class="n">${parsed.length}</div><div class="l">Rows in file</div></div>
        <div class="stat"><div class="n">${validCount}</div><div class="l">Ready to import</div></div>
        <div class="stat"><div class="n">${invalidRows.filter(r => r.duplicate).length}</div><div class="l">Duplicates skipped</div></div>
        <div class="stat"><div class="n">${invalidRows.filter(r => !r.duplicate && !r.school).length}</div><div class="l">Unmatched EMIS</div></div>
      </div>
      ${invalidRows.length ? `
        <p class="sub" style="margin-top:12px;">Rows that will be skipped:</p>
        <div class="table-wrap"><table><thead><tr><th>Row</th><th>EMIS</th><th>Qty</th><th>Invoice #</th><th>Date</th><th>Reason</th></tr></thead><tbody>
          ${invalidRows.map(r => `<tr>
            <td>${r.rowNum}</td><td>${esc(r.emis)}</td><td>${esc(r.qty)}</td><td>${esc(r.invoiceNumber)}</td><td>${esc(r.deliveryDate)}</td>
            <td>${r.duplicate ? "Duplicate EMIS+invoice in this file" : !r.school ? "EMIS not found" : "Missing quantity, invoice #, or date"}</td>
          </tr>`).join("")}
        </tbody></table></div>
      ` : ""}
      <div class="actions-row">
        <button class="btn-primary" type="button" id="importBtn" ${validCount ? "" : "disabled"}>Import ${validCount} rows</button>
      </div>
    </div>
  `;
  document.getElementById("importBtn").addEventListener("click", runImport);
}

async function runImport(){
  const btn = document.getElementById("importBtn");
  btn.disabled = true;
  btn.textContent = "Importing…";
  const validRows = uploadState.parsed.filter(r => r.valid);

  // Group by invoice number (+ delivery date, in case the same number is
  // reused across dates) so each distinct invoice becomes one
  // company_invoices row with its line items underneath.
  const groups = {};
  validRows.forEach(r => {
    const key = `${r.invoiceNumber}|${r.deliveryDate}`;
    (groups[key] = groups[key] || []).push(r);
  });

  let invoiceCount = 0, itemCount = 0, errorCount = 0;
  for(const key in groups){
    const rows = groups[key];
    const { invoiceNumber, deliveryDate } = rows[0];
    try{
      const { data: invoice, error: invErr } = await sb.from("company_invoices").insert({
        invoice_number: invoiceNumber,
        product_id: uploadState.productId,
        invoice_date: deliveryDate,
        delivery_date: deliveryDate,
        entered_by: currentUser.id,
      }).select("id").single();
      if(invErr) throw invErr;

      const items = rows.map(r => ({
        invoice_id: invoice.id,
        school_id: r.school.id,
        product_id: uploadState.productId,
        quantity: r.qty,
      }));
      const { error: itemErr } = await sb.from("company_invoice_items").insert(items);
      if(itemErr) throw itemErr;

      invoiceCount++;
      itemCount += rows.length;
    }catch(err){
      errorCount++;
      console.error("Import failed for invoice", invoiceNumber, err);
    }
  }

  toast(`Imported ${itemCount} rows across ${invoiceCount} invoice(s)${errorCount ? ` — ${errorCount} invoice group(s) failed (see console)` : ""}`,
    errorCount ? "bad" : "ok");
  await loadComparison(new FormData(document.getElementById("filterForm")));
  renderUploadWizard(document.getElementById("uploadMount"));
}

async function loadComparison(fd){
  const from = fd.get("from"), to = fd.get("to"), filter = fd.get("filter");
  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz");
  const selDistrict = dEl.value, selTehsil = tEl.value, selMarkazId = mEl.value;
  const tbody = document.querySelector("#compTable tbody");
  tbody.innerHTML = `<tr><td colspan="9" style="color:var(--ink-soft)">Loading…</td></tr>`;

  let query = sb.from("v_company_vs_aeo_comparison").select("*")
    .gte("delivery_date", from).lte("delivery_date", to)
    .order("delivery_date", { ascending: false });
  const { data, error } = await query;

  if(error){ tbody.innerHTML = `<tr><td colspan="9" class="err">${esc(error.message)}</td></tr>`; return; }

  const schoolById = Object.fromEntries(cache.schools.map(s => [s.id, s]));
  const productById = Object.fromEntries(cache.products.map(p => [p.id, p]));
  const markazById = Object.fromEntries(cache.markaz.map(m => [m.id, m]));

  let rows = (data || []).map(r => ({ ...r, school: schoolById[r.school_id], product: productById[r.product_id] }));
  if(selMarkazId) rows = rows.filter(r => r.school?.markaz_id === selMarkazId);
  else if(selTehsil) rows = rows.filter(r => markazById[r.school?.markaz_id]?.tehsil === selTehsil);
  else if(selDistrict) rows = rows.filter(r => markazById[r.school?.markaz_id]?.district === selDistrict);
  if(filter === "mismatch") rows = rows.filter(r => Number(r.difference) !== 0);

  // date desc, EMIS asc within date - same convention as Inventory Received.
  rows.sort((a, b) => {
    if(a.delivery_date !== b.delivery_date) return a.delivery_date < b.delivery_date ? 1 : -1;
    return (a.school?.emis_code || "").localeCompare(b.school?.emis_code || "");
  });

  const matched = rows.filter(r => r.status === "Matched").length;
  const aeoOnly = rows.filter(r => r.status === "AEO entered, company did not provide").length;
  const companyOnly = rows.filter(r => r.status === "Company provided, AEO did not enter").length;
  const qtyMismatch = rows.filter(r => r.status === "Short Received" || r.status === "Excess Received").length;
  document.getElementById("statCards").innerHTML = `
    <div class="stat"><div class="n">${rows.length}</div><div class="l">Total rows</div></div>
    <div class="stat"><div class="n">${matched}</div><div class="l">Matching</div></div>
    <div class="stat"><div class="n">${aeoOnly}</div><div class="l">AEO entered, company didn't</div></div>
    <div class="stat"><div class="n">${companyOnly}</div><div class="l">Company provided, AEO didn't</div></div>
  `;

  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="9" style="color:var(--ink-soft)">No data for this period.</td></tr>`; return; }

  const pillFor = (status) => {
    if(status === "Matched") return '<span class="pill pill-ok">Matched</span>';
    if(status === "AEO entered, company did not provide") return '<span class="pill pill-warn">AEO only</span>';
    if(status === "Company provided, AEO did not enter") return '<span class="pill pill-warn">Company only</span>';
    return '<span class="pill pill-bad">' + esc(status) + '</span>'; // Short/Excess Received
  };

  tbody.innerHTML = rows.map(r => {
    const diff = Number(r.difference);
    return `<tr>
      <td>${fmtDate(r.delivery_date)}</td>
      <td>${esc(r.school?.emis_code)}</td>
      <td>${esc(r.school?.school_name)}</td>
      <td>${esc(r.product?.product_name)}</td>
      <td>${esc(r.invoice_number) || "—"}</td>
      <td>${fmt(r.company_qty)}</td>
      <td>${fmt(r.aeo_qty)}</td>
      <td>${diff > 0 ? "+" : ""}${fmt(diff)}</td>
      <td>${pillFor(r.status)}</td>
    </tr>`;
  }).join("");
}
</script>
</body>
</html>
