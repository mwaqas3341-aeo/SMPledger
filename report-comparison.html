<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null;
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
// Standard school ordering used everywhere in this app: markaz name A-Z,
// then EMIS code A-Z within each markaz. Sorted client-side (not via an
// .order() on the query) because the sort key lives on the markaz table,
// not on schools - and every page already has cache.markaz loaded.
// ---- Jurisdiction scoping (single source of truth, mirrors the DB) ----
// A person's access is: their home markaz PLUS any additional markaz they
// hold charge of (A-I-DB scope_value when scope_type=Markaz), or - for a
// TR - their whole tehsil, optionally narrowed to one wing (A-I-DB
// scope_value '<TEHSIL>:<WING>'). Both used to be dropped, which is why
// additional-charge markaz were invisible and wing-restricted people saw
// the whole tehsil. RLS enforces the same rule server-side; this exists so
// the UI shows exactly what the person can actually act on.
function myMarkazIds(){
  return [currentProfile.markaz_id, ...(currentProfile.extra_markaz_ids || [])].filter(Boolean);
}
function scopeSchoolsQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("markaz_id", ids) : q.eq("markaz_id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "school_user"){
    q = q.eq("id", currentProfile.school_id);
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("markaz.tehsil", currentProfile.tehsil);
    if(currentProfile.wing_scope) q = q.eq("wing", currentProfile.wing_scope);
  }
  return q;
}
function scopeMarkazQuery(q){
  if(currentProfile.role === "aeo"){
    const ids = myMarkazIds();
    q = ids.length ? q.in("id", ids) : q.eq("id", "00000000-0000-0000-0000-000000000000");
  } else if(currentProfile.role === "tr" && currentProfile.tehsil){
    q = q.eq("tehsil", currentProfile.tehsil);
  }
  return q;
}

function sortSchoolsStandard(schools){
  const markazName = {};
  (cache.markaz || []).forEach(m => { markazName[m.id] = m.name || ""; });
  return (schools || []).slice().sort((a, b) =>
    (markazName[a.markaz_id] || "").localeCompare(markazName[b.markaz_id] || "")
    || (a.emis_code || "").localeCompare(b.emis_code || "")
  );
}

// Mirrors the database's fn_norm_invoice: upper-case, letters/digits only, letter O read as zero,
// so "DO445INV1" and "D0445INV1" are the same invoice. Returns "" when nothing is left.
function normInvoice(v){ return String(v ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/O/g, "0"); }
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

// Excel/CSV dates arrive as arbitrary text (8/1/2026, 2026-08-01, 01-Aug-2026,
// etc.) - normalize to ISO so the database accepts it. Returns "" if unparseable.
function normalizeDate(raw){
  if(!raw) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  const d = new Date(raw);
  if(isNaN(d.getTime())) return "";
  return d.toISOString().slice(0,10);
}

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  // Report Comparison is admin/super_admin/tr only.
  if(!["admin","super_admin","tr"].includes(profile.role)){
    alert("Report Comparison is only available to admins and Tehsil Representatives.");
    window.location.href = "dashboard.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();
function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  renderSidebarNav();
  renderPage();
}

async function loadRefData(){
  const [{ data: markaz }, { data: schools }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"),
    sb.from("schools").select("id,school_name,emis_code,markaz_id,wing").eq("active", true),
    sb.from("products").select("id,product_name").eq("active", true),
  ]);
  cache.markaz = markaz || [];
  cache.schools = sortSchoolsStandard(schools);
  // Milk first, then Biscuit - matches the convention used everywhere else
  // in the app (forms, tables, reports).
  cache.products = (products || []).sort((a, b) => {
    const am = a.product_name.toLowerCase().includes("milk") ? 0 : 1;
    const bm = b.product_name.toLowerCase().includes("milk") ? 0 : 1;
    return am - bm;
  });
}

/* ===================== PAGE ===================== */
async function renderPage(){
  const content = document.getElementById("content");
  const districts = [...new Set(cache.markaz.map(m => m.district))].filter(Boolean).sort();
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);

  content.innerHTML = `
    <div id="uploadMount"></div>
    <div id="uploadResult"></div>
    <div class="card">
      <h3>Company vs AEO comparison</h3>
      <p class="sub">Company-uploaded vendor invoice quantities against what AEOs reported receiving. Non-zero differences are flagged for follow-up.</p>
      <form id="filterForm" class="form-row">
        <div><label>From</label><input type="date" name="from" value="${daysAgoStr(30)}"/></div>
        <div><label>To</label><input type="date" name="to" value="${todayStr()}"/></div>
        <div><label>District</label><select id="jfDistrict"><option value="">All</option>${districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>
        <div><label>Tehsil</label><select id="jfTehsil"><option value="">All</option></select></div>
        <div><label>Wing</label><select id="jfWing"><option value="">All</option>${[...new Set(cache.schools.map(s => s.wing))].filter(w => w && w !== "SE").sort().map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>
        <div><label>Markaz</label><select id="jfMarkaz" disabled><option value="">All (pick a Wing to narrow)</option></select></div>
        <div><label>EMIS Code</label><input type="text" id="jfEmis" placeholder="Search one school"/></div>
        <div><label>Product</label><select name="product"><option value="">All products</option>${cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("")}</select></div>
        <div><label>Show only</label><select name="filter"><option value="all">All rows</option><option value="mismatch">Mismatches only</option><option value="flagged">Flagged for rectification</option></select></div>
        <div style="flex:1 1 260px;"><label>Search <span id="cmpSearchCount" class="sub"></span></label><input type="search" id="cmpSearch" placeholder="Type to search: school, markaz, invoice #, remarks…" autocomplete="off"/></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Apply filter</button></div>
      </form>
      <div class="actions-row" style="margin-top:12px;">
        <button class="btn-export" type="button" id="dlCmpAllBtn">Download Excel - all rows</button>
        <button class="btn-export" type="button" id="dlCmpIssuesBtn">Download Excel - issues only</button>
        <button class="btn-export" type="button" id="dlCompanyListBtn">Download Excel - company-provided list</button>
        ${["admin","super_admin"].includes(currentProfile.role) ? '<button class="btn-secondary" type="button" id="reconcileBtn">Fix invoice numbers from company data</button>' : ""}
      </div>
    </div>
    <div class="grid-4" id="statCards"></div>
    <div class="card">
      <div class="table-wrap"><table id="compTable"><thead><tr>
        <th>Delivery date</th><th>Markaz</th><th>EMIS</th><th>School</th><th>Product</th><th>Invoice #</th>
        <th>Company qty</th><th>AEO qty</th><th>Difference</th><th>Status</th><th>AEO Certification</th><th>Remarks / issue</th>
      </tr></thead><tbody><tr><td colspan="12" style="color:var(--ink-soft)">Loading…</td></tr></tbody></table></div>
    </div>
  `;

  if(isAdmin) renderUploadWizard(document.getElementById("uploadMount"));
  smpLiveSearch(document.getElementById("cmpSearch"), document.getElementById("content"), "#compTable", document.getElementById("cmpSearchCount"));
  document.getElementById("dlCmpAllBtn").addEventListener("click", () => downloadComparison(false));
  document.getElementById("dlCmpIssuesBtn").addEventListener("click", () => downloadComparison(true));
  document.getElementById("dlCompanyListBtn").addEventListener("click", downloadCompanyList);
  const rb = document.getElementById("reconcileBtn");
  if(rb) rb.addEventListener("click", async () => {
    rb.disabled = true;
    try{
      const { data: preview, error: pErr } = await sb.rpc("fn_reconcile_company_invoices", { p_invoice_ids: null, p_dry_run: true });
      if(pErr) throw pErr;
      const fixes = (preview || []).filter(r => r.action === "invoice_corrected");
      const c = reconSummary(preview);
      if(!fixes.length){
        toast(`Nothing to correct automatically.${c.skipped_ambiguous ? " " + c.skipped_ambiguous + " delivery(ies) have several possible AEO entries and need manual review." : ""}`);
        return;
      }
      if(!confirm(`The company data identifies ${c.invoice_corrected} AEO entr${c.invoice_corrected === 1 ? "y" : "ies"} with a wrong invoice number at the right school.\n\nCorrect the invoice number${c.invoice_corrected === 1 ? "" : "s"} now? Entries are never moved to another school. Each change is logged and can be undone.`)) return;
      const { data: done, error: aErr } = await sb.rpc("fn_reconcile_company_invoices", { p_invoice_ids: null, p_dry_run: false });
      if(aErr) throw aErr;
      const d = reconSummary(done);
      toast(`Corrected ${d.invoice_corrected} invoice number(s); matching entries certified automatically.`);
      await loadComparison(new FormData(document.getElementById("filterForm")));
    }catch(err){
      console.error("[SMP] reconcile failed:", err && err.message);
      toast("Could not reconcile: " + ((err && err.message) || "unknown error"), "bad");
    }finally{ rb.disabled = false; }
  });

  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz"), wEl = document.getElementById("jfWing");
  function refreshTehsil(){
    const d = dEl.value;
    const tehsils = [...new Set(cache.markaz.filter(m => !d || m.district === d).map(m => m.tehsil))].filter(Boolean).sort();
    tEl.innerHTML = `<option value="">All</option>` + tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  function refreshMarkaz(){
    const d = dEl.value, t = tEl.value, w = wEl.value;
    const markazIdsWithWing = w
      ? new Set(cache.schools.filter(s => s.wing === w).map(s => s.markaz_id))
      : null;
    const list = cache.markaz.filter(m =>
      (!d || m.district === d) && (!t || m.tehsil === t) && (!markazIdsWithWing || markazIdsWithWing.has(m.id)));
    mEl.disabled = !w;
    mEl.innerHTML = w
      ? `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")
      : `<option value="">All (pick a Wing to narrow)</option>`;
  }
  refreshTehsil(); refreshMarkaz();
  dEl.addEventListener("change", () => { refreshTehsil(); refreshMarkaz(); });
  tEl.addEventListener("change", refreshMarkaz);
  wEl.addEventListener("change", () => { mEl.value = ""; refreshMarkaz(); });

  document.getElementById("filterForm").addEventListener("submit", (e) => {
    e.preventDefault();
    loadComparison(new FormData(e.target));
  });

  await loadComparison(new FormData(document.getElementById("filterForm")));
}

/* ===================== UPLOAD WIZARD (admin only) ===================== */
// State carried across the wizard's steps.
let uploadState = { rows: null, headers: null, mapping: null, productId: null, manualInvoiceNumber: null, manualDate: null };

function renderUploadWizard(mount){
  uploadState = { rows: null, headers: null, mapping: null, productId: null, allowMulti: false, importing: false };
  const productOpts = cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");
  const tehsils = [...new Set(cache.markaz.map(m => m.tehsil))].filter(Boolean).sort();
  mount.innerHTML = `
    <div class="card">
      <h3>Upload company-provided data</h3>
      <p class="sub">Import a vendor delivery sheet (Excel/CSV) - a file can cover a whole week or month of deliveries with different dates and invoice numbers per row, so both are read from the file itself, not entered once for the whole batch. A file covering only one product still works with just the Product picker below; a mixed Milk-and-Biscuit file works too if you map a Product column in the next step.</p>
      <div class="form-row">
        <div><label>Tehsil to import *</label><select id="upTehsil"><option value="">Select…</option>${tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select></div>
        <div><label>Wing to import *</label><select id="upWing"><option value="">Select…</option><option value="M-EE">M-EE</option><option value="W-EE">W-EE</option></select></div>
        <div><label>Product (default if no Product column mapped below)</label><select id="upProduct"><option value="">Select…</option>${productOpts}</select></div>
        <div><label>File</label><input type="file" id="upFile" accept=".xlsx,.xls,.csv" disabled/></div>
        <div style="align-self:end;"><button class="btn-export" type="button" id="templateBtn">Download template</button></div>
      </div>
      <p class="sub" id="upScopeHint" style="color:var(--edit);">Pick the Tehsil and Wing you're importing first. Only rows whose school belongs to that Tehsil + Wing will be imported - every other EMIS code in the file (a different tehsil, wing, or one not in SMP at all) is skipped and listed as "out of scope", even if the file also contains other tehsils' data.</p>
      <div id="wizardStep2"></div>
    </div>
  `;

  const fileInput = document.getElementById("upFile");
  const scopeHint = document.getElementById("upScopeHint");
  function refreshScopeLock(){
    const ready = document.getElementById("upTehsil").value && document.getElementById("upWing").value;
    fileInput.disabled = !ready;
    scopeHint.style.display = ready ? "none" : "";
    // Changing scope invalidates any file/preview already loaded under the old scope - clear both
    // rather than leaving a stale preview on screen that no longer matches the pickers above it.
    fileInput.value = "";
    uploadState.rows = null;
    document.getElementById("wizardStep2").innerHTML = "";
  }
  document.getElementById("upTehsil").addEventListener("change", refreshScopeLock);
  document.getElementById("upWing").addEventListener("change", refreshScopeLock);

  document.getElementById("templateBtn").addEventListener("click", downloadTemplate);

  document.getElementById("upFile").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    uploadState.fileName = file.name;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
    if(!rows.length){ toast("File appears empty", "bad"); return; }
    uploadState.headers = rows[0].map(h => String(h).trim());
    uploadState.rows = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ""));
    renderColumnMapping();
  });
}

function downloadTemplate(){
  const wsData = [
    ["EMIS Code", "Product", "Quantity", "Invoice Number", "Delivery Date"],
    ["40074", "Milk", "50", "INV-1001", "2026-08-01"],
    ["40074", "Biscuits", "40", "INV-1001", "2026-08-01"],
    ["40074", "Milk", "50", "INV-1015", "2026-08-08"],
    ["40081", "Milk", "35", "INV-1002", "2026-08-01"],
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Deliveries");
  XLSX.writeFile(wb, "smp-company-data-template.xlsx");
}

function renderColumnMapping(){
  const step2 = document.getElementById("wizardStep2");
  const headerOpts = `<option value="">Select…</option>` + uploadState.headers.map((h, i) => `<option value="${i}">${esc(h)}</option>`).join("");
  step2.innerHTML = `
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
      <h3 style="font-size:14px;">Map columns</h3>
      <p class="sub">${uploadState.rows.length} rows detected. Every field is read per-row from the file - tell us which column is which. If the file lists a product per row (e.g. a mixed Milk-and-Biscuit sheet), map "Product column" too and it overrides the Product picked above for that row; leave it unmapped if the whole file is one product.</p>
      <div class="form-row">
        <div><label>EMIS code column *</label><select id="mapEmis">${headerOpts}</select></div>
        <div><label>Quantity column *</label><select id="mapQty">${headerOpts}</select></div>
        <div><label>Invoice # column *</label><select id="mapInvoice">${headerOpts}</select></div>
        <div><label>Delivery date column *</label><select id="mapDate">${headerOpts}</select></div>
        <div><label>Product column (optional)</label><select id="mapProduct">${headerOpts}</select></div>
      </div>
      <div class="actions-row"><button class="btn-secondary" type="button" id="previewBtn">Preview</button><button class="btn-primary" type="button" id="importBtn" disabled>Import</button><span class="sub" id="importHint" style="align-self:center;">Click Preview first, then Import to save.</span></div>
      <div id="wizardStep3"></div>
    </div>
  `;
  document.getElementById("previewBtn").addEventListener("click", renderPreview);
}

// Labels for the validation report returned by fn_validate_company_invoice_upload / fn_import_company_invoices.
const UPLOAD_STATUS_LABEL = {
  duplicate_in_file:    ["Duplicate Invoice Detected", "pill-bad"],
  duplicate_existing:   ["Duplicate Invoice Detected", "pill-bad"],
  conflict_in_file:     ["Invoice Number Conflict", "pill-bad"],
  conflict_existing:    ["Invoice Number Conflict", "pill-bad"],
  review_other_product: ["Needs review", "pill-warn"],
  invalid:              ["Invalid row", "pill-bad"],
};

async function renderPreview(){
  const defaultProductId = document.getElementById("upProduct").value;
  const emisCol = document.getElementById("mapEmis").value;
  const qtyCol = document.getElementById("mapQty").value;
  const invoiceCol = document.getElementById("mapInvoice").value;
  const dateCol = document.getElementById("mapDate").value;
  const productCol = document.getElementById("mapProduct").value;

  if(!defaultProductId && productCol === ""){ toast("Select a Product, or map a Product column", "bad"); return; }
  if(emisCol === "" || qtyCol === "" || invoiceCol === "" || dateCol === ""){
    toast("EMIS, Quantity, Invoice #, and Delivery Date columns are all required", "bad");
    return;
  }

  const upTehsil = document.getElementById("upTehsil").value;
  const upWing = document.getElementById("upWing").value;
  if(!upTehsil || !upWing){ toast("Pick the Tehsil and Wing you're importing first", "bad"); return; }
  const markazTehsil = Object.fromEntries(cache.markaz.map(m => [m.id, m.tehsil]));
  // Only schools inside the chosen Tehsil + Wing resolve here - anything else in the file (another
  // tehsil, another wing, or an EMIS SMP doesn't know) is skipped and listed, exactly as before.
  const inScopeSchools = cache.schools.filter(s => s.wing === upWing && markazTehsil[s.markaz_id] === upTehsil);
  const schoolByEmis = Object.fromEntries(inScopeSchools.map(s => [String(s.emis_code).trim(), s]));
  const anySchoolByEmis = Object.fromEntries(cache.schools.map(s => [String(s.emis_code).trim(), s]));
  function resolveProduct(cellText){
    if(!cellText) return defaultProductId ? cache.products.find(p => p.id === defaultProductId) : null;
    const t = String(cellText).trim().toLowerCase();
    return cache.products.find(p => t.includes(p.product_name.toLowerCase()) || p.product_name.toLowerCase().includes(t))
      || (defaultProductId ? cache.products.find(p => p.id === defaultProductId) : null);
  }

  // Blank/summary rows (e.g. "Total Packs Delivered" footers) have neither an EMIS code nor an invoice number -
  // they are not deliveries, so they are ignored rather than listed as errors.
  const ignoredRows = uploadState.rows.filter(r => String(r[emisCol] ?? "").trim() === "" && String(r[invoiceCol] ?? "").trim() === "").length;
  uploadState.ignoredRows = ignoredRows;
  const parsed = uploadState.rows.map((r, i) => ({ r, i })).filter(({ r }) => !(String(r[emisCol] ?? "").trim() === "" && String(r[invoiceCol] ?? "").trim() === "")).map(({ r, i }) => {
    const emis = String(r[emisCol] ?? "").trim();
    const qty = Number(r[qtyCol]);
    const invoiceNumber = String(r[invoiceCol] ?? "").trim();
    const deliveryDate = normalizeDate(String(r[dateCol] ?? "").trim());
    const school = schoolByEmis[emis];
    const outOfScope = !school && !!anySchoolByEmis[emis];
    const product = productCol !== "" ? resolveProduct(r[productCol]) : cache.products.find(p => p.id === defaultProductId);
    return { rowNum: i + 2, emis, qty, invoiceNumber, deliveryDate, school, product, outOfScope, valid: !!school && !!product && !isNaN(qty) && qty >= 0 && !!invoiceNumber && !!deliveryDate };
  });

  // Duplicate / conflict detection is NOT done here any more. Every in-scope row is sent to the database,
  // which checks it against all existing invoices AND against the rest of this file (rows far apart included).
  const sendable = parsed.filter(r => r.valid);
  const skippedRows = parsed.filter(r => !r.valid);
  uploadState.parsed = parsed;
  uploadState.sendMeta = sendable;                       // RPC row n  =>  sendable[n-1]
  uploadState.sendRows = sendable.map(r => ({
    invoice_number: r.invoiceNumber, invoice_date: r.deliveryDate, delivery_date: r.deliveryDate,
    product_id: r.product.id, school_id: r.school.id, quantity: String(r.qty),
  }));
  uploadState.report = null;

  const importBtn = document.getElementById("importBtn");
  const previewBtn = document.getElementById("previewBtn");
  importBtn.disabled = true;
  let report = { total: 0, new: 0, duplicates: 0, conflicts: 0, needs_review: 0, invalid: 0, can_import: false, issues: [] };
  let checkError = null;
  if(sendable.length){
    previewBtn.disabled = true; previewBtn.textContent = "Checking…";
    try{
      const { data, error } = await sb.rpc("fn_validate_company_invoice_upload", { p_rows: uploadState.sendRows, p_allow_multi_product: !!uploadState.allowMulti });
      if(error) throw error;
      report = data;
    }catch(err){ checkError = (err && err.message) || "Unknown error"; }
    previewBtn.disabled = false; previewBtn.textContent = "Preview";
  }
  // Fail closed: if the database check did not complete, nothing can be imported.
  uploadState.report = checkError ? null : report;

  const fileRow = n => (uploadState.sendMeta[n - 1] || {}).rowNum || "—";
  const skipReason = r => r.outOfScope ? `EMIS not in ${esc(upTehsil)} / ${esc(upWing)} - out of scope for this import`
    : !r.school ? "EMIS not found in SMP" : !r.product ? "Product not recognized" : "Missing quantity, invoice #, or date";

  const step3 = document.getElementById("wizardStep3");
  step3.innerHTML = `
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
      ${checkError ? `<p class="err">Could not check the file against the database: ${esc(checkError)}. Nothing can be imported until this check works.</p>` : ""}
      <div class="grid-4">
        <div class="stat"><div class="n">${parsed.length}</div><div class="l">Total records detected</div></div>
        <div class="stat"><div class="n">${report.new}</div><div class="l">Valid new invoices</div></div>
        <div class="stat"><div class="n">${report.duplicates}</div><div class="l">Exact duplicates</div></div>
        <div class="stat"><div class="n">${report.conflicts}</div><div class="l">Invoice-number conflicts</div></div>
        <div class="stat"><div class="n">${report.needs_review}</div><div class="l">Need review (number used for another product)</div></div>
        <div class="stat"><div class="n">${skippedRows.length}</div><div class="l">Outside ${esc(upTehsil)} / ${esc(upWing)} or invalid (skipped)</div></div>
      </div>
      ${report.issues.length ? `
        <p class="sub" style="margin-top:12px;"><strong>Nothing will be imported while any of these remain.</strong> The import is all-or-nothing - fix or remove these rows in the file and upload again.</p>
        <div class="table-wrap"><table><thead><tr><th>Row</th><th>Invoice #</th><th>Date</th><th>Product</th><th>Qty</th><th>EMIS</th><th>Result</th><th>Details</th></tr></thead><tbody>
          ${report.issues.map(i => { const [lbl, cls] = UPLOAD_STATUS_LABEL[i.status] || [i.status, "pill-warn"]; return `<tr>
            <td>${esc(fileRow(i.row))}</td><td>${esc(i.invoice_number)}</td><td>${esc(i.invoice_date)}</td><td>${esc(i.product)}</td><td>${esc(i.quantity)}</td><td>${esc(i.school_emis)}</td>
            <td><span class="pill ${cls}">${esc(lbl)}</span></td><td>${esc(i.detail)}</td></tr>`; }).join("")}
        </tbody></table></div>
      ` : ""}
      ${(report.needs_review > 0 || uploadState.allowMulti) ? `
        <p class="sub" style="margin-top:12px;"><label><input type="checkbox" id="allowMulti" ${uploadState.allowMulti ? "checked" : ""}/> This is a genuine multi-product invoice - allow invoice numbers that already exist under another product</label></p>` : ""}
      ${skippedRows.length ? `
        <p class="sub" style="margin-top:12px;">Rows skipped (not part of this import):</p>
        <div class="table-wrap"><table><thead><tr><th>Row</th><th>EMIS</th><th>Product</th><th>Qty</th><th>Invoice #</th><th>Date</th><th>Reason</th></tr></thead><tbody>
          ${skippedRows.map(r => `<tr><td>${r.rowNum}</td><td>${esc(r.emis)}</td><td>${esc(r.product?.product_name || "—")}</td><td>${esc(r.qty)}</td><td>${esc(r.invoiceNumber)}</td><td>${esc(r.deliveryDate)}</td><td>${skipReason(r)}</td></tr>`).join("")}
        </tbody></table></div>
      ` : ""}
      <p class="sub" style="margin-top:12px; color:var(--edit);"><strong>Not saved yet.</strong> Preview only checks the file. Nothing is written to the database until you click Import.${uploadState.ignoredRows ? ` (${uploadState.ignoredRows} blank/summary row(s) ignored.)` : ""}</p>
    </div>
  `;
  const multiBox = document.getElementById("allowMulti");
  if(multiBox) multiBox.addEventListener("change", () => { uploadState.allowMulti = multiBox.checked; renderPreview(); });

  // The Import button lives next to Preview (top of the wizard) so nobody has to scroll to find it.
  const ok = !!(uploadState.report && uploadState.report.can_import);
  importBtn.disabled = !ok;
  importBtn.textContent = `Import ${sendable.length} rows`;
  importBtn.onclick = runImport;
  document.getElementById("importHint").textContent = ok ? "All rows are new - nothing is saved until you click Import."
    : checkError ? "The database check failed - nothing can be imported."
    : sendable.length ? "Import is blocked until every row listed above is fixed or removed."
    : "No valid rows to import - see the skipped list below.";
}

function renderUploadResult({ status, fileName, total, valid, skipped, invoices, expectedItems, verifiedItems, failures, certified, startedAt, finishedAt }){
  const mount = document.getElementById("uploadResult");
  if(!mount) return;
  const label = { uploading: "Uploading… database operation in progress", saved: "Saved successfully", partial: "Partially saved", failed: "Failed - nothing was imported" }[status];
  const pill = status === "saved" ? "pill-ok" : status === "uploading" ? "pill-warn" : "pill-bad";
  const rejectedRows = failures.reduce((n, f) => n + f.rows, 0);
  mount.innerHTML = `
    <div class="card">
      <h3>Company upload result <span class="pill ${pill}">${esc(label)}</span></h3>
      <p class="sub">Source: Company${fileName ? ` · File: ${esc(fileName)}` : ""} · Started ${esc(startedAt.toLocaleString())}${finishedAt ? ` · Finished ${esc(finishedAt.toLocaleString())}` : ""}${status === "uploading" ? "" : " · Saved counts below are re-read from Supabase."}</p>
      <div class="grid-4">
        <div class="stat"><div class="n">${total}</div><div class="l">Records in file</div></div>
        <div class="stat"><div class="n">${valid}</div><div class="l">Sent to database</div></div>
        <div class="stat"><div class="n">${status === "uploading" ? "…" : verifiedItems}</div><div class="l">Confirmed saved in Supabase (of ${expectedItems})</div></div>
        <div class="stat"><div class="n">${status === "uploading" ? "…" : rejectedRows}</div><div class="l">Rejected / failed records</div></div>
        <div class="stat"><div class="n">${skipped.duplicates}</div><div class="l">Rejected - duplicate</div></div>
        <div class="stat"><div class="n">${skipped.conflicts}</div><div class="l">Rejected - invoice-number conflict</div></div>
        <div class="stat"><div class="n">${skipped.other}</div><div class="l">Skipped - out of scope / invalid</div></div>
        <div class="stat"><div class="n">${status === "uploading" ? "…" : certified === null ? "Next" : certified}</div><div class="l">${certified === null ? "Auto-certification starts after import" : "Auto-certified against AEO receipts"}</div></div>
      </div>
      <p class="sub" style="margin-top:8px;">Invoices created: ${status === "uploading" ? "…" : invoices}. Records not auto-certified stay pending until the AEO's matching receipt is saved.</p>
      ${failures.length ? `<div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>Rows</th><th>Problem</th></tr></thead><tbody>${failures.map(f => `<tr><td>${esc(f.invoice)}</td><td>${f.rows}</td><td class="err">${esc(f.message)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div>`;
}

async function runImport(){
  if(uploadState.importing) return;                      // second click / double submit
  if(!uploadState.report || !uploadState.report.can_import){ toast("Run Preview first - the import is blocked until the file passes validation.", "bad"); return; }
  uploadState.importing = true;
  const btn = document.getElementById("importBtn"), pbtn = document.getElementById("previewBtn");
  btn.disabled = true; pbtn.disabled = true;
  btn.textContent = "Importing…";
  const sendRows = uploadState.sendRows, sendMeta = uploadState.sendMeta;
  const fileName = uploadState.fileName || "";
  const startedAt = new Date();
  const base = { fileName, total: uploadState.parsed.length, valid: sendRows.length, skipped: { duplicates: 0, conflicts: 0, other: uploadState.parsed.filter(r => !r.valid).length }, startedAt, invoices: 0, expectedItems: sendRows.length, verifiedItems: 0, failures: [], certified: 0 };
  renderUploadResult({ ...base, status: "uploading" });

  let res = null, rpcErr = null;
  try{
    // One database transaction: every invoice and line item is saved, or none is.
    const { data, error } = await sb.rpc("fn_import_company_invoices", { p_rows: sendRows, p_allow_multi_product: !!uploadState.allowMulti, p_auto_certify: false });
    if(error) throw error;
    res = data;
  }catch(err){ rpcErr = (err && err.message) || "Unknown database error"; }

  uploadState.importing = false;
  pbtn.disabled = false;

  if(rpcErr || !res || !res.imported){
    // Nothing was written. Show exactly why (the data may also have changed since Preview).
    const failures = rpcErr ? [{ invoice: "(upload)", rows: sendRows.length, message: rpcErr + " - nothing was imported." }]
      : (res.issues || []).map(i => ({ invoice: i.invoice_number || "—", rows: 1,
          message: `File row ${(sendMeta[i.row - 1] || {}).rowNum || "—"}: ${(UPLOAD_STATUS_LABEL[i.status] || [i.status])[0]} - ${i.detail || ""}` }));
    const skipped = res ? { duplicates: res.duplicates || 0, conflicts: res.conflicts || 0, other: base.skipped.other } : base.skipped;
    renderUploadResult({ ...base, skipped, status: "failed", failures, certified: 0, finishedAt: new Date() });
    toast("Upload rejected - nothing was imported. See the result panel.", "bad");
    btn.textContent = "Import"; btn.disabled = true;
    return;
  }

  // Confirm what is really in the database: re-read the line items for the invoices that were created.
  const created = res.created || [];
  const createdInvoiceIds = created.map(c => c.invoice_id);
  let verifiedItems = 0; const failures = [];
  try{
    for(let i = 0; i < createdInvoiceIds.length; i += 100){
      const chunk = createdInvoiceIds.slice(i, i + 100);
      const { count, error } = await sb.from("company_invoice_items").select("id", { count: "exact", head: true }).in("invoice_id", chunk);
      if(error) throw error;
      verifiedItems += count || 0;
    }
  }catch(err){
    failures.push({ invoice: "(verification)", rows: 0, message: "Saved, but confirmation read-back failed: " + ((err && err.message) || "unknown error") });
  }
  const status = (verifiedItems === sendRows.length && !failures.length) ? "saved" : verifiedItems === 0 ? "failed" : "partial";
  renderUploadResult({ ...base, status, invoices: createdInvoiceIds.length, verifiedItems, failures, certified: null, finishedAt: new Date() });
  toast(status === "saved" ? `Saved: ${verifiedItems} records confirmed in Supabase` : "Saved, but the confirmation count differs - see result panel", status === "saved" ? "ok" : "bad");

  // Import is finished and confirmed - only now does auto-certification start, with its own progress popup.
  let certified = 0;
  if(created.length){
    const createdGroups = created.map(c => ({ id: c.invoice_id, invoiceNumber: c.invoice_number,
      schools: (c.school_ids || []).map(id => cache.schools.find(s => s.id === id)).filter(Boolean) }));
    // Step 1: use the company's invoice -> school (EMIS) mapping to fix AEO entries that carry a wrong invoice number
    // or sit under the wrong school. Only entries users already added are touched; everything else stays flagged.
    const recon = { rows: [], error: null };
    const { data: reconRows, error: reconErr } = await sb.rpc("fn_reconcile_company_invoices", { p_invoice_ids: createdInvoiceIds, p_dry_run: false });
    if(reconErr){ recon.error = reconErr.message; console.error("[SMP] reconciliation failed:", reconErr.message); }
    else recon.rows = reconRows || [];
    // Step 2: auto-certification (with date alignment) with its school-wise progress popup.
    const cert = await runAutoCertification(createdGroups, recon);
    certified = cert.certified;
  }
  renderUploadResult({ ...base, status, invoices: createdInvoiceIds.length, verifiedItems, failures, certified, finishedAt: new Date() });

  await loadComparison(new FormData(document.getElementById("filterForm")));
  renderUploadWizard(document.getElementById("uploadMount"));
}

// Plain-language summary + table of what the invoice/EMIS reconciliation did (or would do).
function reconSummary(rows){
  const c = { invoice_corrected: 0, school_corrected: 0, skipped_ambiguous: 0, skipped_blocked: 0 };
  (rows || []).forEach(r => { if(r.action in c) c[r.action]++; });
  return c;
}
function reconTableHtml(rows){
  const nameOf = id => { const sc = cache.schools.find(x => x.id === id); return sc ? `${esc(sc.emis_code)} - ${esc(sc.school_name)}` : "-"; };
  const label = { invoice_corrected: "Invoice number corrected",
    skipped_ambiguous: "Needs manual review - several possible entries", skipped_blocked: "Not changed - blocked" };
  return `<div class="table-wrap" style="max-height:220px;overflow:auto;"><table><thead><tr><th>School</th><th>AEO entered</th><th>Company invoice</th><th>What happened</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${nameOf(r.school_id)}</td>
      <td>${esc(r.old_invoice_number || "-")}</td><td>${esc(r.company_invoice_number || "")}</td>
      <td>${esc(label[r.action] || r.action)}${r.action === "skipped_blocked" ? `<br><span class="sub">${esc(r.note || "")}</span>` : ""}</td></tr>`).join("")}
  </tbody></table></div>`;
}

// Auto-certification after an import: for every school on the newly imported invoices, certify it when the
// AEO's own receipt already matches (same invoice, product and quantity). Shows a popup with school-wise
// progress. Schools with no matching AEO receipt yet stay pending and certify themselves later, when the AEO
// saves a matching receipt.
async function runAutoCertification(groups, recon){
  const total = groups.reduce((n, g) => n + g.schools.length, 0);
  const counts = { done: 0, certified: 0, pending: 0, flagged: 0, failed: 0 };
  const ov = document.createElement("div");
  ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
  ov.style.cssText = "position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;";
  ov.innerHTML = `
    <div class="card" style="width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;margin:0;">
      <h3 id="acTitle" style="margin-bottom:4px;">Auto-certification in progress</h3>
      <p class="sub" id="acSub">Import finished. Now checking each school's imported invoices against what the AEOs already received.</p>
      ${(() => {
        if(!recon) return "";
        if(recon.error) return `<p class="sub err">Invoice-number matching could not run: ${esc(recon.error)}. Certification continues without it.</p>`;
        const c = reconSummary(recon.rows);
        const lines = [];
        if(c.invoice_corrected) lines.push(`${c.invoice_corrected} AEO entr${c.invoice_corrected === 1 ? "y" : "ies"} had a wrong invoice number - corrected from company data`);
        if(c.skipped_ambiguous) lines.push(`${c.skipped_ambiguous} company deliver${c.skipped_ambiguous === 1 ? "y has" : "ies have"} several possible AEO entries - left for manual review`);
        if(c.skipped_blocked) lines.push(`${c.skipped_blocked} correction(s) blocked by the duplicate-invoice rule - left flagged`);
        if(!lines.length) return `<p class="sub">Invoice numbers checked against EMIS codes: no AEO entry needed correcting.</p>`;
        return `<p class="sub"><b>Step 1 - invoice numbers matched to EMIS codes:</b> ${lines.join("; ")}.</p>${reconTableHtml(recon.rows)}`;
      })()}
      <div style="height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0;"><div id="acBar" style="height:100%;width:0;background:var(--ok-fg, #2e7d32);transition:width .2s;"></div></div>
      <p class="sub" id="acCount" style="margin:0 0 8px;">0 of ${total} schools</p>
      <div class="grid-4" style="margin-bottom:8px;">
        <div class="stat"><div class="n" id="acCert">0</div><div class="l">Certified automatically</div></div>
        <div class="stat"><div class="n" id="acPend">0</div><div class="l">Pending - no matching AEO receipt yet</div></div>
        <div class="stat"><div class="n" id="acFlag">0</div><div class="l">Flagged - invoice # differs</div></div>
        <div class="stat"><div class="n" id="acFail">0</div><div class="l">Failed</div></div>
      </div>
      <div class="table-wrap" id="acScroll" style="overflow:auto;flex:1;min-height:120px;"><table><thead><tr><th>EMIS</th><th>School</th><th>Invoice #</th><th>Result</th></tr></thead><tbody id="acBody"></tbody></table></div>
      <div class="actions-row" style="margin-top:10px;"><button class="btn-primary" type="button" id="acClose" disabled>Please wait…</button></div>
    </div>`;
  document.body.appendChild(ov);
  const $ = id => ov.querySelector("#" + id);
  function refresh(){
    $("acBar").style.width = (total ? Math.round(counts.done / total * 100) : 100) + "%";
    $("acCount").textContent = `${counts.done} of ${total} schools`;
    $("acCert").textContent = counts.certified; $("acPend").textContent = counts.pending;
    $("acFlag").textContent = counts.flagged; $("acFail").textContent = counts.failed;
  }
  const label = { certified: '<span class="pill pill-ok">✓ Certified automatically</span>',
    pending: '<span class="pill pill-warn">Pending - no matching AEO receipt yet</span>',
    flagged: '<span class="pill pill-warn">⚠ Invoice # differs - needs review</span>' };
  const CHUNK = 5;
  for(let i = 0; i < groups.length; i += CHUNK){
    const chunk = groups.slice(i, i + CHUNK);
    const errors = {};
    await Promise.all(chunk.map(async g => {
      const { error } = await sb.rpc("fn_auto_certify_for_invoice", { p_invoice_id: g.id });
      if(error){ errors[g.id] = error.message || "Certification failed"; console.error("[SMP] auto-certify failed for invoice", g.invoiceNumber, error.message); }
    }));
    // Read the real outcome back for every school of these invoices.
    const { data: items, error: readErr } = await sb.from("company_invoice_items")
      .select("invoice_id, school_id, aeo_verification_status").in("invoice_id", chunk.map(g => g.id));
    const statusByKey = {};
    (items || []).forEach(it => { statusByKey[it.invoice_id + "|" + it.school_id] = it.aeo_verification_status; });
    let html = "";
    chunk.forEach(g => {
      g.schools.forEach(sc => {
        let res;
        if(errors[g.id] || readErr){ counts.failed++; res = `<span class="pill pill-bad" title="${esc(errors[g.id] || readErr.message)}">Failed - ${esc(errors[g.id] || readErr.message)}</span>`; }
        else {
          const st = statusByKey[g.id + "|" + sc.id];
          if(st === "received"){ counts.certified++; res = label.certified; }
          else if(st === "flagged_mismatch"){ counts.flagged++; res = label.flagged; }
          else { counts.pending++; res = label.pending; }
        }
        counts.done++;
        html += `<tr><td>${esc(sc.emis_code)}</td><td>${esc(sc.school_name)}</td><td>${esc(g.invoiceNumber)}</td><td>${res}</td></tr>`;
      });
    });
    $("acBody").insertAdjacentHTML("beforeend", html);
    refresh();
    const sc = $("acScroll"); sc.scrollTop = sc.scrollHeight;
  }

  $("acTitle").textContent = counts.failed ? "Auto-certification finished with errors" : "Auto-certification complete";
  $("acSub").textContent = `${counts.certified} school(s) certified automatically. ${counts.pending} pending - they certify automatically as soon as the AEO saves a matching receipt.`
    + (counts.flagged ? ` ${counts.flagged} flagged for review.` : "") + (counts.failed ? ` ${counts.failed} failed - see the list.` : "");
  const closeBtn = $("acClose");
  closeBtn.disabled = false; closeBtn.textContent = "Close";
  await new Promise(resolve => closeBtn.addEventListener("click", () => { ov.remove(); resolve(); }, { once: true }));
  console.info("[SMP] auto-certification", counts);
  return counts;
}

// Excel export of exactly what the filters currently show (period, district/tehsil/wing/markaz/EMIS),
// with a plain-language remark on every row that has a problem.
function downloadComparison(issuesOnly){
  const all = window.lastComparisonRows || [];
  const isIssue = r => r.status !== "Matched" || !!r.remarks;
  const rows = issuesOnly ? all.filter(isIssue) : all;
  if(!rows.length){ toast(issuesOnly ? "No issues found for the current filters and period." : "Nothing to download - apply the filters first.", "bad"); return; }
  try{
    const markazName = id => cache.markaz.find(m => m.id === id);
    const header = ["Delivery / receipt date","Wing","Tehsil","Markaz","EMIS Code","School","Product",
      "Company Invoice #","AEO Invoice #","Company Invoice Date","Company Qty","AEO Qty","Difference",
      "Status","AEO Certification","Remarks / Issue"];
    const dmy = d => { if(!d) return ""; const p = String(d).split("-"); return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : String(d); };
    const body = rows.map(r => {
      const m = markazName(r.school?.markaz_id);
      return [dmy(r.delivery_date), r.school?.wing || "", m?.tehsil || "", m?.name || "", r.school?.emis_code || "", r.school?.school_name || "",
        r.product?.product_name || "", r.company_invoice_number || "", r.aeo_invoice_number || "", dmy(r.invoice_date),
        Number(r.company_qty) || 0, Number(r.aeo_qty) || 0, Number(r.difference) || 0,
        r.status || "", r.aeo_verification_status || "", r.remarks || (r.status === "Matched" ? "" : r.status)];
    });
    const count = (f) => all.filter(f).length;
    const summary = [
      ["Period", `${dmy(window.lastComparisonPeriod?.from)} to ${dmy(window.lastComparisonPeriod?.to)}`],
      ["Total rows (current filters)", all.length],
      ["Matched, no issue", count(r => !isIssue(r))],
      ["Matched, but invoice number written differently", count(r => r.status === "Matched" && r.remarks)],
      ["Short received (AEO less than company)", count(r => r.status === "Short Received")],
      ["Excess received (AEO more than company)", count(r => r.status === "Excess Received")],
      ["Company provided, AEO did not enter", count(r => r.status === "Company provided, AEO did not enter")],
      ["AEO entered, company did not provide", count(r => r.status === "AEO entered, company did not provide")],
    ];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
    ws["!cols"] = [14,8,14,20,12,34,12,18,18,14,11,9,11,34,18,80].map(w => ({ wch: w }));
    ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:body.length,c:header.length-1} }) };
    XLSX.utils.book_append_sheet(wb, ws, issuesOnly ? "Issues" : "Comparison");
    const ss = XLSX.utils.aoa_to_sheet([["Company vs AEO - summary"], [], ...summary]);
    ss["!cols"] = [{ wch: 52 }, { wch: 28 }];
    XLSX.utils.book_append_sheet(wb, ss, "Summary");
    const p = window.lastComparisonPeriod || {};
    XLSX.writeFile(wb, `company-vs-aeo_${issuesOnly ? "issues" : "all"}_${p.from || "all"}_to_${p.to || "all"}.xlsx`);
    toast(`Downloaded ${rows.length} row(s).`);
  }catch(err){
    console.error("[SMP] comparison download failed:", err && err.message);
    toast(`Download failed: ${(err && err.message) || "unknown error"}`, "bad");
  }
}

// Excel export of the company-provided (uploaded) delivery list for the period chosen above - one row per
// school per invoice, exactly as stored in Supabase.
async function downloadCompanyList(){
  const fd = new FormData(document.getElementById("filterForm"));
  const from = fd.get("from"), to = fd.get("to");
  try{
    const { data, error } = await smpFetchAll(() => sb.from("company_invoice_items")
      .select("id, quantity, unit, aeo_verification_status, school_id, product_id, company_invoices!inner(invoice_number, invoice_date, delivery_date, status)")
      .eq("company_invoices.status", "active")
      .gte("company_invoices.delivery_date", from).lte("company_invoices.delivery_date", to)
      .order("id"));
    if(error) throw error;
    if(!data.length){ toast("No company-provided data in this period.", "bad"); return; }
    const schoolById = Object.fromEntries(cache.schools.map(x => [x.id, x]));
    const productById = Object.fromEntries(cache.products.map(x => [x.id, x]));
    const markazById = Object.fromEntries(cache.markaz.map(x => [x.id, x]));
    const dmy = d => d ? new Date(d).toLocaleDateString("en-GB") : "";
    const rows = data.map(r => {
      const sc = schoolById[r.school_id];
      return { d: r.company_invoices.delivery_date, row: [
        dmy(r.company_invoices.delivery_date), dmy(r.company_invoices.invoice_date), r.company_invoices.invoice_number || "",
        sc?.emis_code || "", sc?.school_name || "", markazById[sc?.markaz_id]?.name || "", markazById[sc?.markaz_id]?.tehsil || "", sc?.wing || "",
        productById[r.product_id]?.product_name || "", Number(r.quantity) || 0, r.unit || "", r.aeo_verification_status || "pending"] };
    }).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0).map(x => x.row);
    const header = ["Delivery date","Invoice date","Invoice #","EMIS","School","Markaz","Tehsil","Wing","Product","Quantity","Unit","AEO certification"];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...rows]), "Company list");
    XLSX.writeFile(wb, `company-provided-list_${from}_to_${to}.xlsx`);
  }catch(err){
    console.error("[SMP] company list download failed:", err && err.message);
    toast(`Download failed: ${(err && err.message) || "unknown error"}`, "bad");
  }
}

async function loadComparison(fd){
  const from = fd.get("from"), to = fd.get("to"), filter = fd.get("filter"), selProduct = fd.get("product") || "";
  const dEl = document.getElementById("jfDistrict"), tEl = document.getElementById("jfTehsil"), mEl = document.getElementById("jfMarkaz"), wEl = document.getElementById("jfWing");
  const selDistrict = dEl.value, selTehsil = tEl.value, selMarkazId = mEl.value, selWing = wEl.value;
  const selEmis = (document.getElementById("jfEmis")?.value || "").trim();
  const tbody = document.querySelector("#compTable tbody");
  tbody.innerHTML = `<tr><td colspan="12" style="color:var(--ink-soft)">Loading…</td></tr>`;

  let data = [];
  try{
    for(let start = 0; ; start += 1000){
      let q = sb.from("v_company_vs_aeo_comparison").select("*")
        .gte("delivery_date", from).lte("delivery_date", to);
      if(selProduct) q = q.eq("product_id", selProduct);
      const { data: page, error } = await q
        .order("delivery_date", { ascending: false }).order("school_id").order("product_id").order("invoice_number")
        .range(start, start + 999);
      if(error) throw error;
      data.push(...(page || []));
      if(!page || page.length < 1000) break;
    }
  }catch(error){ tbody.innerHTML = `<tr><td colspan="12" class="err">${esc(error.message || "Could not load the comparison")}</td></tr>`; return; }

  const schoolById = Object.fromEntries(cache.schools.map(s => [s.id, s]));
  const productById = Object.fromEntries(cache.products.map(p => [p.id, p]));
  const markazById = Object.fromEntries(cache.markaz.map(m => [m.id, m]));

  let rows = (data || []).map(r => ({ ...r, school: schoolById[r.school_id], product: productById[r.product_id] }));
  // An EMIS code names exactly one school, so it overrides the geography
  // and wing pickers rather than intersecting with them.
  if(selEmis){
    rows = rows.filter(r => (r.school?.emis_code || "").includes(selEmis));
  } else {
    if(selMarkazId) rows = rows.filter(r => r.school?.markaz_id === selMarkazId);
    else if(selTehsil) rows = rows.filter(r => markazById[r.school?.markaz_id]?.tehsil === selTehsil);
    else if(selDistrict) rows = rows.filter(r => markazById[r.school?.markaz_id]?.district === selDistrict);
    if(selWing) rows = rows.filter(r => r.school?.wing === selWing);
  }
  if(filter === "mismatch") rows = rows.filter(r => Number(r.difference) !== 0 || r.remarks);
  if(filter === "flagged") rows = rows.filter(r => r.aeo_flag);

  // date desc, EMIS asc within date - same convention as Inventory Received.
  rows.sort((a, b) => {
    if(a.delivery_date !== b.delivery_date) return a.delivery_date < b.delivery_date ? 1 : -1;
    return (a.school?.emis_code || "").localeCompare(b.school?.emis_code || "");
  });

  window.lastComparisonRows = rows;
  window.lastComparisonPeriod = { from, to };
  const matched = rows.filter(r => r.status === "Matched").length;
  const aeoOnly = rows.filter(r => r.status === "AEO entered, company did not provide").length;
  const companyOnly = rows.filter(r => r.status === "Company provided, AEO did not enter").length;
  const qtyMismatch = rows.filter(r => r.status === "Short Received" || r.status === "Excess Received").length;
  document.getElementById("statCards").innerHTML = `
    <div class="stat"><div class="n">${rows.length}</div><div class="l">Total rows</div></div>
    <div class="stat"><div class="n">${matched}</div><div class="l">Matching</div></div>
    <div class="stat"><div class="n">${aeoOnly}</div><div class="l">AEO entered, company didn't</div></div>
    <div class="stat"><div class="n">${companyOnly}</div><div class="l">Company provided, AEO didn't</div></div>
    <div class="stat"><div class="n">${rows.filter(r => r.aeo_flag).length}</div><div class="l">⚠ Flagged for rectification (invoice entered twice)</div></div>
  `;

  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="12" style="color:var(--ink-soft)">No data for this period.</td></tr>`; return; }

  const pillFor = (status) => {
    if(status === "Matched") return '<span class="pill pill-ok">Matched</span>';
    if(status === "AEO entered, company did not provide") return '<span class="pill pill-warn">AEO only</span>';
    if(status === "Company provided, AEO did not enter") return '<span class="pill pill-warn">Company only</span>';
    return '<span class="pill pill-bad">' + esc(status) + '</span>'; // Short/Excess Received
  };

  // aeo_verification_status is set automatically by the database when an AEO receipt matches the
  // company invoice (manual certification was removed) - only meaningful on rows where company data exists.
  const certPillFor = (status) => {
    if(!status) return "—";
    if(status === "flagged_mismatch") return '<span class="pill pill-warn">⚠ Qty matches other invoice</span>';
    if(status.includes("not_received")) return '<span class="pill pill-bad">Not received</span>';
    if(status.includes("received")) return '<span class="pill pill-ok">Received</span>';
    return '<span class="pill pill-warn">Pending</span>';
  };

  tbody.innerHTML = rows.map(r => {
    const diff = Number(r.difference);
    return `<tr>
      <td>${fmtDate(r.delivery_date)}</td>
      <td>${esc(cache.markaz.find(m => m.id === r.school?.markaz_id)?.name || "—")}</td>
      <td>${esc(r.school?.emis_code)}</td>
      <td>${esc(r.school?.school_name)}</td>
      <td>${esc(r.product?.product_name)}</td>
      <td>${esc(r.invoice_number) || "—"}</td>
      <td>${fmt(r.company_qty)}</td>
      <td>${fmt(r.aeo_qty)}</td>
      <td>${diff > 0 ? "+" : ""}${fmt(diff)}</td>
      <td>${pillFor(r.status)}</td>
      <td>${certPillFor(r.aeo_verification_status)}</td>
      <td style="min-width:220px; font-size:12px;">${r.aeo_flag ? '<span class="pill pill-warn">⚠ Flagged: ' + (r.aeo_flag.includes("wrong_invoice") ? "invoice belongs to another school" : r.aeo_flag.includes("other_school") ? "invoice also used at another school" : r.aeo_flag.includes("duplicate") ? "duplicate entry" : "different details on file") + '</span><br>' : ""}${esc(r.remarks) || "—"}</td>
    </tr>`;
  }).join("");
}
</script>
