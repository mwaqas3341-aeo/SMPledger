name: Portal sync to Supabase

# Pulls the school-detail tables for the schools returned by Supabase (fn_portal_scope) and writes them
# straight into the Supabase project (portal_receipts / portal_consumption). Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of parallel jobs (each takes every Nth school).
        required: false
        default: "3"
        type: string
      only_shard:
        description: Run just one shard, e.g. 3/3 (leave blank to run all shards).
        required: false
        default: ""
        type: string
      delay:
        description: Seconds to wait between school pages.
        required: false
        default: "2.0"
        type: string
  schedule:
    - cron: "30 15 * * *"   # 20:30 Pakistan time, daily

concurrency:
  group: smp-to-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      total: ${{ steps.m.outputs.total }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          SHARDS: ${{ inputs.shards || '3' }}
          ONLY_SHARD: ${{ inputs.only_shard }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 portal-sync/scripts/fetch_scope.py "$RUNNER_TEMP/codes.txt"
          TOTAL=$(wc -l < "$RUNNER_TEMP/codes.txt")
          N=${SHARDS}; [ "${N}" -gt 6 ] && N=6; [ "${N}" -lt 1 ] && N=1
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          python3 -c "import json,sys; n=int(sys.argv[1]); only=sys.argv[2].strip(); print('matrix='+json.dumps({'shard':([only] if only else [f'{i}/{n}' for i in range(1,n+1)])}))" "${N}" "${ONLY_SHARD}" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1     # one portal login at a time: the portal drops sessions when the same account signs in twice
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: portal-sync
    env:
      SMP_USERNAME: ${{ secrets.SMP_USERNAME }}
      SMP_PASSWORD: ${{ secrets.SMP_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DELAY_INPUT: ${{ inputs.delay || '2.0' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          for v in SMP_USERNAME SMP_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing."; exit 1; fi
          done
      - name: Set up scratch directory
        run: echo "STAGING_DIR=$RUNNER_TEMP/smp-exports" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('portal-sync/requirements.txt', 'portal-sync/scripts/setup_workflow_env.py') }}
      - uses: actions/cache@v5
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('portal-sync/requirements.txt') }}
      - run: python scripts/setup_workflow_env.py
      - if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        run: python -m playwright install --with-deps chromium
      - name: Get the school list from Supabase
        run: python scripts/fetch_scope.py "$RUNNER_TEMP/codes.txt"
      - name: Extract this shard
        run: |
          # Sign-in is retried: the portal sometimes bounces a fresh login back to the login page.
          for attempt in 1 2 3; do
            set +e
            python -m smp_extractor --non-interactive --headless --codes-file "$RUNNER_TEMP/codes.txt" \
              --shard "${{ matrix.shard }}" --output-dir "${STAGING_DIR}" --delay "${DELAY_INPUT}"
            STATUS=$?
            set -e
            if [ "${STATUS}" -eq 0 ] || [ "${STATUS}" -eq 1 ]; then break; fi
            echo "::warning::Attempt ${attempt} stopped with exit code ${STATUS}."
            [ "${attempt}" -lt 3 ] && sleep 60
          done
          echo "EXTRACT_STATUS=${STATUS}" >> "$GITHUB_ENV"
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 1 ]; then
            echo "::error::The extractor stopped with exit code ${STATUS} before saving anything. See the log above (login failed, site unreachable, or a timeout)."
            exit "${STATUS}"
          fi
      - name: Push to Supabase
        run: python scripts/push_supabase.py --bundle "${STAGING_DIR}" --shard "${{ matrix.shard }}"
      - name: Fail if some schools were incomplete
        if: ${{ env.EXTRACT_STATUS != '0' }}
        run: echo "::warning::Some schools were not fully captured; the rest were pushed."
