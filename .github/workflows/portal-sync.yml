name: Portal sync to Supabase

# Three syncs a day: the first at a random time between 04:00 and 07:00 Pakistan time, the next two exactly
# 8 and 16 hours after it (so roughly 12:00-15:00 and 20:00-23:00), to keep the data live.
# A cheap "gate" job runs every 15 minutes around those windows and asks Supabase (fn_portal_gate) whether
# a planned start time has passed and that slot has not started yet. Shards run one after another, slowly,
# with random pauses between schools. Run manually from the Actions tab at any time (it skips the gate).
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards, run one after another (each takes every Nth school).
        required: false
        default: "6"
        type: string
      only_shard:
        description: Run just one shard, e.g. 3/6 (leave blank to run all shards).
        required: false
        default: ""
        type: string
  schedule:
    - cron: "*/15 23,0-3 * * *"   # 04:00-08:59 PKT  (run 1 window + retries)
    - cron: "*/15 7-11 * * *"     # 12:00-16:59 PKT  (run 2: run 1 + 8 h)
    - cron: "*/15 15-19 * * *"    # 20:00-00:59 PKT  (run 3: run 1 + 16 h)

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: portal-sync/scripts
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 portal-sync/scripts/portal_gate.py >> "$GITHUB_OUTPUT"

  plan:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      total: ${{ steps.m.outputs.total }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          SHARDS: ${{ inputs.shards || '6' }}
          ONLY_SHARD: ${{ inputs.only_shard }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 portal-sync/scripts/fetch_scope.py "$RUNNER_TEMP/codes.txt"
          TOTAL=$(wc -l < "$RUNNER_TEMP/codes.txt")
          N=${SHARDS}; [ "${N}" -gt 12 ] && N=12; [ "${N}" -lt 1 ] && N=1
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          python3 -c "import json,sys; n=int(sys.argv[1]); only=sys.argv[2].strip(); print('matrix='+json.dumps({'shard':([only] if only else [f'{i}/{n}' for i in range(1,n+1)])}))" "${N}" "${ONLY_SHARD}" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1     # one portal login at a time
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: portal-sync
    env:
      SMP_USERNAME: ${{ secrets.SMP_USERNAME }}
      SMP_PASSWORD: ${{ secrets.SMP_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          for v in SMP_USERNAME SMP_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing."; exit 1; fi
          done
      - name: Set up scratch directory
        run: echo "STAGING_DIR=$RUNNER_TEMP/smp-exports" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('portal-sync/requirements.txt', 'portal-sync/scripts/setup_workflow_env.py') }}
      - uses: actions/cache@v5
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('portal-sync/requirements.txt') }}
      - run: python scripts/setup_workflow_env.py
      - if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        run: python -m playwright install --with-deps chromium
      - name: Get the school list from Supabase
        run: python scripts/fetch_scope.py "$RUNNER_TEMP/codes.txt"
      - name: Extract this shard
        run: |
          # Slow and uneven on purpose: 4 s + up to 8 s random between schools, random school order,
          # no new school after 35 minutes. Sign-in is retried; whatever was captured is always pushed.
          for attempt in 1 2 3; do
            set +e
            python -m smp_extractor --non-interactive --headless --codes-file "$RUNNER_TEMP/codes.txt" \
              --shard "${{ matrix.shard }}" --output-dir "${STAGING_DIR}" --delay 4 --jitter 8 --shuffle --max-minutes 35
            STATUS=$?
            set -e
            if [ "${STATUS}" -eq 0 ] || [ "${STATUS}" -eq 1 ]; then break; fi
            echo "::warning::Attempt ${attempt} stopped with exit code ${STATUS}."
            [ "${attempt}" -lt 3 ] && sleep $((60 + RANDOM % 60))
          done
          echo "EXTRACT_STATUS=${STATUS}" >> "$GITHUB_ENV"
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 1 ]; then
            echo "::error::The extractor stopped with exit code ${STATUS} before saving anything (login failed, site unreachable, or a timeout)."
            exit "${STATUS}"
          fi
      - name: Push to Supabase
        run: python scripts/push_supabase.py --bundle "${STAGING_DIR}" --shard "${{ matrix.shard }}"
      - name: Note incomplete schools
        if: ${{ env.EXTRACT_STATUS != '0' }}
        run: echo "::warning::Some schools were not fully captured; the rest were pushed and the missed ones are picked up tomorrow."
