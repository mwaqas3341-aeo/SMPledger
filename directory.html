<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Directory — School Meal Program</title>
<script src="assets/safety.js?v=20261015a"></script>
<script src="assets/layout.js?v=20261119a"></script>
<script src="assets/config.js?v=20261015a"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="assets/styles.css?v=20261103a" />
<style>
  .dir-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .dir-tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
  .dir-tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .dir-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
  .dir-bar > div{min-width:140px}
  .dir-bar input,.dir-bar select{width:100%}
  .dir-table td,.dir-table th{font-size:12.5px;vertical-align:top}
  .dir-modal .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .dir-modal label{display:block;font-size:12px;margin:6px 0 2px}
  .dir-modal input[type=checkbox]{width:auto;margin-right:6px}
  .dir-modal .chk{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .dir-modal .chk label{display:flex;align-items:center;margin:2px 0;font-size:12.5px}
  .dir-warn{color:#b45309;font-size:12px}
  .dir-diff{font-family:monospace;font-size:11.5px;white-space:pre-wrap}
</style>
</head>
<body>
<style id="embedCss"></style>
<div id="app">
  <div id="topbar">
    <div class="brand"><div><div class="eyebrow">SMP · Punjab SED</div><h2>Directory</h2></div><a class="home-link" href="dashboard.html">&larr; Dashboard</a></div>
    <div class="right"><div class="who" id="whoBox">&mdash;</div><button class="btn-secondary" id="signOutBtn" type="button">Sign out</button></div>
  </div>
  <div id="content"></div>
</div>
<div class="toast-area" id="toastArea"></div>

<script>
/* Admin-only management of markaz, schools and user jurisdictions. All writes go through admin-only
   database functions (fn_dir_*), which also keep a permanent change log. The school list itself is frozen
   (no new schools, no deletes, EMIS fixed) by design. */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);
let currentUser = null, currentProfile = null;
let cache = { markaz: [], schools: [], users: [], fallback: "on" };
let tab = "users";
const ROLES = [["aeo","AEO"],["tr","TR (tehsil)"],["admin","Admin"],["super_admin","Super admin"],["school_user","School user"]];

function toast(msg, kind){ const el = document.createElement("div"); el.className = "toast " + (kind === "bad" ? "bad" : "ok"); el.textContent = msg; document.getElementById("toastArea").appendChild(el); setTimeout(() => el.remove(), 4500); }
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });
const $c = () => document.getElementById("content");
const markazName = id => (cache.markaz.find(m => m.id === id) || {}).name || "—";
const uniq = a => [...new Set(a.filter(Boolean))].sort();

async function fetchAll(build){ const out = []; for(let st = 0; ; st += 1000){ const { data, error } = await build().range(st, st + 999); if(error) throw error; out.push(...(data || [])); if(!data || data.length < 1000) break; } return out; }
async function loadAll(){
  const [m, s, u] = await Promise.all([
    fetchAll(() => sb.from("markaz").select("*").order("name")),
    fetchAll(() => sb.from("schools").select("id,emis_code,school_name,markaz_id,school_type,active,wing,outsourced,enrollment,managed_in_smp").order("emis_code")),
    fetchAll(() => sb.from("profiles").select("id,full_name,cnic,role,markaz_id,extra_markaz_ids,tehsil,wing_scope,cell_no,active,managed_in_smp,local_login,jurisdiction_source,jurisdiction_synced_at").order("full_name")),
  ]);
  cache.markaz = m; cache.schools = s; cache.users = u;
  try{ const { data } = await sb.from("directory_settings").select("value").eq("key", "aidb_login_fallback").maybeSingle(); cache.fallback = (data && data.value) || "on"; }catch(e){}
}

function modal(inner, wide){
  const ov = document.createElement("div");
  ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  ov.style.cssText = "position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:14px;";
  ov.innerHTML = `<div class="card dir-modal" style="width:min(${wide || 680}px,100%);max-height:92vh;overflow:auto;margin:0;">${inner}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if(e.target === ov) ov.remove(); });
  return ov;
}
const opts = (list, sel, blank) => (blank ? `<option value="">${esc(blank)}</option>` : "") + list.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(l)}</option>`).join("");
const markazOpts = (sel, blank) => opts(cache.markaz.map(m => [m.id, m.name + (m.tehsil ? " (" + m.tehsil + ")" : "")]), sel, blank);

function render(){
  const problems = problemList().length;
  $c().innerHTML = `<div class="card"><div class="dir-tabs">${[["users","Users & jurisdiction"],["markaz","Markaz"],["schools","Schools"],["problems","Problems" + (problems ? " (" + problems + ")" : "")],["import","Excel import"],["log","Change log"]]
    .map(([k, l]) => `<button type="button" class="dir-tab ${k === tab ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div><div id="tabBody"></div></div>`;
  $c().querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
  ({ users: renderUsers, markaz: renderMarkaz, schools: renderSchools, problems: renderProblems, import: renderImport, log: renderLog })[tab]();
}

/* ---------------- Users ---------------- */
function renderUsers(){
  const body = document.getElementById("tabBody");
  body.innerHTML = `<div class="actions-row"><button class="btn-primary" type="button" id="uNew">+ Add user</button>
    <span class="sub" style="margin-left:10px">Login with A-I-DB password as a fallback: <b>${cache.fallback === "off" ? "OFF (only SMP passwords work)" : "ON"}</b></span>
    <button class="btn-secondary" type="button" id="uFb" style="padding:2px 10px">${cache.fallback === "off" ? "Switch ON" : "Switch OFF"}</button></div>
    <div class="dir-bar">
    <div><label>Search</label><input id="uQ" placeholder="name, CNIC, phone"></div>
    <div><label>Role</label><select id="uRole">${opts(ROLES, "", "All")}</select></div>
    <div><label>Tehsil</label><select id="uTehsil">${opts(uniq(cache.markaz.map(m => m.tehsil)).map(t => [t, t]), "", "All")}</select></div>
    <div><label>Status</label><select id="uAct"><option value="">All</option><option value="1">Active</option><option value="0">Inactive</option></select></div></div>
    <p class="sub" id="uCount"></p>
    <div class="table-wrap"><table class="dir-table"><thead><tr><th>Name</th><th>CNIC</th><th>Role</th><th>Home markaz</th><th>Extra markaz</th><th>Tehsil / wing</th><th>Phone</th><th>Login</th><th></th></tr></thead><tbody id="uBody"></tbody></table></div>`;
  const draw = () => {
    const q = document.getElementById("uQ").value.trim().toLowerCase(), r = document.getElementById("uRole").value, t = document.getElementById("uTehsil").value, a = document.getElementById("uAct").value;
    const rows = cache.users.filter(u => (!q || [u.full_name, u.cnic, u.cell_no].some(x => (x || "").toLowerCase().includes(q))) && (!r || u.role === r)
      && (!t || u.tehsil === t || (cache.markaz.find(m => m.id === u.markaz_id) || {}).tehsil === t) && (a === "" || (a === "1") === !!u.active));
    document.getElementById("uCount").textContent = rows.length + " of " + cache.users.length + " users";
    document.getElementById("uBody").innerHTML = rows.map(u => `<tr>
      <td><b>${esc(u.full_name || "—")}</b></td><td>${esc(u.cnic || "—")}</td><td>${esc(u.role)}${u.active ? "" : ' <span class="pill pill-bad">inactive</span>'}</td>
      <td>${u.markaz_id ? esc(markazName(u.markaz_id)) : (u.role === "aeo" ? '<span class="dir-warn">not set</span>' : "—")}</td>
      <td>${esc((u.extra_markaz_ids || []).map(markazName).join(", ")) || "—"}</td>
      <td>${esc([u.tehsil, u.wing_scope].filter(Boolean).join(" · ")) || (u.role === "tr" ? '<span class="dir-warn">tehsil not set</span>' : "—")}</td>
      <td>${esc(u.cell_no || "—")}</td><td>${u.local_login ? "SMP password" : "A-I-DB"}</td>
      <td><button class="btn-secondary" type="button" data-u="${u.id}" style="padding:2px 10px;">Edit</button></td></tr>`).join("") || `<tr><td colspan="9" class="sub">No users.</td></tr>`;
  };
  ["uQ","uRole","uTehsil","uAct"].forEach(id => document.getElementById(id).addEventListener("input", draw));
  body.addEventListener("click", e => { const b = e.target.closest("[data-u]"); if(b) editUser(cache.users.find(u => u.id === b.dataset.u)); });
  document.getElementById("uNew").addEventListener("click", addUser);
  document.getElementById("uFb").addEventListener("click", async () => {
    const turnOff = cache.fallback !== "off";
    const withPw = cache.users.filter(u => u.local_login && u.active).length, total = cache.users.filter(u => u.active).length;
    if(turnOff && !confirm(`Only ${withPw} of ${total} active users have an SMP password. Everyone else will be unable to log in once this is OFF. Switch OFF anyway?`)) return;
    const { error } = await sb.rpc("fn_dir_set_aidb_fallback", { p_on: !turnOff });
    if(error){ toast(error.message, "bad"); return; }
    toast("Setting saved."); await reload();
  });
  draw();
}
function editUser(u){
  const ov = modal(`<h3>Edit user</h3><p class="sub">${esc(u.cnic || "")} · changes apply to what this person can see, from their next page load. This record becomes "managed in SMP".</p>
    <div class="row2"><div><label>Full name</label><input id="eName" value="${esc(u.full_name || "")}"></div>
      <div><label>Cell number</label><input id="eCell" value="${esc(u.cell_no || "")}"></div>
      <div><label>Role</label><select id="eRole">${opts(ROLES, u.role)}</select></div>
      <div><label>Status</label><select id="eAct"><option value="1" ${u.active ? "selected" : ""}>Active</option><option value="0" ${u.active ? "" : "selected"}>Inactive</option></select></div>
      <div id="wHome"><label>Home markaz (AEO)</label><select id="eHome">${markazOpts(u.markaz_id, "— none —")}</select></div>
      <div id="wTeh"><label>Tehsil (TR)</label><select id="eTeh">${opts(uniq(cache.markaz.map(m => m.tehsil)).map(t => [t, t]), u.tehsil, "— none —")}</select></div>
      <div id="wWing"><label>Wing limit (TR)</label><select id="eWing">${opts([["M-EE","M-EE"],["W-EE","W-EE"]], u.wing_scope, "All wings")}</select></div></div>
    <div id="wExtra"><label>Extra markaz this person also looks after</label><input id="eExQ" placeholder="filter the list…" style="margin-bottom:4px"><div class="chk" id="eEx"></div></div>
    <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><label>SMP password (${u.local_login ? "set" : "not set - logs in with the A-I-DB password"})</label>
      <div style="display:flex;gap:8px"><input id="ePw" type="password" autocomplete="new-password" placeholder="new password, 8+ characters"><button class="btn-secondary" type="button" id="ePwSave">${u.local_login ? "Reset password" : "Set password"}</button></div></div>
    <p class="err" id="eErr"></p>
    <div class="actions-row"><button class="btn-primary" type="button" id="eSave">Save</button><button class="btn-secondary" type="button" id="eClose">Cancel</button></div>`);
  const $ = s => ov.querySelector(s);
  const sel = new Set(u.extra_markaz_ids || []);
  const drawEx = () => { const q = $("#eExQ").value.toLowerCase(); $("#eEx").innerHTML = cache.markaz.filter(m => !q || m.name.toLowerCase().includes(q) || (m.tehsil || "").toLowerCase().includes(q))
    .map(m => `<label><input type="checkbox" value="${m.id}" ${sel.has(m.id) ? "checked" : ""}> ${esc(m.name)} <span class="sub">&nbsp;${esc(m.tehsil || "")}</span></label>`).join(""); };
  drawEx(); $("#eExQ").addEventListener("input", drawEx);
  $("#eEx").addEventListener("change", e => { if(e.target.checked) sel.add(e.target.value); else sel.delete(e.target.value); });
  const roleUI = () => { const r = $("#eRole").value; $("#wHome").style.display = (r === "aeo" || r === "school_user") ? "" : "none"; $("#wExtra").style.display = r === "aeo" ? "" : "none"; $("#wTeh").style.display = $("#wWing").style.display = r === "tr" ? "" : "none"; };
  $("#eRole").addEventListener("change", roleUI); roleUI();
  $("#eClose").addEventListener("click", () => ov.remove());
  $("#ePwSave").addEventListener("click", async () => {
    const pw = $("#ePw").value;
    if(pw.length < 8){ $("#eErr").textContent = "The password must be at least 8 characters."; return; }
    const { data, error } = await sb.functions.invoke("admin-users", { body: { action: "set_password", user_id: u.id, password: pw } });
    if(error || (data && data.error)){ $("#eErr").textContent = (data && data.error) || error.message; return; }
    ov.remove(); toast("Password saved. This person now logs in with it."); await reload();
  });
  $("#eSave").addEventListener("click", async () => {
    const role = $("#eRole").value;
    if(role === "aeo" && !$("#eHome").value && !confirm("This AEO has no home markaz and will see nothing. Save anyway?")) return;
    if(role === "tr" && !$("#eTeh").value && !confirm("This TR has no tehsil and will see nothing. Save anyway?")) return;
    $("#eSave").disabled = true;
    const { error } = await sb.rpc("fn_dir_save_user", { p_id: u.id, p_full_name: $("#eName").value, p_role: role, p_markaz_id: $("#eHome").value || null, p_extra: role === "aeo" ? [...sel] : [],
      p_tehsil: role === "tr" ? $("#eTeh").value || null : null, p_wing_scope: role === "tr" ? $("#eWing").value || null : null, p_cell_no: $("#eCell").value, p_active: $("#eAct").value === "1" });
    if(error){ $("#eErr").textContent = error.message; $("#eSave").disabled = false; return; }
    ov.remove(); toast("User saved."); await reload();
  });
}

/* ---------------- Markaz ---------------- */
function renderMarkaz(){
  const cnt = id => cache.schools.filter(s => s.markaz_id === id).length;
  const aeos = id => cache.users.filter(u => u.role === "aeo" && (u.markaz_id === id || (u.extra_markaz_ids || []).includes(id))).map(u => u.full_name).join(", ");
  document.getElementById("tabBody").innerHTML = `<div class="actions-row"><button class="btn-primary" type="button" id="mNew">+ Add markaz</button></div>
    <div class="table-wrap"><table class="dir-table"><thead><tr><th>Markaz</th><th>Tehsil</th><th>District</th><th>Schools</th><th>AEO(s)</th><th>Status</th><th></th></tr></thead><tbody>${cache.markaz.map(m => `<tr>
      <td><b>${esc(m.name)}</b></td><td>${esc(m.tehsil || "—")}</td><td>${esc(m.district || "—")}</td><td>${cnt(m.id)}</td>
      <td>${esc(aeos(m.id)) || '<span class="dir-warn">no AEO</span>'}</td><td>${m.active ? "Active" : '<span class="pill pill-bad">inactive</span>'}</td>
      <td><button class="btn-secondary" type="button" data-m="${m.id}" style="padding:2px 10px;">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
  document.getElementById("mNew").addEventListener("click", () => editMarkaz(null));
  document.getElementById("tabBody").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if(b) editMarkaz(cache.markaz.find(m => m.id === b.dataset.m)); });
}
function editMarkaz(m){
  const ov = modal(`<h3>${m ? "Edit markaz" : "Add markaz"}</h3><div class="row2"><div><label>Name</label><input id="mName" value="${esc(m ? m.name : "")}"></div>
    <div><label>Tehsil</label><input id="mTeh" list="tehL" value="${esc(m ? m.tehsil || "" : "")}"></div><div><label>District</label><input id="mDis" list="disL" value="${esc(m ? m.district || "" : "")}"></div>
    <div><label>Status</label><select id="mAct"><option value="1" ${!m || m.active ? "selected" : ""}>Active</option><option value="0" ${m && !m.active ? "selected" : ""}>Inactive</option></select></div></div>
    <datalist id="tehL">${uniq(cache.markaz.map(x => x.tehsil)).map(t => `<option value="${esc(t)}">`).join("")}</datalist><datalist id="disL">${uniq(cache.markaz.map(x => x.district)).map(t => `<option value="${esc(t)}">`).join("")}</datalist>
    <p class="err" id="mErr"></p><div class="actions-row"><button class="btn-primary" type="button" id="mSave">Save</button><button class="btn-secondary" type="button" id="mClose">Cancel</button></div>`, 560);
  ov.querySelector("#mClose").addEventListener("click", () => ov.remove());
  ov.querySelector("#mSave").addEventListener("click", async () => {
    const { error } = await sb.rpc("fn_dir_save_markaz", { p_id: m ? m.id : null, p_name: ov.querySelector("#mName").value, p_tehsil: ov.querySelector("#mTeh").value, p_district: ov.querySelector("#mDis").value, p_active: ov.querySelector("#mAct").value === "1" });
    if(error){ ov.querySelector("#mErr").textContent = error.message; return; }
    ov.remove(); toast("Markaz saved."); await reload();
  });
}

/* ---------------- Schools ---------------- */
let sel = new Set();
function renderSchools(){
  const body = document.getElementById("tabBody");
  body.innerHTML = `<div class="actions-row"><button class="btn-primary" type="button" id="sNew">+ Add school</button></div><div class="dir-bar">
    <div><label>Search EMIS / name</label><input id="sQ"></div>
    <div><label>Tehsil</label><select id="sTeh">${opts(uniq(cache.markaz.map(m => m.tehsil)).map(t => [t, t]), "", "All")}</select></div>
    <div><label>Markaz</label><select id="sMk">${markazOpts("", "All")}</select></div>
    <div><label>Wing</label><select id="sWing">${opts([["M-EE","M-EE"],["W-EE","W-EE"]], "", "All")}</select></div>
    <div><label>Status</label><select id="sAct"><option value="">All</option><option value="1">Active</option><option value="0">Inactive / outsourced</option></select></div></div>
    <div class="dir-bar"><span class="sub" id="sCount"></span><div><label>Move ticked schools to</label><select id="sMoveTo">${markazOpts("", "— choose markaz —")}</select></div><button class="btn-secondary" type="button" id="sMove">Move ticked</button></div>
    <p class="sub">Schools cannot be deleted and EMIS codes cannot change. New schools are added with the button above.</p>
    <div class="table-wrap" style="max-height:62vh;overflow:auto"><table class="dir-table"><thead><tr><th><input type="checkbox" id="sAll" style="width:auto"></th><th>EMIS</th><th>School</th><th>Markaz</th><th>Tehsil</th><th>Wing</th><th>Type</th><th>Enrol.</th><th>Status</th><th></th></tr></thead><tbody id="sBody"></tbody></table></div>`;
  let shown = [];
  const draw = () => {
    const q = document.getElementById("sQ").value.trim().toLowerCase(), t = document.getElementById("sTeh").value, mk = document.getElementById("sMk").value, w = document.getElementById("sWing").value, a = document.getElementById("sAct").value;
    shown = cache.schools.filter(s => (!q || s.emis_code.toLowerCase().includes(q) || (s.school_name || "").toLowerCase().includes(q)) && (!mk || s.markaz_id === mk)
      && (!t || (cache.markaz.find(m => m.id === s.markaz_id) || {}).tehsil === t) && (!w || s.wing === w) && (a === "" || (a === "1") === !!s.active));
    document.getElementById("sCount").textContent = shown.length + " of " + cache.schools.length + " schools";
    document.getElementById("sBody").innerHTML = shown.slice(0, 400).map(s => `<tr><td><input type="checkbox" data-pick="${s.id}" style="width:auto" ${sel.has(s.id) ? "checked" : ""}></td><td>${esc(s.emis_code)}</td><td>${esc(s.school_name)}</td>
      <td>${esc(markazName(s.markaz_id))}</td><td>${esc((cache.markaz.find(m => m.id === s.markaz_id) || {}).tehsil || "—")}</td><td>${esc(s.wing || "—")}</td><td>${esc(s.school_type || "—")}</td><td>${s.enrollment ?? "—"}</td>
      <td>${s.outsourced ? '<span class="pill pill-warn">outsourced</span>' : s.active ? "Active" : '<span class="pill pill-bad">inactive</span>'}</td>
      <td><button class="btn-secondary" type="button" data-s="${s.id}" style="padding:2px 10px;">Edit</button></td></tr>`).join("") + (shown.length > 400 ? `<tr><td colspan="10" class="sub">Showing the first 400 - narrow the filter to see the rest.</td></tr>` : "");
  };
  ["sQ","sTeh","sMk","sWing","sAct"].forEach(id => document.getElementById(id).addEventListener("input", draw));
  document.getElementById("sAll").addEventListener("change", e => { shown.slice(0, 400).forEach(s => e.target.checked ? sel.add(s.id) : sel.delete(s.id)); draw(); });
  body.addEventListener("change", e => { const p = e.target.closest("[data-pick]"); if(p){ p.checked ? sel.add(p.dataset.pick) : sel.delete(p.dataset.pick); } });
  body.addEventListener("click", e => { const b = e.target.closest("[data-s]"); if(b) editSchool(cache.schools.find(s => s.id === b.dataset.s)); });
  document.getElementById("sNew").addEventListener("click", addSchool);
  document.getElementById("sMove").addEventListener("click", async () => {
    const to = document.getElementById("sMoveTo").value;
    if(!to || !sel.size){ toast("Tick schools and choose the markaz to move them to.", "bad"); return; }
    if(!confirm(`Move ${sel.size} school(s) to ${markazName(to)}? Users of the old markaz stop seeing them immediately.`)) return;
    const { data, error } = await sb.rpc("fn_dir_move_schools", { p_school_ids: [...sel], p_markaz_id: to });
    if(error){ toast(error.message, "bad"); return; }
    sel = new Set(); toast(data + " school(s) moved."); await reload();
  });
  draw();
}
function editSchool(s){
  const ov = modal(`<h3>Edit school</h3><p class="sub">EMIS ${esc(s.emis_code)} (fixed)</p><div class="row2"><div style="grid-column:1/-1"><label>School name</label><input id="cName" value="${esc(s.school_name)}"></div>
    <div><label>Markaz</label><select id="cMk">${markazOpts(s.markaz_id)}</select></div><div><label>Wing</label><select id="cWing">${opts([["M-EE","M-EE"],["W-EE","W-EE"]], s.wing, "— none —")}</select></div>
    <div><label>Type</label><input id="cType" value="${esc(s.school_type || "")}"></div><div><label>Enrolment</label><input id="cEnr" type="number" min="0" value="${s.enrollment ?? ""}"></div>
    <div><label>Status</label><select id="cAct"><option value="1" ${s.active ? "selected" : ""}>Active</option><option value="0" ${s.active ? "" : "selected"}>Inactive</option></select></div>
    <div><label>Outsourced</label><select id="cOut"><option value="0" ${s.outsourced ? "" : "selected"}>No</option><option value="1" ${s.outsourced ? "selected" : ""}>Yes (also makes it inactive)</option></select></div></div>
    <p class="err" id="cErr"></p><div class="actions-row"><button class="btn-primary" type="button" id="cSave">Save</button><button class="btn-secondary" type="button" id="cClose">Cancel</button></div>`, 620);
  ov.querySelector("#cClose").addEventListener("click", () => ov.remove());
  ov.querySelector("#cSave").addEventListener("click", async () => {
    const enr = ov.querySelector("#cEnr").value;
    const { error } = await sb.rpc("fn_dir_save_school", { p_id: s.id, p_markaz_id: ov.querySelector("#cMk").value, p_name: ov.querySelector("#cName").value, p_wing: ov.querySelector("#cWing").value, p_type: ov.querySelector("#cType").value,
      p_active: ov.querySelector("#cAct").value === "1", p_outsourced: ov.querySelector("#cOut").value === "1", p_enrollment: enr === "" ? null : Number(enr) });
    if(error){ ov.querySelector("#cErr").textContent = error.message; return; }
    ov.remove(); toast("School saved."); await reload();
  });
}

function addUser(){
  const ov = modal(`<h3>Add user</h3><p class="sub">Creates an SMP account that logs in with the CNIC and the password you set here.</p>
    <div class="row2"><div><label>CNIC</label><input id="nCnic"></div><div><label>Full name</label><input id="nName"></div>
      <div><label>Cell number</label><input id="nCell"></div><div><label>Role</label><select id="nRole">${opts(ROLES, "aeo")}</select></div>
      <div id="nwHome"><label>Home markaz</label><select id="nHome">${markazOpts("", "— none —")}</select></div>
      <div id="nwTeh"><label>Tehsil (TR)</label><select id="nTeh">${opts(uniq(cache.markaz.map(m => m.tehsil)).map(t => [t, t]), "", "— none —")}</select></div>
      <div id="nwWing"><label>Wing limit (TR)</label><select id="nWing">${opts([["M-EE","M-EE"],["W-EE","W-EE"]], "", "All wings")}</select></div>
      <div><label>Password (8+ characters)</label><input id="nPw" type="password" autocomplete="new-password"></div></div>
    <p class="err" id="nErr"></p><div class="actions-row"><button class="btn-primary" type="button" id="nSave">Create user</button><button class="btn-secondary" type="button" id="nClose">Cancel</button></div>`);
  const $ = s => ov.querySelector(s);
  const ui = () => { const r = $("#nRole").value; $("#nwHome").style.display = (r === "aeo" || r === "school_user") ? "" : "none"; $("#nwTeh").style.display = $("#nwWing").style.display = r === "tr" ? "" : "none"; };
  $("#nRole").addEventListener("change", ui); ui();
  $("#nClose").addEventListener("click", () => ov.remove());
  $("#nSave").addEventListener("click", async () => {
    const role = $("#nRole").value;
    $("#nSave").disabled = true;
    const { data, error } = await sb.functions.invoke("admin-users", { body: { action: "create_user", cnic: $("#nCnic").value, full_name: $("#nName").value, cell_no: $("#nCell").value, role,
      markaz_id: $("#nHome").value || null, tehsil: role === "tr" ? $("#nTeh").value || null : null, wing_scope: role === "tr" ? $("#nWing").value || null : null, password: $("#nPw").value } });
    if(error || (data && data.error)){ $("#nErr").textContent = (data && data.error) || error.message; $("#nSave").disabled = false; return; }
    ov.remove(); toast("User created. Add extra markaz by editing the user."); await reload();
  });
}

    <div><label>Markaz</label><select id="aM">${markazOpts("", "— choose —")}</select></div><div><label>Wing</label><select id="aW">${opts([["M-EE","M-EE"],["W-EE","W-EE"]], "", "— none —")}</select></div>

/* ---------------- Excel import ---------------- */
const IMP = {
  schools: { cols: ["emis","name","markaz","wing","type","enrollment","active"], alias: { emis:["emis","emis code","emis_code"], name:["school","school name","school_name","name"], markaz:["markaz","markaz name"], wing:["wing"], type:["type","school type","school_type"], enrollment:["enrollment","enrolment"], active:["active","status"] } },
  users: { cols: ["cnic","full_name","role","markaz","extra","tehsil","wing","cell","active"], alias: { cnic:["cnic"], full_name:["name","full name","full_name"], role:["role"], markaz:["markaz","home markaz"], extra:["extra markaz","extra","additional markaz"], tehsil:["tehsil"], wing:["wing","wing scope"], cell:["cell","cell no","phone","cell_no"], active:["active","status"] } },
};
let impRows = [];
function renderImport(){
  document.getElementById("tabBody").innerHTML = `<p class="sub">Upload an Excel (.xlsx) or CSV file. Column names are matched by heading (e.g. EMIS, School, Markaz, Wing, Active). Blank cells leave the current value unchanged. You see a preview first; nothing is saved until you press Apply.</p>
    <div class="dir-bar"><div><label>What are you importing?</label><select id="iType"><option value="schools">Schools (EMIS)</option><option value="users">Users (CNIC)</option></select></div>
      <div><label>File</label><input id="iFile" type="file" accept=".xlsx,.xls,.csv"></div>
      <div id="iAddW"><label><input type="checkbox" id="iAdd" style="width:auto"> Add EMIS codes that don't exist yet</label></div>
      <button class="btn-secondary" type="button" id="iTpl">Download template</button></div>
    <div id="iOut"></div>`;
  const out = document.getElementById("iOut");
  const typ = () => document.getElementById("iType").value;
  document.getElementById("iType").addEventListener("change", () => { impRows = []; out.innerHTML = ""; document.getElementById("iAddW").style.display = typ() === "schools" ? "" : "none"; });
  document.getElementById("iTpl").addEventListener("click", () => {
    const c = IMP[typ()].cols; const blob = new Blob([c.join(",") + "\n"], { type: "text/csv" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = typ() + "-template.csv"; a.click();
  });
  document.getElementById("iFile").addEventListener("change", async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
      const al = IMP[typ()].alias, norm = k => String(k).trim().toLowerCase();
      impRows = raw.map(r => { const o = {}; for(const [col, names] of Object.entries(al)){ const key = Object.keys(r).find(k => names.includes(norm(k))); if(key !== undefined){ let v = String(r[key]).trim(); if(col === "active" && v){ const l = v.toLowerCase(); v = ["yes","true","1","active","y"].includes(l) ? "true" : ["no","false","0","inactive","n"].includes(l) ? "false" : ""; } o[col] = v; } } return o; })
        .filter(o => (o.emis || o.cnic));
      if(!impRows.length){ out.innerHTML = `<p class="err">No usable rows found. Check the column headings against the template.</p>`; return; }
      await runImport(false);
    }catch(err){ out.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  });
  async function runImport(apply){
    const t = typ(); const add = document.getElementById("iAdd").checked;
    const { data, error } = t === "schools" ? await sb.rpc("fn_dir_import_schools", { p_rows: impRows, p_apply: apply, p_allow_add: add }) : await sb.rpc("fn_dir_import_users", { p_rows: impRows, p_apply: apply });
    if(error){ out.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
    const good = data.filter(r => r.ok).length, bad = data.length - good;
    if(apply){ toast(`${good} row(s) applied${bad ? ", " + bad + " skipped" : ""}.`); impRows = []; await reload(); return; }
    out.innerHTML = `<p class="sub"><b>${good}</b> row(s) ready, <b>${bad}</b> with a problem (they will be skipped).</p>
      <div class="actions-row"><button class="btn-primary" type="button" id="iApply" ${good ? "" : "disabled"}>Apply ${good} row(s)</button></div>
      <div class="table-wrap" style="max-height:50vh;overflow:auto"><table class="dir-table"><thead><tr><th>Row</th><th>${t === "schools" ? "EMIS" : "CNIC"}</th><th>Result</th></tr></thead><tbody>${data.map((r, i) => `<tr><td>${i + 2}</td><td>${esc(r.emis || r.cnic || "")}</td><td>${r.ok ? esc(r.action === "add" ? "will be added" : "will be updated") : '<span class="dir-warn">' + esc(r.message) + "</span>"}</td></tr>`).join("")}</tbody></table></div>`;
    document.getElementById("iApply").addEventListener("click", async () => { if(confirm(`Apply ${good} row(s)? This changes live data (it is recorded in the change log).`)) await runImport(true); });
  }
}

/* ---------------- Problems ---------------- */
function problemList(){
  const out = [];
  cache.users.filter(u => u.active && u.role === "aeo" && !u.markaz_id).forEach(u => out.push(["AEO with no home markaz", u.full_name, u.cnic, () => { tab = "users"; render(); editUser(u); }]));
  cache.users.filter(u => u.active && u.role === "tr" && !u.tehsil).forEach(u => out.push(["TR with no tehsil", u.full_name, u.cnic, () => { tab = "users"; render(); editUser(u); }]));
  cache.markaz.filter(m => m.active && !cache.users.some(u => u.active && u.role === "aeo" && (u.markaz_id === m.id || (u.extra_markaz_ids || []).includes(m.id)))).forEach(m => out.push(["Active markaz with no AEO", m.name, m.tehsil || "", () => { tab = "markaz"; render(); editMarkaz(m); }]));
  cache.markaz.filter(m => !m.tehsil).forEach(m => out.push(["Markaz with no tehsil", m.name, "", () => { tab = "markaz"; render(); editMarkaz(m); }]));
  cache.schools.filter(s => s.active && !s.wing).forEach(s => out.push(["Active school with no wing", s.school_name, s.emis_code, () => { tab = "schools"; render(); editSchool(s); }]));
  cache.schools.filter(s => s.active && !cache.markaz.find(m => m.id === s.markaz_id && m.active)).forEach(s => out.push(["Active school in an inactive or missing markaz", s.school_name, s.emis_code, () => { tab = "schools"; render(); editSchool(s); }]));
  return out;
}
function renderProblems(){
  const list = problemList();
  document.getElementById("tabBody").innerHTML = list.length ? `<p class="sub">${list.length} item(s) that leave people without access or schools without an owner.</p><div class="table-wrap"><table class="dir-table"><thead><tr><th>Problem</th><th>Who / what</th><th>Detail</th><th></th></tr></thead><tbody>${list.map((p, i) => `<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td><button class="btn-secondary" type="button" data-p="${i}" style="padding:2px 10px;">Fix</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="sub">No problems found. 🎉</p>`;
  document.getElementById("tabBody").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if(b) list[Number(b.dataset.p)][3](); });
}

/* ---------------- Change log ---------------- */
async function renderLog(){
  const body = document.getElementById("tabBody"); body.innerHTML = `<p class="sub">Loading…</p>`;
  const { data, error } = await sb.from("directory_changes").select("*").order("changed_at", { ascending: false }).limit(200);
  if(error){ body.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  body.innerHTML = `<p class="sub">Latest 200 changes. Kept permanently.</p><div class="table-wrap"><table class="dir-table"><thead><tr><th>When</th><th>By</th><th>What</th><th>Action</th><th>Before → after</th></tr></thead><tbody>${(data || []).map(r => {
    const keys = r.old_value && r.new_value ? Object.keys(r.new_value).filter(k => JSON.stringify(r.old_value[k]) !== JSON.stringify(r.new_value[k]) && !["jurisdiction_synced_at","created_at"].includes(k)) : [];
    const diff = keys.map(k => `${k}: ${JSON.stringify(r.old_value[k])} → ${JSON.stringify(r.new_value[k])}`).join("\n");
    return `<tr><td>${esc(new Date(r.changed_at).toLocaleString())}</td><td>${esc(r.changed_by_name || "—")}</td><td>${esc(r.entity)}: ${esc(r.entity_label || "")}</td><td>${esc(r.action)}</td><td class="dir-diff">${esc(diff)}</td></tr>`; }).join("") || `<tr><td colspan="5" class="sub">No changes yet.</td></tr>`}</tbody></table></div>`;
}

async function reload(){ try{ await loadAll(); }catch(e){ toast(e.message, "bad"); } render(); }
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){ await sb.auth.signOut(); window.location.href = "index.html"; return; }
  if(!["admin","super_admin"].includes(profile.role)){ window.location.href = "dashboard.html"; return; }
  currentProfile = profile;
  document.getElementById("whoBox").innerHTML = `<b>${esc(profile.full_name || currentUser.email)}</b><br>${esc(profile.role)}`;
  $c().innerHTML = `<div class="card"><p class="sub">Loading…</p></div>`;
  try{ await loadAll(); }catch(e){ $c().innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; return; }
  if(new URLSearchParams(location.search).get("embed") !== "1") renderSidebarNav();
  render();
}
if(new URLSearchParams(location.search).get("embed") === "1"){ document.getElementById("embedCss").textContent = "#topbar{display:none!important} body{background:transparent}"; }
boot();
</script>
