<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMP Dashboard — School Meal Program</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="eyebrow">School Education Department · Punjab</div>
    <h1>SMP Dashboard</h1>
    <div id="loginError" class="err hidden"></div>
    <form id="loginForm">
      <label for="loginEmail">Email or CNIC / Personnel Number</label>
      <input id="loginEmail" type="text" autocomplete="username" required />
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required />
      <button class="btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:18px;text-align:center;">
      Accounts are created by an administrator.
    </p>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">SMP · Punjab SED</div>
      <h2>Dashboard</h2>
    </div>
    <nav id="navList"></nav>
    <div class="footer">
      <div id="whoBox">—</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="menuToggle" type="button">☰</button>
        <h1 id="pageTitle">Overview</h1>
      </div>
      <div class="who" id="topWho"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = "https://gsswgpqrphqfomvsdooz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdzc3dncHFycGhxZm9tdnNkb296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjE3OTUsImV4cCI6MjEwMjUzNzc5NX0.8NPY8wXzb99eopHpn-lMjSGPfayGAccz-g9f-Ob6gjQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null, currentSection = "overview";
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }

/* ===================== AUTH ===================== */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  let email = document.getElementById("loginEmail").value.trim();
  if(email && !email.includes("@")) email = email + "@smp.local";
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginError");
  errBox.classList.add("hidden");
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errBox.textContent = error.message; errBox.classList.remove("hidden"); return; }
  await afterLogin();
});
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

async function afterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return showLogin();
  currentUser = user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  const errBox = document.getElementById("loginError");
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    errBox.textContent = "This account is not active. Contact your administrator.";
    errBox.classList.remove("hidden");
    return showLogin();
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
function showLogin(){ document.getElementById("loginScreen").classList.remove("hidden"); document.getElementById("app").classList.add("hidden"); }
function showApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("whoBox").innerHTML = `<strong>${esc(currentProfile.full_name)}</strong><br/>${esc(currentProfile.role)}`;
  document.getElementById("topWho").textContent = currentUser.email;
  buildNav();
  navigate("overview");
}

async function loadRefData(){
  const [{ data: markaz }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name").eq("active", true).order("name"),
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  cache.products = products || [];

  let schoolsQuery = sb.from("schools").select("id,school_name,emis_code,markaz_id").eq("active", true).order("school_name");
  if(currentProfile.role === "aeo") schoolsQuery = schoolsQuery.eq("markaz_id", currentProfile.markaz_id);
  if(currentProfile.role === "school_user") schoolsQuery = schoolsQuery.eq("id", currentProfile.school_id);
  const { data: schools } = await schoolsQuery;
  cache.schools = schools || [];
}

/* ===================== NAV ===================== */
const SECTIONS = [{ id:"overview", label:"Overview" }];
function buildNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const a = document.createElement("a");
    a.className = "nav-item" + (s.id === currentSection ? " active" : "");
    a.textContent = s.label;
    a.dataset.id = s.id;
    a.onclick = () => navigate(s.id);
    nav.appendChild(a);
  });
}
document.getElementById("menuToggle").onclick = () => document.getElementById("sidebar").classList.toggle("open");

async function navigate(id){
  currentSection = id;
  document.querySelectorAll("#navList .nav-item").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  document.getElementById("sidebar").classList.remove("open");
  const content = document.getElementById("content");
  content.innerHTML = `<p style="color:var(--ink-soft)">Loading…</p>`;
  try{
    await renderOverview(content);
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  }
}

/* ===================== OVERVIEW ===================== */
async function renderOverview(content){
  const defaultFrom = daysAgoStr(30);
  const defaultTo = todayStr();
  const markazOpts = cache.markaz.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const productOpts = cache.products.map(p => `<option value="${p.id}">${esc(p.product_name)}</option>`).join("");

  content.innerHTML = `
    <div class="card">
      <h3>Filters</h3>
      <form id="dashFilterForm" class="form-row">
        <div><label>From</label><input type="date" name="from" value="${defaultFrom}"/></div>
        <div><label>To</label><input type="date" name="to" value="${defaultTo}"/></div>
        <div><label>Markaz</label><select name="markaz_id"><option value="">All</option>${markazOpts}</select></div>
        <div><label>Product</label><select name="product_id"><option value="">All</option>${productOpts}</select></div>
        <div><label>Low stock threshold</label><input type="number" name="low_threshold" value="20" min="0" step="1"/></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Apply</button></div>
      </form>
    </div>
    <div id="dashResults"><p style="color:var(--ink-soft)">Loading…</p></div>`;

  document.getElementById("dashFilterForm").addEventListener("submit", (e) => { e.preventDefault(); loadOverview(); });
  await loadOverview();
}

async function loadOverview(){
  const fd = new FormData(document.getElementById("dashFilterForm"));
  const from = fd.get("from"), to = fd.get("to");
  const markazId = fd.get("markaz_id") || null;
  const productId = fd.get("product_id") || null;
  const lowThreshold = Number(fd.get("low_threshold")) || 0;
  const box = document.getElementById("dashResults");
  box.innerHTML = `<p style="color:var(--ink-soft)">Calculating…</p>`;

  const scopedSchoolIds = (markazId ? cache.schools.filter(s => s.markaz_id === markazId) : cache.schools).map(s => s.id);
  if(scopedSchoolIds.length === 0){
    box.innerHTML = `<div class="card">No schools in scope.</div>`;
    return;
  }

  // ---- Balances (as of now), scoped ----
  let balQuery = sb.from("v_school_balances").select("*").in("school_id", scopedSchoolIds);
  if(productId) balQuery = balQuery.eq("product_id", productId);
  const { data: balances, error: balErr } = await balQuery;
  if(balErr){ box.innerHTML = `<div class="card"><div class="err">${esc(balErr.message)}</div></div>`; return; }

  // ---- Ledger movement within range, scoped ----
  let txQuery = sb.from("inventory_transactions").select("school_id, product_id, quantity, transaction_type")
    .in("school_id", scopedSchoolIds).gte("txn_date", from).lte("txn_date", to);
  if(productId) txQuery = txQuery.eq("product_id", productId);
  const { data: txns, error: txErr } = await txQuery;
  if(txErr){ box.innerHTML = `<div class="card"><div class="err">${esc(txErr.message)}</div></div>`; return; }

  const receivedByProduct = {}, consumedByProduct = {};
  const schoolsReceiving = { }, schoolsConsuming = { };
  (txns||[]).forEach(t => {
    const pname = cache.products.find(p => p.id === t.product_id)?.product_name || t.product_id;
    if(t.transaction_type === "SCHOOL_RECEIPT"){
      receivedByProduct[pname] = (receivedByProduct[pname]||0) + Number(t.quantity);
      (schoolsReceiving[pname] ||= new Set()).add(t.school_id);
    }
    if(t.transaction_type === "CONSUMPTION"){
      consumedByProduct[pname] = (consumedByProduct[pname]||0) + Math.abs(Number(t.quantity));
      (schoolsConsuming[pname] ||= new Set()).add(t.school_id);
    }
  });

  // ---- Comparison summary (scoped by RLS automatically; filter product client-side) ----
  let cmpQuery = sb.from("v_company_vs_aeo_comparison").select("status, product_id").limit(2000);
  if(productId) cmpQuery = cmpQuery.eq("product_id", productId);
  const { data: cmpRows } = await cmpQuery;
  const cmpCounts = { "Matched":0, "Short Received":0, "Excess Received":0, "Company Record Missing":0, "AEO Record Missing":0 };
  (cmpRows||[]).forEach(r => { cmpCounts[r.status] = (cmpCounts[r.status]||0) + 1; });

  // ---- Inventory health ----
  const zeroStock = (balances||[]).filter(b => Number(b.balance) === 0);
  const lowStock = (balances||[]).filter(b => Number(b.balance) > 0 && Number(b.balance) <= lowThreshold);
  const negative = (balances||[]).filter(b => Number(b.balance) < 0);

  // ---- Loans & transfers in range, scoped ----
  let loanQuery = sb.from("inventory_loans").select("id, status", { count:"exact" })
    .or(`from_school_id.in.(${scopedSchoolIds.join(",")}),to_school_id.in.(${scopedSchoolIds.join(",")})`)
    .gte("loan_date", from).lte("loan_date", to);
  const { data: loanRows } = await loanQuery;
  const outstandingLoans = (loanRows||[]).filter(l => ["pending","approved","partially_returned"].includes(l.status)).length;

  let transferQuery = sb.from("school_transfers").select("id", { count:"exact" })
    .or(`from_school_id.in.(${scopedSchoolIds.join(",")}),to_school_id.in.(${scopedSchoolIds.join(",")})`)
    .gte("transfer_date", from).lte("transfer_date", to);
  const { count: transferCount } = await transferQuery;

  box.innerHTML = `
    <div class="card">
      <h3>Overall</h3>
      <div class="grid-4">
        <div class="stat"><div class="n">${scopedSchoolIds.length}</div><div class="l">Schools in scope</div></div>
        ${Object.keys(receivedByProduct).length === 0 ? "" : Object.entries(receivedByProduct).map(([p,q]) => `
          <div class="stat"><div class="n">${fmt(q)}</div><div class="l">${esc(p)} received</div></div>`).join("")}
        ${Object.keys(consumedByProduct).length === 0 ? "" : Object.entries(consumedByProduct).map(([p,q]) => `
          <div class="stat"><div class="n">${fmt(q)}</div><div class="l">${esc(p)} consumed</div></div>`).join("")}
        ${(balances||[]).length === 0 ? "" : Object.entries(
            (balances||[]).reduce((acc,b) => { acc[b.product_name] = (acc[b.product_name]||0) + Number(b.balance); return acc; }, {})
          ).map(([p,q]) => `<div class="stat"><div class="n">${fmt(q)}</div><div class="l">${esc(p)} remaining</div></div>`).join("")}
      </div>
    </div>

    <div class="card">
      <h3>Company vs AEO Comparison</h3>
      <div class="grid-4">
        <div class="stat"><div class="n">${cmpCounts["Matched"]}</div><div class="l">Matched</div></div>
        <div class="stat"><div class="n">${cmpCounts["Short Received"]}</div><div class="l">Short</div></div>
        <div class="stat"><div class="n">${cmpCounts["Excess Received"]}</div><div class="l">Excess</div></div>
        <div class="stat"><div class="n">${cmpCounts["Company Record Missing"]+cmpCounts["AEO Record Missing"]}</div><div class="l">Missing a record</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Inventory Health</h3>
      <div class="grid-4">
        <div class="stat"><div class="n">${lowStock.length}</div><div class="l">Low stock (≤ ${lowThreshold})</div></div>
        <div class="stat"><div class="n">${zeroStock.length}</div><div class="l">Zero stock</div></div>
        <div class="stat"><div class="n" style="color:${negative.length ? 'var(--bad-fg)' : 'inherit'}">${negative.length}</div><div class="l">Negative balance (should be 0)</div></div>
        <div class="stat"><div class="n">${outstandingLoans}</div><div class="l">Outstanding loans</div></div>
        <div class="stat"><div class="n">${transferCount ?? 0}</div><div class="l">Transfers in period</div></div>
      </div>
      ${renderFlagTable("Low stock schools", lowStock)}
      ${renderFlagTable("Zero stock schools", zeroStock)}
      ${negative.length ? renderFlagTable("⚠ Negative balance schools (investigate)", negative) : ""}
    </div>`;
}

function renderFlagTable(title, rows){
  if(rows.length === 0) return "";
  return `
    <div style="margin-top:18px;">
      <div style="font-weight:600; font-size:13px; color:var(--navy); margin-bottom:8px;">${esc(title)}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>School</th><th>EMIS</th><th>Product</th><th>Balance</th></tr></thead>
        <tbody>${rows.slice(0,100).map(r => `
          <tr><td>${esc(r.school_name)}</td><td>${esc(r.emis_code)}</td><td>${esc(r.product_name)}</td><td>${fmt(r.balance)}</td></tr>`).join("")}
        </tbody>
      </table></div>
      ${rows.length > 100 ? `<div class="sub" style="margin-top:6px;">Showing first 100 of ${rows.length}.</div>` : ""}
    </div>`;
}

/* ===================== BOOTSTRAP ===================== */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); } else { showLogin(); }
})();
</script>
</body>
</html>
