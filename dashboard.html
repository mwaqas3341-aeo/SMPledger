<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMP Dashboard — School Meal Program</title>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">SMP · Punjab SED</div>
        <h2>Dashboard</h2>
      </div>
    </div>
    <div class="right">
      <div class="who" id="whoBox">&mdash;</div>
      <button class="btn-secondary" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div class="menu-cards" id="moduleCards"></div>
  <div id="content"></div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ===================== CONFIG ===================== */
const sb = supabase.createClient(SMP_CONFIG.SUPABASE_URL, SMP_CONFIG.SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null, currentProfile = null, currentSection = "overview";
let cache = { markaz:[], schools:[], products:[] };

/* ===================== HELPERS ===================== */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind === "bad" ? "bad" : "ok");
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmt(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }

/* ===================== AUTH ===================== */
document.getElementById("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); window.location.href = "index.html"; });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }
  currentUser = session.user;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    window.location.href = "index.html";
    return;
  }
  currentProfile = profile;
  await loadRefData();
  showApp();
}
boot();

async function loadRefData(){
  const [{ data: markaz }, { data: products }] = await Promise.all([
    sb.from("markaz").select("id,name,district,tehsil").eq("active", true).order("name"),
    sb.from("products").select("id,product_name,unit_name").eq("active", true).order("product_name"),
  ]);
  cache.markaz = markaz || [];
  cache.products = products || [];

  let schoolsQuery = sb.from("schools").select("id,school_name,emis_code,markaz_id,wing").eq("active", true).order("emis_code");
  if(currentProfile.role === "aeo") schoolsQuery = schoolsQuery.eq("markaz_id", currentProfile.markaz_id);
  if(currentProfile.role === "school_user") schoolsQuery = schoolsQuery.eq("id", currentProfile.school_id);
  const { data: schools } = await schoolsQuery;
  cache.schools = schools || [];
}

function showApp(){
  document.getElementById("whoBox").innerHTML = `<b>${esc(currentProfile.full_name || currentUser.email)}</b><br>${esc(currentProfile.role)}`;
  buildModuleCards();
  renderOverviewSection();
}

/* ===================== MODULE LAUNCHER ===================== */
// This is the app's main navigation - a card grid, not a sidebar. Report
// Comparison only appears for admin/super_admin/tr, matching its RLS/RPC access.
const MODULES = [
  { href:"inventory.html",   label:"Inventory Received",   desc:"Record and verify deliveries" },
  { href:"consumption.html", label:"Consumption",          desc:"Daily distribution by school" },
  { href:"operations.html",  label:"Operations",           desc:"Post inventory adjustments" },
  { href:"transfers.html",   label:"Transfers & Rationalization", desc:"Move stock between schools" },
  { href:"report-generation.html", label:"Reports & Demand", desc:"Period reports and enrollment-based demand" },
  { href:"report-comparison.html", label:"Report Comparison", desc:"Company vs AEO data", roles:["admin","super_admin","tr"] },
];
function buildModuleCards(){
  const wrap = document.getElementById("moduleCards");
  wrap.innerHTML = "";
  MODULES.filter(m => !m.roles || m.roles.includes(currentProfile.role)).forEach(m => {
    const a = document.createElement("a");
    a.className = "menu-card";
    a.href = m.href;
    a.innerHTML = `<span class="label">${esc(m.label)}</span><span class="desc">${esc(m.desc)}</span>`;
    wrap.appendChild(a);
  });
}

async function renderOverviewSection(){
  const content = document.getElementById("content");
  content.innerHTML = `<p style="color:var(--ink-soft)">Loading…</p>`;
  try{
    await renderOverview(content);
  }catch(err){
    content.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  }
}

/* ===================== OVERVIEW ===================== */
const ENROLMENT_URL = "https://raw.githubusercontent.com/mwaqas3341-aeo/SIS-online-Enrolment-Updater/main/data/layyah.json";
const WING_OPTIONS = ["M-EE", "W-EE", "SE"];

async function renderOverview(content){
  const isAdmin = ["admin","super_admin"].includes(currentProfile.role);
  const isTr = currentProfile.role === "tr";
  const tehsils = [...new Set(cache.markaz.map(m => m.tehsil))].filter(Boolean).sort();

  content.innerHTML = `
    <div class="card">
      <h3>Filters</h3>
      <form id="dashFilterForm" class="form-row">
        <div><label>Tehsil</label><select id="dashTehsil"><option value="">All</option>${tehsils.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select></div>
        <div><label>Wing</label><select id="dashWing"><option value="">All</option>${WING_OPTIONS.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("")}</select></div>
        <div><label>Markaz</label><select name="markaz_id" id="dashMarkaz"><option value="">All</option></select></div>
        <div style="align-self:end;"><button class="btn-primary" type="submit">Apply</button></div>
      </form>
    </div>
    <div id="dashResults"><p style="color:var(--ink-soft)">Loading…</p></div>`;

  const tEl = document.getElementById("dashTehsil"), mEl = document.getElementById("dashMarkaz");
  function refreshMarkazOptions(){
    const t = tEl.value;
    const list = cache.markaz.filter(m => !t || m.tehsil === t);
    mEl.innerHTML = `<option value="">All</option>` + list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  }
  // AEO/TR default their tehsil filter to their own scope, matching every other page's convention.
  if(!isAdmin && currentProfile.tehsil) tEl.value = currentProfile.tehsil;
  refreshMarkazOptions();
  tEl.addEventListener("change", refreshMarkazOptions);

  document.getElementById("dashFilterForm").addEventListener("submit", (e) => { e.preventDefault(); loadOverview(); });
  await loadOverview();
}

async function loadOverview(){
  const tehsil = document.getElementById("dashTehsil").value || null;
  const wing = document.getElementById("dashWing").value || null;
  const markazId = document.getElementById("dashMarkaz").value || null;
  const box = document.getElementById("dashResults");
  box.innerHTML = `<p style="color:var(--ink-soft)">Calculating…</p>`;

  let scoped = cache.schools;
  if(markazId) scoped = scoped.filter(s => s.markaz_id === markazId);
  else if(tehsil) scoped = scoped.filter(s => cache.markaz.find(m => m.id === s.markaz_id)?.tehsil === tehsil);
  if(wing) scoped = scoped.filter(s => s.wing === wing);
  const scopedSchoolIds = scoped.map(s => s.id);
  if(scopedSchoolIds.length === 0){
    box.innerHTML = `<div class="card">No schools in scope.</div>`;
    return;
  }
  const narrowed = !!(markazId || tehsil || wing); // whether we deliberately narrowed vs relying on RLS's full scope

  // ---- Balances (as of now) ----
  // Only add an explicit school filter when deliberately narrowed - otherwise
  // rely on RLS (security_invoker view). Passing all 741 school IDs in one
  // .in() filter for the "everything" case produces a query string long
  // enough to be rejected outright as a 400.
  let balQuery = sb.from("v_school_balances").select("*");
  if(narrowed) balQuery = balQuery.in("school_id", scopedSchoolIds);
  const { data: balances, error: balErr } = await balQuery;
  if(balErr){ box.innerHTML = `<div class="card"><div class="err">${esc(balErr.message)}</div></div>`; return; }

  // ---- Comparison summary (scoped by RLS automatically) ----
  const { data: cmpRows } = await sb.from("v_company_vs_aeo_comparison").select("status").limit(2000);
  const cmpCounts = { "Matched":0, "Short Received":0, "Excess Received":0, "AEO entered, company did not provide":0, "Company provided, AEO did not enter":0 };
  (cmpRows||[]).forEach(r => { cmpCounts[r.status] = (cmpCounts[r.status]||0) + 1; });

  // ---- Outstanding rationalization (current status, not period-bound) ----
  let loanQuery = sb.from("inventory_loans").select("id, status");
  if(markazId) loanQuery = loanQuery.eq("markaz_id", markazId);
  const { data: loanRows } = await loanQuery;
  const outstandingLoans = (loanRows||[]).filter(l => ["pending","approved","partially_returned"].includes(l.status)).length;

  // ---- Enrolment, fetched fresh right now - never stored - to compute
  // days-of-stock-remaining per school (same logic as the Demand sheet). ----
  let enrolmentByEmis = {}, enrolmentError = null;
  try{
    const res = await fetch(ENROLMENT_URL, { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const enrolData = await res.json();
    (enrolData.schools || []).forEach(s => { enrolmentByEmis[s.emis_code] = s.total_school_students; });
  }catch(err){
    enrolmentError = err.message;
  }

  const milk = cache.products.find(p => p.product_name.toLowerCase().includes("milk"));
  const biscuit = cache.products.find(p => p.product_name.toLowerCase().includes("biscuit"));
  const balanceBy = {};
  (balances||[]).forEach(b => { (balanceBy[b.school_id] ||= {})[b.product_id] = Number(b.balance); });

  const health = scoped.map(s => {
    const enrolment = enrolmentByEmis[s.emis_code];
    const milkBal = balanceBy[s.id]?.[milk?.id] ?? 0;
    const biscuitBal = balanceBy[s.id]?.[biscuit?.id] ?? 0;
    const milkDays = enrolment ? milkBal / enrolment : null;
    const biscuitDays = enrolment ? biscuitBal / enrolment : null;
    return {
      school: s, enrolment, milkBal, biscuitBal, milkDays, biscuitDays,
      milkLow: milkDays !== null && milkDays < 6,
      biscuitLow: biscuitDays !== null && biscuitDays < 2,
    };
  });
  const milkLowRows = health.filter(r => r.milkLow).sort((a,b) => a.milkDays - b.milkDays);
  const biscuitLowRows = health.filter(r => r.biscuitLow).sort((a,b) => a.biscuitDays - b.biscuitDays);
  const zeroStockRows = health.filter(r => r.milkBal <= 0 || r.biscuitBal <= 0);

  box.innerHTML = `
    <div class="card">
      <h3>Overall</h3>
      <div class="grid-4">
        <div class="stat"><div class="n">${scopedSchoolIds.length}</div><div class="l">Schools in scope</div></div>
        ${(balances||[]).length === 0 ? "" : Object.entries(
            (balances||[]).filter(b => scopedSchoolIds.includes(b.school_id)).reduce((acc,b) => { acc[b.product_name] = (acc[b.product_name]||0) + Number(b.balance); return acc; }, {})
          ).map(([p,q]) => `<div class="stat"><div class="n">${fmt(q)}</div><div class="l">${esc(p)} remaining</div></div>`).join("")}
      </div>
    </div>

    <div class="card">
      <h3>Company vs AEO Comparison</h3>
      <div class="grid-4">
        <div class="stat"><div class="n">${cmpCounts["Matched"]}</div><div class="l">Matched</div></div>
        <div class="stat"><div class="n">${cmpCounts["Short Received"]}</div><div class="l">Short</div></div>
        <div class="stat"><div class="n">${cmpCounts["Excess Received"]}</div><div class="l">Excess</div></div>
        <div class="stat"><div class="n">${cmpCounts["AEO entered, company did not provide"] + cmpCounts["Company provided, AEO did not enter"]}</div><div class="l">Missing a record</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Inventory Health</h3>
      <p class="sub">Days of stock remaining = current balance ÷ enrolment, assuming one pack per enrolled student per scheduled day. Milk flagged under 6 days, Biscuits under 2 days.</p>
      ${enrolmentError ? `<div class="err" style="margin-bottom:14px;">Could not fetch enrolment data (${esc(enrolmentError)}) - days-remaining figures below are unavailable.</div>` : ""}
      <div class="grid-4">
        <div class="stat"><div class="n" style="color:${milkLowRows.length ? 'var(--bad-fg)' : 'inherit'}">${milkLowRows.length}</div><div class="l">Milk &lt; 6 days</div></div>
        <div class="stat"><div class="n" style="color:${biscuitLowRows.length ? 'var(--bad-fg)' : 'inherit'}">${biscuitLowRows.length}</div><div class="l">Biscuits &lt; 2 days</div></div>
        <div class="stat"><div class="n">${zeroStockRows.length}</div><div class="l">Zero or negative stock</div></div>
        <div class="stat"><div class="n">${outstandingLoans}</div><div class="l">Outstanding rationalization</div></div>
      </div>
      ${renderHealthTable("⚠ Milk under 6 days", milkLowRows, "milk")}
      ${renderHealthTable("⚠ Biscuits under 2 days", biscuitLowRows, "biscuit")}
    </div>`;
}

function renderHealthTable(title, rows, highlight){
  if(rows.length === 0) return "";
  return `
    <div style="margin-top:18px;">
      <div style="font-weight:600; font-size:13px; color:var(--navy); margin-bottom:8px;">${esc(title)}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>EMIS</th><th>School</th><th>Enrolment</th><th>Milk Balance</th><th>Milk Days</th><th>Biscuit Balance</th><th>Biscuit Days</th></tr></thead>
        <tbody>${rows.slice(0,100).map(r => `
          <tr>
            <td>${esc(r.school.emis_code)}</td>
            <td>${esc(r.school.school_name)}</td>
            <td>${r.enrolment != null ? fmt(r.enrolment) : '<span class="pill pill-warn">Not found</span>'}</td>
            <td style="${highlight==='milk' ? 'color:var(--bad-fg);font-weight:600;' : ''}">${fmt(r.milkBal)}</td>
            <td style="${highlight==='milk' ? 'color:var(--bad-fg);font-weight:600;' : ''}">${r.milkDays != null ? fmt(r.milkDays) : "—"}</td>
            <td style="${highlight==='biscuit' ? 'color:var(--bad-fg);font-weight:600;' : ''}">${fmt(r.biscuitBal)}</td>
            <td style="${highlight==='biscuit' ? 'color:var(--bad-fg);font-weight:600;' : ''}">${r.biscuitDays != null ? fmt(r.biscuitDays) : "—"}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
      ${rows.length > 100 ? `<div class="sub" style="margin-top:6px;">Showing first 100 of ${rows.length}.</div>` : ""}
    </div>`;
}

</script>
</body>
</html>
